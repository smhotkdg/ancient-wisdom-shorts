# 화풍 프리셋: 음영 있는 잉크 일러스트 (checkvalve 레포에서 이집트·폼페이에 승인된 화풍)
# 화풍 교체 예시용. episode.yaml 에 `style: ink-illustration` 으로 쓰면 적용된다.

name: ink-illustration
label: 잉크 일러스트
image_prefix: >-
  Warm realistic-shaded ink illustration, fine linework with soft painted shading,
  textured paper feel, gold, bronze, linen and limestone textures, gentle natural light,
  vertical 9:16 composition.
image_suffix: >-
  Main action in the middle of the frame, key subjects inside the central 80% of the width. No text, no letters, 
  no captions, no logos, no watermark, no modern objects.
# 화면 제목이 있는 편(show_title: true)에만 붙는다 (2026-11-10 사용자: 제목 없는 편은 구도 제약 없음)
title_safe_suffix: >-
  Keep the top 30% of the image empty and simple (plain sky or plain wall) for a title: no heads, 
  faces, raised hands, hats or key objects in the top 30%. The top of every person's head must be at least 30% 
  down from the top edge; place the main character's face about 40-55% down from the top (framed from the knees 
  or waist up, with clear empty space above the head); even in close-ups keep the whole face in the middle of 
  the frame, never in the upper third.
character_sheet_template: >-
  Character reference sheet of {description}. Full body, front view and three-quarter view,
  neutral pose, plain paper background, same outfit in both views.
motion_suffix: >-
  Keep the character, outfit and background consistent with the image. Smooth natural motion. Natural ambient 
  sound effects only: no speech, no voices, no music, no text on screen.
title_safe_motion: >-
  The camera never tilts, rises or pushes in so that anyone's head moves into the top 30% of the frame; the 
  character does not stand up, jump or raise their head toward the top; keep every face in the middle of the 
  frame for the whole clip.
palette_note: "따뜻한 금속·린넨·석회암 색"
