# 058 신채호 — 일제 호적에 끝내 오르지 않아 '나라 없는 사람'으로 산 선비, 73년 만에 대한민국 국민이 되다 (유명 독립운동가 편, 실사)
id: "058"
style: photoreal
slug: shin-chaeho-registry
status: done
working_title: 이름 한 줄 올리기를 거부한 선비, 73년 뒤 무슨 일이 일어났을까?
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["이름 한 줄을", "끝까지 거부했다고?"]
hook: 혼이 쏙 빠졌습니다
caption_keywords: [혼이 쏙 빠졌습니다, 호적, 일본 백성, 나라 없는 사람, 역사, 선 채로, "1936년", "2009년", 73년]

story:
  hero: 선비
  reveal: [신채호, 단재]

characters:
  - id: seonbi
    name: 선비
    name_en: Korean scholar in exile in 1910s China
    description: >-
      a lean Korean man in his mid-30s with a sharp, serious, unbending face, intense dark eyes, short-cropped black hair
      and a thin moustache, standing very straight, wearing a plain dark grey Chinese-style long gown over a white
      collar, simple black cloth shoes, ink-stained fingers
    note: 이야기 주인공. 1910년 중국으로 망명한 언론인·역사가·독립운동가 (마지막 대사 전까지 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1910년 나라를 빼앗기자, 한 선비는 혼이 쏙 빠졌습니다."
        captions: ["1910년 나라를 빼앗기자", "한 선비는 / 혼이 쏙 빠졌습니다"]
      - text: "곧 일제는 조선 사람을 모두 자기네 호적에 올렸거든요."
        captions: ["곧 일제는 / 조선 사람을 모두", "자기네 호적에 올렸거든요"]
    visual: 1910년 항구, 선비가 작은 짐을 들고 배에 오르기 전 뒤를 돌아본다 / 관청 책상 위 두꺼운 호적 장부에 붓으로 이름이 적혀 나간다
    image_prompt: >-
      A grey harbor pier in 1910 with an old steamship behind, the man in the middle of the frame seen from the waist up,
      holding a small cloth travel bundle and looking back over his shoulder toward the land with a stunned, hollow
      expression. Overcast sky. No other people nearby.
    characters: [seonbi]
    motion_prompt: >-
      Sea wind moves his gown; he stares back at the shore for a long moment, then slowly turns toward the ship.
    camera: slow push in at eye level
    extra_clips:
      - image_prompt: >-
          Close-up of a thick bound government register book open on a wooden office desk in the 1910s, a clerk's hand
          writing rows of names with a brush, the writing blurred and unreadable. Only the hand is visible.
        motion_prompt: >-
          The brush fills in another row and the hand turns the page to a new blank sheet.
        camera: macro static

  - id: s02
    beat: problem
    lines:
      - text: "호적에 오르면 일본의 백성, 오르지 않으면 나라 없는 사람이 되는 거였죠."
        captions: ["호적에 오르면 / 일본의 백성", "오르지 않으면 / 나라 없는 사람이", "되는 거였죠"]
    visual: 갈림길에 선 선비, 한쪽은 밝은 관청 문, 다른 쪽은 어두운 들길
    image_prompt: >-
      The man seen from the waist up in the middle of the frame, standing at a fork in a dirt road at dusk, on one side a
      lit official building gate in the distance, on the other side a dark empty country path, his face grave and
      torn. No other people.
    characters: [seonbi]
    motion_prompt: >-
      He looks toward the lit gate, then toward the dark path, his jaw tightening.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "이름 한 줄을 올릴 것인가, 말 것인가. 선비의 선택은 무엇이었을까요?"
        captions: ["이름 한 줄을 / 올릴 것인가, 말 것인가", "선비의 선택은 / 무엇이었을까요?"]
    visual: 등잔 아래 선비가 빈 종이 위에 붓을 든 채 멈춰 있다
    image_prompt: >-
      A small rented room at night, the man seen from the waist up in the middle of the frame, sitting very straight at a
      low desk under an oil lamp, holding a brush above a blank sheet of paper without writing, his face still and
      resolute. Plain wall behind him. No other people.
    characters: [seonbi]
    motion_prompt: >-
      The lamp flickers; he holds the brush still above the paper, then slowly lays it down unused.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 선비는 끝내 호적에 오르지 않았습니다. 일본의 백성이 될 순 없었으니까요."
        captions: ["그래서 선비는 / 끝내 호적에", "오르지 않았습니다", "일본의 백성이 / 될 순 없었으니까요"]
    visual: 선비가 어두운 들길 쪽으로 망설임 없이 걸어간다
    image_prompt: >-
      The man in the middle of the frame seen from the knees up, walking steadily down the dark country path at dusk with
      his small bundle, back straight, face calm and unyielding, the lit official gate small and far behind him. No
      other people.
    characters: [seonbi]
    motion_prompt: >-
      He walks steadily forward along the dark path without looking back as the wind moves the grass.
    camera: slow tracking backward at eye level

  - id: s05
    beat: solution
    lines:
      - text: "그러자 이번엔 중국 땅에서, 우리 옛 역사를 다시 써 내려갔죠."
        captions: ["그러자 이번엔 중국 땅에서", "우리 옛 역사를 / 다시 써 내려갔죠"]
    visual: 중국풍 셋방 책상에 옛 책들이 쌓여 있고, 선비가 꼿꼿이 앉아 붓으로 원고를 써 내려간다 (글자 흐릿)
    image_prompt: >-
      A small rented room in a 1910s Chinese city with old books and scrolls piled on a wooden desk, the man seen from the
      waist up in the middle of the frame, sitting very upright and writing a manuscript with a brush, focused and
      tireless. All writing blurred and unreadable. No other people.
    characters: [seonbi]
    motion_prompt: >-
      He writes steadily, pauses to check an old book, and continues writing without bending his back.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of a brush writing vertical lines on a thick stack of manuscript paper beside open old books, the
          writing soft and unreadable. Only the hand is visible.
        characters: [seonbi]
        motion_prompt: >-
          The brush finishes a line and moves to the next column.
        camera: macro static

  - id: s06
    beat: twist
    lines:
      - text: "그런데 이 선비, 세수도 허리를 굽히지 않고 선 채로 했다고 합니다. 얼마나 꼿꼿했을까요?"
        captions: ["그런데 이 선비", "세수도 허리를 / 굽히지 않고", "선 채로 했다고 합니다", "얼마나 꼿꼿했을까요?"]
    visual: 이른 아침 마당, 선비가 허리를 꼿꼿이 편 채 선 자세로 놋대야 물을 두 손으로 떠 얼굴에 끼얹는다
    image_prompt: >-
      An early-morning courtyard, the man in the middle of the frame seen from the waist up, standing perfectly upright
      beside a brass washbasin on a waist-high wooden stand, scooping water with both hands up to his face without
      bending his back, water splashing onto the front of his gown, his expression stern and calm. No other people.
    characters: [seonbi]
    motion_prompt: >-
      He lifts water to his face while standing perfectly straight; drops splash onto his gown and he does not bend at all.
    camera: static at eye level

  - id: s07
    beat: resolve
    lines:
      - text: "결국 그는 1936년, 나라 없는 사람인 채로 먼 땅에서 눈을 감았습니다."
        captions: ["결국 그는 1936년", "나라 없는 사람인 채로", "먼 땅에서 / 눈을 감았습니다"]
    visual: 사람 없는 빈 방, 작은 창으로 겨울 햇살이 들고 책상 위에 붓과 원고 더미만 남아 있다
    image_prompt: >-
      A bare, quiet room with a small high window, pale winter sunlight falling across an empty wooden desk with a
      resting brush and a neat stack of handwritten manuscripts, a solemn, dignified mood. All writing unreadable. No
      people.
    motion_prompt: >-
      Dust drifts slowly through the pale beam of light over the quiet desk.
    camera: slow push in

  - id: s08
    beat: info
    lines:
      - text: "드디어 2009년, 정부가 그의 가족관계등록부를 만들었습니다. 73년 만에 대한민국 국민이 된 거죠."
        captions: ["드디어 2009년, 정부가 / 그의 가족관계등록부를", "만들었습니다", "73년 만에 / 대한민국 국민이 된 거죠"]
    visual: 현대의 밝은 관공서 책상 위, 새 등록 서류 한 장 위로 꽃 한 송이가 놓인다 (글자 흐릿, 사람 얼굴 없음)
    image_prompt: >-
      A bright modern government office desk, a single crisp new official certificate with blurred unreadable text lying
      in soft daylight, a hand gently placing one white chrysanthemum on top of it. Only the hand is visible.
    motion_prompt: >-
      The hand lays the white flower gently on the certificate and withdraws; sunlight brightens on the paper.
    camera: slow push in

  - id: s09
    beat: info
    lines:
      - text: "끝까지 일본 호적을 거부한 이 선비가 바로, 단재 신채호입니다."
        captions: ["끝까지 일본 호적을 거부한 / 이 선비가", "바로, 단재 신채호입니다"]
      - text: "여러분이 끝까지 지키고 싶은 것은 무엇인가요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이 끝까지 / 지키고 싶은 것은", "무엇인가요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 강가, 선비가 꼿꼿이 서서 잔잔히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The man seen from the knees up in the middle of the frame, standing perfectly straight on a riverbank at sunset in
      his dark gown, hands clasped behind his back, a faint, steady smile. Soft golden sky. No other people.
    characters: [seonbi]
    motion_prompt: >-
      Wind moves his gown; he stands tall and smiles faintly as the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the same man from the reference image, seen from the waist up in the middle of the
          frame, standing on the riverbank at sunset. He smiles warmly toward the viewer and holds one open palm out at
          chest height in a gentle "what do you think?" gesture. Calm, warm, family-friendly mood. No other people.
        characters: [seonbi]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "대한민국 정책브리핑 (2009년 4월 보도: 1912년 일제가 조선민사령으로 호적을 만들 때 독립유공자들이 등재를 거부해 무호적 상태로 사망한 독립유공자 260여 명, 언론에서 무국적자로 인식되기도 함, 2009년 2월 법 개정, 2009년 4월 13일 임시정부 수립 90주년 기념식에서 신채호 등 대표 3인에게 가족관계등록부 수여 — 무호적 독립유공자의 대표 인물 신채호) — https://www.korea.kr/news/policyNewsView.do?newsId=148681977"
  - "한국교육신문, 냉정과 열정 가득했던 교육자·언론인 신채호 (일제의 신민이 되는 것을 피하려고 호적을 단호히 거부, 1910년 4월 중국 청도로 망명, 1915년 무렵부터 조선사 집필, 1936년 2월 21일 여순 감옥에서 순국) — https://hangyo.com/mobile/article.html?no=27179"
  - "경향신문 2013-12-06 ('세수도 서서 할 정도였다는 꼿꼿한 삶의 자세') — https://www.khan.co.kr/article/201312061905445/amp"

accuracy_notes:
  - "주인공은 실존 독립운동가·역사가 신채호(1880~1936, 호 단재). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'혼이 쏙 빠졌습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 일제의 호적 제도는 1912년 조선민사령 기준(정책브리핑). 대본은 '곧'으로만 쓴다. 신채호는 1910년 4월 망명했으며(한국교육신문), 화면의 항구는 망명길을 보여 주는 연출."
  - "s02 '오르지 않으면 나라 없는 사람'은 무호적 독립유공자가 무국적자로 인식되었다는 정책브리핑 서술을 바탕으로 한 표현이다. 갈림길 화면은 연출."
  - "s04 호적 거부의 뜻(일제 신민이 되지 않으려고)은 한국교육신문 기준."
  - "s05 중국에서 우리 옛 역사(조선사)를 쓴 일은 한국교육신문 기준(1915년 무렵부터)."
  - "s06 '세수도 서서 했다'는 경향신문이 전하는 일화이며 '했다고 합니다'로 쓴다. 옷이 젖었다는 등의 세부는 대본에 넣지 않는다(화면의 물 튀김은 연출)."
  - "s07 1936년 2월 21일 여순 감옥 순국(한국교육신문). 대본은 '먼 땅에서 눈을 감았다'로만 쓰고 감옥·고문 장면은 넣지 않는다. 화면은 사람 없는 방."
  - "s08 2009년 4월 가족관계등록부 수여(정책브리핑). '73년 만'은 1936년~2009년 계산. '대한민국 국민이 된 거죠'는 정책브리핑의 '대한민국 국민임을 확인해 명예를 회복'을 이야기로 쓴 표현."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 선비 한 명 중심, 배경 인물 없음 (s01-2·s08은 손만). 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

youtube:
  titles:
    - 이름 한 줄 올리기를 끝까지 거부한 선비
    - 73년 만에 대한민국 국민이 된 독립운동가
    - 세수도 선 채로 했다는 꼿꼿한 선비, 누구일까?
  description: |-
    📜 호적에 이름 한 줄만 올리면 편하게 살 수 있었다면… 여러분은 어떻게 하시겠어요?

    1910년 나라를 빼앗기자, 일제는 조선 사람을 자기네 호적에 올리기 시작합니다 🖋️
    오르면 일본의 백성, 안 오르면 나라 없는 사람!
    한 선비의 선택은 끝까지 'NO' 🙅 세수도 허리를 굽히지 않고 선 채로 했다는데요?

    그리고 2009년, 정말 놀라운 일이 벌어집니다 🇰🇷 이 선비의 이름은 영상 끝에서!
  comment_question: 여러분이 끝까지 지키고 싶은 것은 무엇인가요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 독립운동가, 역사, 한국사, 쇼츠]
