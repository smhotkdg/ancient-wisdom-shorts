# 002 카나트 — 사막까지 물을 끌어온 지하 수로
id: "002"
slug: qanat
status: done
working_title: 페르시아 사람들은 어떻게 사막 한가운데까지 물을 끌어왔을까?
title_lines: ["사막 한가운데", "물이 흐른다고?"]
hook: 머리를 쥐어뜯었습니다
caption_keywords: [카나트, 우물, 땅굴, 햇볕, 장인, 구멍]

story:
  hero: 장인

characters:
  - id: artisan
    name: 카나트 장인
    name_en: Persian qanat digger
    description: >-
      a wiry, cheerful Persian well-digger in his 50s, sun-tanned skin, short grey beard, light cloth head wrap,
      loose sand-colored tunic with rolled-up sleeves, a coil of rope over one shoulder, small clay oil lamp on his belt
    note: 이야기 주인공. 장면 내내 같은 인물
  - id: villager
    name: 마을 아이
    name_en: village boy
    description: >-
      a small Persian village boy about 8 years old, big curious eyes, short curly black hair,
      simple off-white tunic, carrying an empty clay water jar
    note: 문제와 결과에 반응하는 아이

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "페르시아의 마을 사람들은 머리를 쥐어뜯었습니다."
        captions: ["페르시아의 마을 사람들은 / 머리를 쥐어뜯었습니다"]
      - "물은 저 멀리, 산 밑에만 있었거든요."
    visual: 메마른 사막 마을, 빈 항아리를 든 아이가 지평선의 산을 바라보고 어른들은 머리를 감싼다
    image_prompt: >-
      A dry desert village of mud-brick houses under a harsh sun, cracked earth, villagers clutching their heads
      in frustration beside empty clay jars, the village boy holding an empty jar and staring at distant blue
      mountains on the horizon.
    characters: [villager]
    motion_prompt: >-
      The villagers clutch their heads and sigh; the boy lifts his empty jar and turns to look at the far mountains.
      Dust blows across the cracked ground.
    camera: static
    extra_clips:
      - image_prompt: >-
          Wide view from the edge of the dry village across a vast empty desert toward distant mountains, the
          village boy small in the foreground holding his empty jar, a faint green line of vegetation at the
          foot of the mountains far away.
        characters: [villager]
        motion_prompt: >-
          The camera slowly rises over the boy and drifts toward the far mountains across the shimmering desert.
        camera: slow rise and push toward the mountains

  - id: s02
    beat: problem
    lines:
      - "땅 위로 물길을 내면, 오는 동안 햇볕에 말라버리기 일쑤였죠."
    visual: 사막을 가로지르는 얕은 도랑, 물이 흐르다가 햇볕에 말라 사라진다
    image_prompt: >-
      A long shallow open water channel cutting across the desert from the mountains toward the village, a thin
      trickle of water shrinking and drying out under a blazing sun, heat haze rising, the channel bed cracked
      and empty near the village.
    motion_prompt: >-
      The thin trickle of water in the open channel shrinks and vanishes into the dry cracked bed as heat haze
      shimmers above it.
    camera: slow pan along the channel toward the village

  - id: s03
    beat: question
    lines:
      - "그때 카나트 장인이 나섰습니다."
      - "사막 한가운데까지, 물을 어떻게 데려왔을까요?"
    visual: 밧줄과 등잔을 멘 장인이 마을 어귀에 서서 산 쪽을 가리킨다, 아이가 올려다본다
    image_prompt: >-
      The qanat digger arrives at the edge of the village, rope over his shoulder and a small oil lamp on his belt,
      confidently pointing toward the distant mountains while the village boy looks up at him with hope.
    characters: [artisan, villager]
    motion_prompt: >-
      The digger smiles, plants his feet and points firmly toward the mountains; the boy's face lights up.
    camera: slow push in
    extra_clips:
      - image_prompt: >-
          Close-up of the qanat digger's confident grinning face, tightening the coil of rope on his shoulder, the
          distant mountains blurred behind him, warm afternoon light.
        characters: [artisan]
        motion_prompt: >-
          The digger pulls the rope tight on his shoulder, raises an eyebrow and gives a sly confident grin.
        camera: static

  - id: s04
    beat: solution
    lines:
      - "장인은 산기슭에, 땅속 물이 고인 곳까지 깊은 우물을 팠습니다."
    visual: 단면도 — 산기슭에서 수직으로 깊게 판 우물이 지하수층에 닿는다
    image_prompt: >-
      Side cross-section of the ground at the foot of the mountains: a deep vertical well shaft reaching down into
      a blue underground water layer, the digger at the top lowering a bucket on a rope with a simple wooden winch.
      Clean educational illustration, no labels.
    characters: [artisan]
    motion_prompt: >-
      The digger turns the wooden winch; the bucket rises from the deep shaft full of water glinting in the light,
      while the blue underground water layer shimmers softly.
    camera: static

  - id: s05
    beat: solution
    lines:
      - text: "그리고 마을까지, 아주 완만하게 기운 땅굴을 이었습니다."
        captions: ["그리고 마을까지", "아주 완만하게 기운 / 땅굴을 이었습니다"]
      - "물이 저절로 흘러오도록요."
    visual: 긴 단면도 — 우물 바닥에서 마을까지 아주 완만하게 내려가는 땅굴, 물이 흐른다
    image_prompt: >-
      Long side cross-section from the mountain foot to the village: a narrow tunnel running underground from the
      bottom of the mother well with a very gentle downward slope toward the village, the ground surface above
      it dry desert. Clean educational illustration, no labels.
    motion_prompt: >-
      Water begins to flow from the mother well into the tunnel and slowly travels along the gentle slope toward
      the village.
    camera: slow horizontal glide along the tunnel
    extra_clips:
      - image_prompt: >-
          Side cross-section at the village end: the gently sloping tunnel arriving under the edge of the village
          and opening into an outlet channel at the surface, clear water about to flow out among the first palm trees.
          Clean educational illustration, no labels.
        motion_prompt: >-
          Water flows along the tunnel by itself and spills out of the outlet into the village channel.
        camera: static

  - id: s06
    beat: solution
    lines:
      - "그래서 땅속을 흐르는 물은, 햇볕에 훨씬 덜 말랐죠."
    visual: 땅 위는 이글거리는 햇볕, 바로 아래 어두운 땅굴 속으로 물이 시원하게 흐른다
    image_prompt: >-
      Cross-section close-up: blazing sun and shimmering heat on the dry ground surface, and just below, inside the
      dark cool tunnel, clear water flowing steadily. Clean educational illustration, no labels.
    motion_prompt: >-
      Heat shimmers on the surface above while the clear water keeps flowing calmly through the dark tunnel below.
    camera: static

  - id: s07
    beat: twist
    lines:
      - "그런데 몇 킬로미터 땅굴을, 숨 막히지 않고 어떻게 팠을까요?"
    visual: 좁고 어두운 땅굴 안, 등잔 하나를 든 장인이 땀을 닦으며 앞을 본다
    image_prompt: >-
      Inside a narrow dark earthen tunnel, the digger kneels with a short pick, a small oil lamp beside him flickering
      weakly, he wipes sweat and looks ahead into the darkness.
    characters: [artisan]
    motion_prompt: >-
      The oil lamp flame flickers and shrinks; the digger wipes sweat from his brow and peers into the darkness ahead.
    camera: slow push in

  - id: s08
    beat: resolve
    lines:
      - text: "장인은 땅굴을 따라 일정한 간격으로 세로 우물을 뚫었습니다."
        captions: ["장인은 땅굴을 따라 / 일정한 간격으로", "세로 우물을 뚫었습니다"]
      - "그 구멍으로 흙을 퍼 올리고, 바람을 들였죠."
    visual: 단면도 — 땅굴 위로 일정 간격의 세로 우물들, 바구니로 흙을 끌어 올리고 빛과 바람이 들어온다
    image_prompt: >-
      Side cross-section of the tunnel with a row of vertical shafts rising from it to the surface at regular
      intervals; at one shaft a basket of dirt is hauled up by rope, sunlight and fresh air stream down another shaft
      into the tunnel. Clean educational illustration, no labels.
    characters: [artisan]
    motion_prompt: >-
      A basket full of dirt is pulled up a shaft by rope while dust drifts upward; beams of light pour down the shafts.
    camera: static
    extra_clips:
      - image_prompt: >-
          On the desert surface at the mouth of one shaft: helpers turn a simple wooden windlass to haul up a basket
          of earth, dumping it into a growing ring-shaped mound around the opening; the digger's head pokes up from
          the shaft, grinning in the fresh breeze.
        characters: [artisan]
        motion_prompt: >-
          The windlass turns, the basket rises and dumps earth onto the ring mound; a breeze blows dust as the
          digger takes a deep breath at the shaft mouth.
        camera: static

  - id: s09
    beat: info
    lines:
      - "지금도 하늘에서 보면, 그 구멍들이 사막에 점선처럼 남아 있습니다."
    visual: 하늘에서 내려다본 사막, 산에서 마을 녹지까지 둥근 구멍들이 점선처럼 이어진다
    image_prompt: >-
      High aerial view of a desert: a long dotted line of round crater-like shaft openings running straight from the
      foot of the mountains to a green village oasis, each opening ringed with a mound of earth.
    motion_prompt: >-
      The camera slowly glides along the dotted line of shaft openings from the mountains toward the green village.
    camera: slow aerial glide

  - id: s10
    beat: info
    lines:
      - "3천 년 전 마을도 이 물로 살았고, 지금은 세계유산이 됐습니다."
    visual: 초록 마을, 땅굴 출구에서 흐르는 물을 아이가 항아리에 받고 장인이 웃는다
    image_prompt: >-
      A green village oasis: clear water flowing out of the tunnel mouth into a channel among date palms and fields,
      the village boy happily filling his clay jar and the digger smiling beside him.
    characters: [artisan, villager]
    motion_prompt: >-
      Water pours from the tunnel mouth; the boy fills his jar, laughs and splashes; the digger nods with a proud smile.
    camera: slow pull back
    sfx_volume: 0    # 클립에 아이 웃음소리(목소리)가 섞여 있음

sources:
  - "UNESCO World Heritage — The Persian Qanat (2016 등재; 어미 우물, 일정 간격 수직 갱도로 흙 제거·환기, 거의 수평의 완만한 경사 터널, 중력으로 흐름, 길이는 흔히 수 킬로미터) — https://whc.unesco.org/en/list/1506"
  - "World History Encyclopedia — Qanat (Corey S. Vaughan, 2021; 지하 수로는 증발이 훨씬 느림, 수직 갱도는 환기·굴착 방향 안내, 기원전 1000년경 마을도 카나트에 의존, 전문 장인 muqanni) — https://www.worldhistory.org/qanat/"

accuracy_notes:
  - "장인·아이 인물과 감정, 대사는 설명용 재구성. 특정 마을·인물의 실제 이야기가 아니다."
  - "'머리를 쥐어뜯었습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "'3천 년 전'은 기원전 1000년경 마을이 카나트에 의존했다는 고고학 근거(World History Encyclopedia) 수준. 정확한 최초 연대를 단정하지 않는다."
  - "'땅 위 물길은 말라버리기 일쑤'는 지하 수로의 증발이 훨씬 느리다는 근거를 극적으로 표현한 것. 증발량 수치는 쓰지 않는다."
  - "세계유산은 이란의 카나트 11곳(The Persian Qanat, 2016)."
  - "실제 굴착은 출구(마을) 쪽에서 시작해 상류로 파 올라갔다는 기록이 있으나, 영상은 이해를 위해 우물 → 땅굴 순서로 보여 준다."

youtube:
  titles:
    - 사막 한가운데 물이 흐른다? 3천 년 된 지하 수로 카나트
    - 펌프도 없이 사막으로 물을 끌어온 페르시아의 지혜
    - 하늘에서 보면 점선이 보이는 이유, 카나트
  description: |-
    🏜️ 물은 저 멀리 산 밑에만 있고, 땅 위 물길은 햇볕에 바싹 말라버린다면?

    페르시아의 장인은 물을 '땅속으로 숨겨서' 데려오기로 했습니다.
    산기슭에 우물을 파고, 마을까지 아주 살짝 기운 땅굴을 이어 펌프 없이 물이 저절로 흐르게 💧

    그런데 몇 킬로미터 땅굴을 숨 막히지 않고 어떻게 팠을까요?
    정답은 지금도 하늘에서 보입니다. 사막 위에 찍힌 수많은 점선 👀
  comment_question: 사막에서 물을 구해야 한다면, 여러분은 어떤 방법을 쓰실 건가요?
  hashtags: [카나트, 페르시아, 이란, 고대기술, 쇼츠]
