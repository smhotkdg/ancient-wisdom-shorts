sources:
  - "아주경제 [위기가 기회다-⑨현대중공업] 정주영의 '500원권 신화' (1971년 애플도어 롱바톰 회장에게 거북선이 그려진 500원권을 보이며 '한국은 16세기에 철갑선을 만들었다. 영국보다 300년이나 빠르다', 바클레이즈은행이 조선 능력 부족으로 거절 → 롱바톰 추천서로 차관, 영국 수출신용보증국 승인에 선주 증빙 필요, 울산 미포만 백사장 사진 한 장·지도·26만t급 유조선 도면, 그리스 리바노스 회장의 스위스 별장에서 대형 유조선 2척 계약, 1972.3.23 기공, 1974.6.28 준공·1·2호선 명명, 1983년 일본 다이아몬드지가 세계 1위 조선 기업으로 선정 — 기공 11년) — https://www.ajunews.com/view/20200614133259034"
  - "한국민족문화대백과사전, 울산조선소 (1971년 10월 그리스 리바노스로부터 25만 9천 톤급 초대형 유조선 2척 수주, 1972년 3월 23일 기공, 착수 2년 3개월 만에 준공, 1974년 6월 28일 준공식과 1·2호선 명명식) — https://encykorea.aks.ac.kr/Article/E0081025"

accuracy_notes:
  - "주인공은 실존 기업가 정주영(1915~2001, 현대그룹 창업자). 영국 회장은 애플도어의 롱바톰 회장을 바탕으로 한 인물. 감정·장면은 설명용 재구성이며, 두 사람의 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'진땀을 뺐습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '런던'은 영국 은행·컨설턴트를 만나러 다닌 상황을 쉽게 쓴 배경. '배를 만들어 본 적도 돈도 없었다'는 조선 실적이 없고 자금이 없었다는 아주경제 서술 기준."
  - "s02 바클레이즈은행이 조선 능력·기술 부족을 이유로 거절한 것은 아주경제 기준. 대사는 그 뜻을 풀어 쓴 것."
  - "s04~s05 거북선 500원권과 '영국보다 300년 먼저 철갑선' 이야기는 정주영 본인이 전한 것으로 널리 알려진 일화(아주경제)이며 대본은 그 뜻을 옮긴 말이다. 거북선을 '철갑선'으로 보는 것은 그가 한 말 그대로 옮긴 것이며 학계에는 철갑 여부에 이견이 있다. 일화 속 상대는 은행이 아니라 롱바톰 회장이고, 그의 추천서로 차관을 얻었다."
  - "s06 선주 증빙이 필요했고 백사장 사진·지도·유조선 도면뿐이었다는 것은 아주경제 기준. 대본은 사진만 말한다."
  - "s07 그리스 리바노스로부터 초대형 유조선 2척 수주(1971년 10월)는 백과사전·아주경제 공통. 계약 장소(스위스 별장)는 아주경제 기준이며 화면은 연출."
  - "s08 1972년 기공 → 1974년 준공·1·2호선 명명(백과사전). '11년 뒤 세계 1위'는 1983년 일본 다이아몬드지 선정(아주경제, 기공 11년) 기준."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면의 지폐는 거북선 그림이 있는 옛 지폐를 글자·숫자 없이 그린 연출이며 실제 지폐를 그대로 그리지 않는다. 회사 이름·로고는 화면에 넣지 않는다."
  - "이미지 + 음성만인 편 (media: images): 컷마다 확대·축소·이동(still_motion, focus) + 컷 사이 디졸브. 화면 인물은 사장 중심, s03·s05-2에 영국 회장. 배경 인물 없음. 실사 편, 화면 제목 없음."

