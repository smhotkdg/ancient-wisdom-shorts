# 057 한용운 — 조선총독부를 등지려고 볕 안 드는 쪽으로 집을 앉힌 스님 (심우장, 유명 독립운동가 편, 실사)
id: "057"
style: photoreal
slug: han-yongun-house
status: script_ok
working_title: 따뜻한 남향을 버리고 차가운 집을 고른 스님, 왜 그랬을까?
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["일부러 추운 집을", "지었다고?"]
hook: 골머리를 앓았습니다
caption_keywords: [골머리를 앓았습니다, 남향, 조선총독부, 등진, 북쪽, 잃어버린 소, 심우장, "1944년"]

story:
  hero: 스님
  reveal: [한용운, 만해, 님의 침묵]

characters:
  - id: monk
    name: 스님
    name_en: Korean Buddhist monk of the 1930s
    description: >-
      a lean Korean man in his mid-50s with a shaved head, a thin, sharp, dignified face, piercing calm eyes and a short
      neat grey moustache, wearing a plain grey Korean Buddhist monk's robe over white cotton clothes, simple straw
      sandals, a wooden prayer-bead bracelet on one wrist
    note: 이야기 주인공. 1933년 서울 성북동에 집(심우장)을 지은 승려·시인·독립운동가 (마지막 대사 전까지 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1933년 서울 성북동, 한 스님은 골머리를 앓았습니다."
        captions: ["1933년 서울 성북동", "한 스님은 / 골머리를 앓았습니다"]
      - text: "고마운 이들이 집을 지어 준다는데, 방향이 문제였거든요."
        captions: ["고마운 이들이 / 집을 지어 준다는데", "방향이 문제였거든요"]
    visual: 산비탈 빈 집터, 스님이 팔짱을 끼고 서서 고민하고 뒤에서 양복·한복 차림 두 사람이 도면을 펼쳐 든다
    image_prompt: >-
      An empty building plot on a quiet wooded hillside of 1930s Seoul with stakes and string marking the ground, the
      monk in the middle of the frame seen from the waist up, standing with his arms folded and his brow furrowed in
      deep thought.
    characters: [monk]
    extras: "two middle-aged men behind him, one in a 1930s western suit and one in white hanbok, holding open a large paper house plan, small and slightly out of focus"
    motion_prompt: >-
      He frowns and looks around the plot; behind him the two men turn the paper plan toward him.
    camera: static at eye level

  - id: s02
    beat: problem
    lines:
      - text: "남향으로 지으면, 산 아래 조선총독부 쪽을 바라보게 되니까요."
        captions: ["남향으로 지으면", "산 아래 조선총독부 쪽을 / 바라보게 되니까요"]
    visual: 언덕 위에서 내려다본 1930년대 경성 시내, 멀리 돔 지붕의 커다란 석조 관청 건물이 안개 속에 보인다 (사람 없음)
    image_prompt: >-
      A view from a wooded hillside looking south over 1930s Seoul, rows of tiled roofs below, and far in the hazy
      distance a large grey stone government building with a central dome, a cold, heavy mood. No people.
    motion_prompt: >-
      Haze drifts slowly over the city and the distant domed building as the light dims.
    camera: slow push in

  - id: s03
    beat: question
    lines:
      - text: "따뜻한 남향이냐, 총독부를 등진 차가운 집이냐. 스님은 무엇을 골랐을까요?"
        captions: ["따뜻한 남향이냐", "총독부를 등진 차가운 집이냐", "스님은 무엇을 골랐을까요?"]
    visual: 스님이 언덕 아래 시내를 한참 바라보다 천천히 몸을 돌린다
    image_prompt: >-
      The monk seen from the waist up in the middle of the frame, standing on the hillside with the hazy city far
      behind him, his face calm and firm, slowly turning his back on the view. No other people.
    characters: [monk]
    motion_prompt: >-
      He looks toward the distant city for a long moment, then slowly and deliberately turns his back on it.
    camera: static

  - id: s04
    beat: solution
    lines:
      - text: "그래서 스님은 일부러 총독부를 등진, 볕 덜 드는 북쪽으로 집을 앉혔습니다."
        captions: ["그래서 스님은 일부러 / 총독부를 등진", "볕 덜 드는 북쪽으로 / 집을 앉혔습니다"]
    visual: 산비탈에 소박한 기와집 한 채가 산 쪽을 향해 앉아 있고, 마당 그늘에 스님이 서서 집을 바라본다
    image_prompt: >-
      A small, simple tiled-roof Korean house on a shaded hillside in the 1930s, built facing away from the sunny side
      toward the wooded slope, its front yard in cool shadow, the monk in the middle of the frame seen from the knees up,
      standing in the shaded yard and looking at the house with quiet satisfaction. No other people.
    characters: [monk]
    motion_prompt: >-
      Leaves move gently in the breeze; he looks over the house and gives a small, satisfied nod.
    camera: slow pull back at eye level

  - id: s05
    beat: solution
    lines:
      - text: "그러자 겨울엔 방까지 찬 기운이 스며들었지만, 스님은 끄떡없었죠."
        captions: ["그러자 겨울엔 방까지", "찬 기운이 스며들었지만 / 스님은 끄떡없었죠"]
    visual: 겨울, 서리 낀 창호지 방 안에서 스님이 두꺼운 솜옷 차림으로 꼿꼿이 앉아 붓을 든다 / 입김이 하얗게 난다
    image_prompt: >-
      A small cold room in winter with frost on the paper window, the monk seen from the waist up in the middle of the
      frame, sitting perfectly upright at a low desk in a thick padded grey robe, holding a brush over a sheet of paper,
      his breath faintly visible, his face calm and unbothered. No other people.
    characters: [monk]
    motion_prompt: >-
      His breath fogs faintly in the cold air; he dips the brush calmly and begins to write.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of frost crystals on a traditional paper window lattice in a cold room, pale winter light behind it.
          No people.
        motion_prompt: >-
          The frost crystals glitter as the pale light shifts slightly.
        camera: macro static

  - id: s06
    beat: twist
    lines:
      - text: "그런데 이 집 이름엔 무슨 뜻이 숨어 있을까요?"
        captions: ["그런데 이 집 이름엔", "무슨 뜻이 숨어 있을까요?"]
      - text: "잃어버린 소를 찾는 집, 여기서 소는 잃어버린 나 자신이라고 합니다."
        captions: ["잃어버린 소를 찾는 집", "여기서 소는 잃어버린 / 나 자신이라고 합니다"]
    visual: 스님이 집 처마 아래 걸린 나무 현판을 올려다보지 않고 마루에 서서 바라보며 미소 짓는다 (현판 글자 흐릿) / 들판의 소 한 마리
    image_prompt: >-
      The monk seen from the waist up in the middle of the frame, standing on the wooden veranda of the small house
      beside a carved wooden name board hanging at shoulder height, touching its edge and smiling quietly. The carved
      characters are soft and unreadable. No other people.
    characters: [monk]
    motion_prompt: >-
      He runs his fingers along the edge of the wooden board and smiles with quiet meaning.
    camera: static at eye level
    extra_clips:
      - image_prompt: >-
          A single Korean brown ox standing alone in a misty empty field at dawn, looking back over its shoulder, soft
          quiet light. No people.
        motion_prompt: >-
          The ox slowly turns its head and mist drifts across the field.
        camera: slow push in

  - id: s07
    beat: resolve
    lines:
      - text: "결국 스님은 광복 한 해 전인 1944년까지, 이 차가운 집을 떠나지 않았습니다."
        captions: ["결국 스님은 / 광복 한 해 전인 1944년까지", "이 차가운 집을 / 떠나지 않았습니다"]
    visual: 눈 덮인 기와집 마당, 스님이 마루 끝에 앉아 고요히 먼 산을 바라본다
    image_prompt: >-
      The small tiled-roof house in deep winter with snow on the roof and yard, the monk, a little older and thinner, in
      the middle of the frame seen from the waist up, sitting at the edge of the wooden veranda in his grey robe and
      gazing calmly toward the snowy wooded slope. No other people.
    characters: [monk]
    motion_prompt: >-
      Snow falls softly; he sits still, breathing slowly, gazing at the snowy hillside.
    camera: slow push in

  - id: s08
    beat: info
    lines:
      - text: "이 집은 지금 사적으로 지정되어, 그 자리를 지키고 있습니다."
        captions: ["이 집은 지금 / 사적으로 지정되어", "그 자리를 지키고 있습니다"]
    visual: 오늘날 가을 햇살 속 같은 소박한 기와집과 담장, 단풍 든 나무 (사람 없음)
    image_prompt: >-
      The same small traditional tiled-roof house on the hillside in warm autumn sunlight, a low stone wall, a few
      maple trees with red leaves, the yard neat and quiet, a peaceful and dignified mood. No people.
    motion_prompt: >-
      Red maple leaves drift down slowly into the quiet yard.
    camera: slow pan

  - id: s09
    beat: info
    lines:
      - text: "총독부에 등을 돌린 이 스님이 바로, 님의 침묵을 쓴 만해 한용운입니다."
        captions: ["총독부에 등을 돌린 / 이 스님이", "바로, 님의 침묵을 쓴 / 만해 한용운입니다"]
      - text: "여러분이라면 남향과 이 북향 집 중 어디를 고르셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 남향과", "이 북향 집 중 / 어디를 고르셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 늦가을 기와집 마당, 스님이 집 앞에 서서 잔잔히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The monk seen from the knees up in the middle of the frame, standing in the quiet yard of the small tiled-roof
      house in late autumn, hands folded in front of him, a calm, steady smile. Soft clear sky. No other people.
    characters: [monk]
    motion_prompt: >-
      Leaves drift past him; he smiles calmly as the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the same monk from the reference image, seen from the waist up in the middle of the
          frame, standing in the autumn yard. He smiles warmly toward the viewer and holds one open palm out at chest
          height in a gentle "what do you think?" gesture. Calm, warm, family-friendly mood. No other people.
        characters: [monk]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "한국민족문화대백과사전, 만해 한용운 심우장 (1933년 건립, 김벽산이 기증한 땅, 방응모 등 유지들의 도움, '조선총독부가 위치하던 남쪽을 등진 곳을 택하여' 북향으로 지음, 이름은 불교 수행의 뜻 — 공부하는 집, 1934년 『흑풍』 집필, 2019년 사적 지정) — https://encykorea.aks.ac.kr/Article/E0017767"
  - "아주경제, 만해 한용운 거주 '심우장' 사적 지정 예고 (문화재청: 1933년 건립, '총독부의 방향을 피하여 동북방향으로 잡았다는 이야기가 전해짐', 한용운 1879~1944, '심우'는 소를 사람에 비유해 잃어버린 나를 찾는다는 뜻) — https://www.ajunews.com/view/20190212101242130"
  - "서울시 미디어허브, 3.1절에 만난 만해 한용운의 흔적 '심우장' (1933년부터 1944년까지 거주, 1984년 서울시 기념물, 2019년 사적 제550호, 현판은 오세창 글씨) — https://mediahub.seoul.go.kr/archives/2007152"

accuracy_notes:
  - "주인공은 실존 독립운동가·승려·시인 한용운(1879~1944, 호 만해). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'골머리를 앓았습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '고마운 이들이 지어 주겠다'는 김벽산의 땅 기증과 방응모 등 유지들의 도움(백과사전)을 줄인 표현. 화면의 두 사람과 도면은 연출이며 실존 인물을 그리지 않는다."
  - "s02~s04 남쪽(조선총독부 쪽)을 등지려고 북향으로 지었다는 것은 백과사전 기준. 문화재청(아주경제)은 '동북방향으로 잡았다는 이야기가 전해진다'고 적어, 대본은 '총독부를 등진 쪽, 볕이 덜 드는 북쪽'으로 쓴다. 화면의 돔 건물은 특정 건물을 그대로 그리지 않은 연출."
  - "s05 '겨울이면 찬 기운이 스며들었다'는 북향집의 특성을 이야기로 푼 재구성이다."
  - "s06 '심우'의 뜻(소를 사람에 비유해 잃어버린 나를 찾음)은 문화재청(아주경제) 기준. 집 이름(심우장)은 대본에 넣지 않는다."
  - "s07 1933~1944년 거주(서울시 미디어허브), 1944년 별세(문화재청). '떠나지 않았다'는 이 집에서 여생을 보냈다는 서술 기준."
  - "s08 2019년 사적 지정은 백과사전·서울시 미디어허브 기준."
  - "s09 『님의 침묵』은 그의 대표 시집. 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 스님 한 명 중심, s01에 도와준 두 사람(뒤쪽). 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

youtube:
  titles:
    - 따뜻한 남향을 버리고 일부러 추운 집을 지은 스님
    - 이 집은 왜 해를 등지고 앉았을까?
    - 총독부를 보기 싫어 집 방향을 바꾼 사람
  description: |-
    🏠 집을 짓는다면 당연히 볕 잘 드는 남향이죠? 그런데 일부러 북쪽을 고른 사람이 있습니다.

    1933년 서울 성북동, 고마운 이들이 한 스님에게 집을 지어 주겠다고 합니다 🙏
    문제는… 남향으로 지으면 산 아래 조선총독부를 바라보게 된다는 것! 😤
    스님의 선택은 볕이 덜 드는 차가운 집 ❄️ 게다가 집 이름엔 숨은 뜻까지 있었는데요?

    우리가 교과서에서 만난 그 시인, 정답은 영상 끝에서! 📖
  comment_question: 여러분이라면 남향과 이 북향 집 중 어디를 고르셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 독립운동가, 성북동, 한국사, 쇼츠]
