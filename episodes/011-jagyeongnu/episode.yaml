# 011 자격루 — 물과 구슬로 스스로 시간을 알린 조선의 시계
id: "011"
slug: jagyeongnu
status: script_ok
working_title: 조선 사람들은 어떻게 사람 없이 시간을 알렸을까?
title_lines: ["사람 없이 스스로", "종을 친 시계?"]
hook: 골머리를 앓았습니다
caption_keywords: [물통, 막대, 쇠구슬, 인형, 종]

story:
  hero: 장영실
  reveal: [자격루]

characters:
  - id: jang
    name: 장영실
    name_en: Joseon court inventor
    description: >-
      a thoughtful, energetic Korean man in his 30s with a neat topknot under a black horsehair headband (manggeon),
      a short thin mustache, bright curious eyes, wearing a plain light-blue Joseon-era hanbok robe with sleeves tied
      back for work, a cloth tool pouch at his waist (an imagined look, not a real portrait)
    note: 이야기 주인공. 세종의 명으로 스스로 시간을 알리는 시계를 만드는 기술자 (화면에 나오는 사람은 이 사람 한 명뿐)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "궁궐의 기술자 장영실은 골머리를 앓았습니다."
        captions: ["궁궐의 기술자 장영실은 / 골머리를 앓았습니다"]
      - text: "임금이 사람 없이도 스스로 시간을 알리는 시계를 만들라 했거든요."
        captions: ["임금이 사람 없이도", "스스로 시간을 알리는 / 시계를 만들라 했거든요"]
    visual: 등잔불 아래 작업실, 장영실이 종이 설계도 앞에서 머리를 감싸 쥔다
    image_prompt: >-
      A Joseon-era palace workshop at night lit by an oil lamp, wooden tools and brass parts scattered on a low table,
      blank sheets of paper everywhere; the inventor sitting cross-legged, clutching his head with both hands in
      frustration. No other people.
    characters: [jang]
    motion_prompt: >-
      The inventor rubs his head, crumples a sheet of paper and tosses it aside; the lamp flame flickers.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of the inventor's face lit by lamplight, eyebrows knitted, staring at a simple brass bell on the
          table, a brush in his hand hovering over paper. No other people.
        characters: [jang]
        motion_prompt: >-
          He taps the brass bell lightly with the brush handle, listens, then sighs and frowns harder.
        camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "그때까진 사람이 밤새 물시계를 지켜보다가, 깜빡 졸면 시간이 엉망이 됐죠."
        captions: ["그때까진 사람이 / 밤새 물시계를 지켜보다가", "깜빡 졸면 / 시간이 엉망이 됐죠"]
    visual: 한밤중 물시계 옆, 장영실이 하품하며 꾸벅 졸다 화들짝 깬다
    image_prompt: >-
      A quiet palace courtyard pavilion at midnight, a simple bronze water clock (a jar dripping water into a tall
      vessel with a marked rod), the inventor sitting beside it on a mat, head nodding off, eyelids drooping, a candle
      almost burned down. No other people.
    characters: [jang]
    motion_prompt: >-
      His head droops lower and lower, then jerks up in alarm as a drop of water plinks; he blinks wide awake.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "물만 흘려서, 어떻게 시계가 스스로 소리를 낼 수 있을까요?"
        captions: ["물만 흘려서", "어떻게 시계가 스스로 / 소리를 낼 수 있을까요?"]
    visual: 장영실이 똑똑 떨어지는 물방울을 뚫어지게 바라본다
    image_prompt: >-
      Close view of water dripping steadily from a bronze jar spout into a vessel below, the inventor's face reflected
      in the water surface, staring intently, the hint of an idea in his eyes. No other people.
    characters: [jang]
    motion_prompt: >-
      Drops fall one by one and ripples spread; his eyes follow them and slowly widen with an idea.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 장영실은 큰 물통 여러 개를 계단처럼 이어, 물이 일정하게 흐르게 했습니다."
        captions: ["그래서 장영실은 / 큰 물통 여러 개를", "계단처럼 이어", "물이 일정하게 / 흐르게 했습니다"]
    visual: 높이가 다른 청동 물항아리들이 계단처럼 놓이고, 물이 차례로 흘러내린다
    image_prompt: >-
      A row of large bronze water jars set on stone stands of descending height like steps, thin streams of water
      flowing from one jar to the next and into a tall cylinder at the bottom, the inventor adjusting the last spout.
      No other people.
    characters: [jang]
    motion_prompt: >-
      Water trickles steadily from jar to jar down the steps; the inventor turns a spout and nods.
    camera: slow pan along the jars

  - id: s05
    beat: solution
    lines:
      - text: "그리고 마지막 통에 물이 고이면, 그 위에 띄운 막대가 조금씩 떠오르게 했죠."
        captions: ["그리고 마지막 통에 / 물이 고이면", "그 위에 띄운 막대가 / 조금씩 떠오르게 했죠"]
    visual: 단면도 — 긴 원통에 물이 차오르며 떠 있는 막대가 위로 올라간다
    image_prompt: >-
      Side cross-section of a tall bronze cylinder slowly filling with water, a floating wooden rod standing upright on
      a float inside it, the rod rising out of the top as the water level climbs. Clean educational illustration,
      no labels, no text, no people.
    motion_prompt: >-
      The water level climbs inside the cylinder and the floating rod rises slowly out of the top.
    camera: static

  - id: s06
    beat: twist
    lines:
      - text: "그런데 아주 천천히 떠오르는 막대로, 어떻게 종을 힘껏 칠 수 있을까요?"
        captions: ["그런데 아주 천천히 / 떠오르는 막대로", "어떻게 종을 / 힘껏 칠 수 있을까요?"]
    visual: 장영실이 느릿느릿 올라오는 막대와 큰 종을 번갈아 보며 고개를 갸웃
    image_prompt: >-
      The inventor kneeling between the slowly rising rod poking out of the cylinder and a large bronze bell hanging
      on a wooden frame, looking from one to the other with a puzzled frown, finger on his chin. No other people.
    characters: [jang]
    motion_prompt: >-
      The rod creeps up a tiny bit; the inventor looks at it, then at the bell, and tilts his head doubtfully.
    camera: static

  - id: s07
    beat: resolve
    lines:
      - text: "막대가 정해진 높이에 닿으면, 쇠구슬이 또르르 굴러떨어지게 했습니다."
        captions: ["막대가 정해진 높이에 닿으면", "쇠구슬이 또르르 / 굴러떨어지게 했습니다"]
      - text: "떨어지는 구슬의 힘으로, 나무 인형이 종을 땡 쳤죠."
        captions: ["떨어지는 구슬의 힘으로", "나무 인형이 / 종을 땡 쳤죠"]
    visual: 막대가 걸쇠를 밀자 쇠구슬이 홈통을 굴러 떨어지고, 지렛대가 나무 인형의 팔을 들어 종을 친다
    image_prompt: >-
      Close-up of a wooden mechanism: the top of the rising rod pushing a small latch, releasing an iron ball onto a
      slanted wooden chute, the ball rolling down toward a lever connected to the arm of a small carved wooden
      figurine holding a mallet next to a bronze bell. Clean, clear mechanical view, no text.
    motion_prompt: >-
      The rod nudges the latch, the iron ball rolls down the chute and drops onto the lever, which swings the wooden figurine's arm to strike the bell.
    camera: static
    extra_clips:
      - image_prompt: >-
          A beautiful wooden clock pavilion seen from the front, three small carved wooden figurines standing in a row
          beside a bronze bell, a drum and a gong, the inventor peeking around the side of the pavilion, holding his
          breath. No other people.
        characters: [jang]
        motion_prompt: >-
          One wooden figurine swings its mallet and strikes the bell; the inventor jumps with joy.
        camera: slow push in

  - id: s08
    beat: resolve
    lines:
      - text: "인형들은 때에 맞춰, 종과 북과 징을 차례로 울렸습니다."
        captions: ["인형들은 때에 맞춰", "종과 북과 징을 / 차례로 울렸습니다"]
    visual: 세 나무 인형이 차례로 종, 북, 징을 친다
    image_prompt: >-
      Front view of three carved wooden figurines in colorful painted robes inside the clock pavilion, each beside its
      instrument: a bronze bell, a red drum and a brass gong, warm lamplight. No people.
    motion_prompt: >-
      The figurines strike in turn: the first hits the bell, the second beats the drum, the third bangs the gong.
    camera: slow pan

  - id: s09
    beat: info
    lines:
      - text: "덕분에 사람이 졸아도 시간은 틀리지 않았고, 일부는 지금도 덕수궁에 남아 있죠."
        captions: ["덕분에 사람이 졸아도 / 시간은 틀리지 않았고", "일부는 지금도 / 덕수궁에 남아 있죠"]
    visual: 오늘날 궁궐 마당에 놓인 오래된 청동 물항아리들
    image_prompt: >-
      Present-day palace courtyard in soft daylight, old weathered bronze water jars and tall bronze cylinders standing
      on stone platforms as museum relics, traditional palace roofs behind, autumn leaves. No people.
    motion_prompt: >-
      Autumn leaves drift past the old bronze jars; sunlight glints on their weathered surfaces.
    camera: slow orbit

  - id: s10
    beat: info
    lines:
      - text: "물과 구슬로 스스로 시간을 알린 이 시계가 바로, 자격루입니다."
        captions: ["물과 구슬로 / 스스로 시간을 알린", "이 시계가 / 바로, 자격루입니다"]
    visual: 완성된 시계 누각 앞에서 장영실이 뿌듯하게 웃고, 인형이 종을 친다
    image_prompt: >-
      The inventor standing proudly in front of the finished wooden clock pavilion with its bronze water jars and
      figurines at dawn, arms folded, a wide satisfied smile, golden morning light. No other people.
    characters: [jang]
    motion_prompt: >-
      A figurine strikes the bell behind him; the inventor grins and bows slightly; the camera slowly pulls back.
    camera: slow pull back

sources:
  - "사이언스타임즈 2006 — 자격루 (세종 때 완성, 사람 손 없이 시간을 알리는 자동 시보 장치, 장영실(김빈과 함께) 제작, 원동력은 부력과 운동에너지 — 물에 뜬 살대가 떠오르는 힘을 쇠구슬의 낙하력으로 바꿔 시보 장치를 움직임, 건국대 남문현 교수팀 복원) — https://www.sciencetimes.co.kr/?p=39655"
  - "서울시 미디어허브 — 덕수궁에 과학이 숨어 있다 (세종 16년 자격루, 장영실 등 제작, 우리나라 첫 자동 시보 장치, 물이 고이면 살대가 떠올라 인형과 구슬이 종·북·징을 쳐서 시간을 알림, 물 흐름을 일정하게 하려고 여러 물통을 연결, 부력과 지렛대 원리, 덕수궁에 일부 남아 있음) — https://mediahub.seoul.go.kr/archives/178408"

accuracy_notes:
  - "장영실은 실존 인물이지만, 감정·행동·대사는 설명용 재구성이다. 실제로는 김빈 등과 함께 만들었다(사이언스타임즈)."
  - "장영실의 얼굴·복장은 상상한 모습이다 (전해지는 초상화 없음)."
  - "'골머리를 앓았습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "완성·설치 연도는 자료마다 1433년·1434년으로 달라 대본에 쓰지 않는다."
  - "s02 '사람이 졸면 시간이 엉망'은 사람이 지키던 물시계의 한계를 단순화한 연출. 처벌 이야기 등은 쓰지 않는다."
  - "작동 원리는 '살대가 떠올라 쇠구슬을 굴리고, 구슬의 힘으로 인형이 종·북·징을 친다'로 단순화. 실제 장치는 작은 구슬·큰 구슬·여러 단계의 지렛대로 더 복잡하다. 몇 시에 무엇을 쳤는지는 쓰지 않는다."
  - "화면 인물은 장영실 한 명으로 연출. 나무 인형은 사람이 아니다."
  - "s09 덕수궁 유물은 물항아리 등 일부만 남아 있다(서울시 미디어허브). 그림은 유물을 단순화한 것."

youtube:
  titles:
    - 사람 없이 스스로 종을 친 조선의 물시계
    - 장영실은 어떻게 물로 종을 쳤을까?
    - 졸아도 괜찮아! 조선의 자동 시계 이야기
  description: |-
    ⏰ 밤새 시계를 지키던 사람이 깜빡 졸면… 시간은 누가 알려 주죠?

    장영실의 답은 '물이 스스로 일하게 하기'였습니다 💧
    물통을 계단처럼 이어 물을 일정하게 흘리고,
    차오르는 물에 뜬 막대가 쇠구슬을 또르르 굴리면… 🔔 인형이 종을 땡!

    약 600년 전 조선의 자동 시계, 그 일부는 지금도 덕수궁에서 볼 수 있답니다.
  comment_question: 여러분이 장영실이라면, 물로 또 어떤 자동 장치를 만들어 보고 싶나요?
  hashtags: [자격루, 장영실, 세종대왕, 조선과학, 쇼츠]
