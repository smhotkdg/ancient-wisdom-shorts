# 048 국채보상운동 — 담배를 끊어 나랏빚을 갚자던 대구 상인의 계산 (서상돈, 독립운동가 편, 실사)
id: "048"
style: photoreal
slug: national-debt
status: script_ok
working_title: 1907년 대구의 상인은 어떻게 나랏빚 1,300만 원을 갚으려 했을까?
show_title: false        # 화면 제목 텍스트 없음 (2026-11-10 사용자). title_lines 는 콘티·목록용
title_lines: ["담배를 끊어서", "나랏빚을 갚자고?"]
hook: 골머리를 앓았습니다
caption_keywords: [1,300만 원, 빼앗길 판, 담배를 끊고, 20전씩, 은반지]

story:
  hero: 상인
  reveal: [국채보상운동, 서상돈]

characters:
  - id: merchant
    name: 상인
    name_en: Korean merchant of 1907
    description: >-
      a sturdy, warm-faced Korean man in his late 50s with a neatly trimmed grey-streaked beard and mustache, kind but
      resolute dark eyes, wearing a dark grey traditional durumagi coat over a white hanbok and a black horsehair gat
      hat, holding an abacus and a folded sheet of paper
    note: 이야기 주인공. 1907년 대구 광문사 부사장이던 상인 (마지막 대사 전까지 이름과 운동 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1907년, 대구의 한 상인은 골머리를 앓았습니다."
        captions: ["1907년 대구의 / 한 상인은", "골머리를 앓았습니다"]
      - text: "나라가 일본에 진 빚이, 무려 1,300만 원이나 됐거든요."
        captions: ["나라가 일본에 진 빚이", "무려 1,300만 원이나 / 됐거든요"]
    visual: 어둑한 상점 안, 상인이 장부와 주판 앞에서 이마를 짚는다
    image_prompt: >-
      The dim interior of a traditional Korean merchant's shop in 1907, wooden shelves of goods and ledgers, the merchant
      seen from the waist up in the middle of the frame, sitting at a low desk with an abacus and an open ledger,
      pressing his fingertips to his forehead with a heavy, worried look. Plain dark wooden wall above him. No readable
      text. No other people.
    characters: [merchant]
    motion_prompt: >-
      He slides a few abacus beads, stops, and presses his fingertips to his forehead with a sigh.
    camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "이 빚을 갚지 못하면, 나라를 통째로 빼앗길 판이었죠."
        captions: ["이 빚을 갚지 못하면", "나라를 통째로 / 빼앗길 판이었죠"]
    visual: 탁자 위에 쌓인 차용 문서 더미 위로 촛불이 흔들린다 (사람 없이)
    image_prompt: >-
      A tall stack of old loan documents with red seals piled on a dark wooden table, lit by a single flickering candle,
      heavy and ominous mood. No readable text, no people.
    motion_prompt: >-
      The candle flame trembles and the shadows of the paper stack waver.
    camera: slow push in

  - id: s03
    beat: question
    lines:
      - text: "그 큰돈을, 대체 어떻게 마련할까요?"
        captions: ["그 큰돈을", "대체 어떻게 마련할까요?"]
    visual: 상점 문간에 선 상인이 텅 빈 거리를 바라보며 생각에 잠긴다
    image_prompt: >-
      The merchant seen from the knees up in the middle of the frame, standing in the doorway of his shop and looking out
      at a dusty Daegu street in 1907, arms folded, deep in thought. Soft plain sky above the street. No other
      people.
    characters: [merchant]
    motion_prompt: >-
      He watches the street, slowly unfolds his arms and narrows his eyes with an idea.
    camera: static

  - id: s04
    beat: solution
    lines:
      - text: "그래서 상인은, 기막힌 계산 하나를 내놓았습니다."
        captions: ["그래서 상인은", "기막힌 계산 하나를 / 내놓았습니다"]
    visual: 상인이 주판알을 빠르게 튕기다 멈추고, 종이에 붓으로 무언가를 적는다
    image_prompt: >-
      Close view of the merchant at his desk in the middle of the frame, flicking abacus beads quickly with one hand and
      writing on a sheet of paper with a brush in the other, a growing excited smile. No readable text. No other people.
    characters: [merchant]
    motion_prompt: >-
      The abacus beads click rapidly; he stops, writes a quick line and smiles.
    camera: static

  - id: s05
    beat: solution
    lines:
      - text: "2천만 동포가 석 달만 담배를 끊고, 한 달에 20전씩 모으자는 거죠."
        captions: ["2천만 동포가 / 석 달만 담배를 끊고", "한 달에 20전씩 / 모으자는 거죠"]
    visual: 상인이 긴 담뱃대를 두 손으로 내려놓고, 옆 작은 함에 동전을 넣는다
    image_prompt: >-
      The merchant seen from the waist up in the middle of the frame, firmly setting down a long traditional Korean tobacco
      pipe on the table with both hands, then dropping a small coin into a wooden collection box beside it, determined
      expression. No readable text. No other people.
    characters: [merchant]
    motion_prompt: >-
      He lays down the long pipe, picks up a coin and drops it into the wooden box with a clink.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of old Korean copper coins falling one by one into a wooden collection box, warm light. No readable
          text, no people.
        motion_prompt: >-
          Coins drop one after another into the box with soft clinks.
        camera: macro static

  - id: s06
    beat: solution
    lines:
      - text: "그렇게 하면 거의 1,300만 원이 된다는 계산이었습니다."
        captions: ["그렇게 하면 / 거의 1,300만 원이", "된다는 계산이었습니다"]
    visual: 상인이 다 쓴 종이를 들어 보이며 확신에 찬 눈빛으로 고개를 끄덕인다
    image_prompt: >-
      The merchant seen from the waist up in the middle of the frame, holding up the finished sheet of paper at chest
      height and nodding with confident eyes, the abacus on the desk in front of him. No readable text. No other people.
    characters: [merchant]
    motion_prompt: >-
      He holds up the sheet, taps it once and nods with confidence.
    camera: slow push in

  - id: s07
    beat: twist
    lines:
      - text: "그런데 담배를 안 피우는 사람들까지, 앞다퉈 나섰습니다. 누구였을까요?"
        captions: ["그런데 담배를 안 피우는 / 사람들까지", "앞다퉈 나섰습니다", "누구였을까요?"]
    visual: 상점 앞 탁자에 놓인 모금함 앞에 선 상인이 놀라 눈을 크게 뜨고, 뒤로 사람 몇이 줄지어 다가온다
    image_prompt: >-
      A wooden collection box on a small table in front of the shop, the merchant standing beside it in the middle of the
      frame, eyes widening in surprise as he looks toward the approaching people.
    characters: [merchant]
    extras: "two or three ordinary townspeople in plain hanbok lining up behind him with small offerings in their hands, small and out of focus"
    motion_prompt: >-
      People step up behind him one by one; his eyes widen and a moved smile appears.
    camera: static

  - id: s08
    beat: resolve
    lines:
      - text: "여인들은 은반지와 은장도를 내놓았고, 인력거꾼과 걸인도 동전을 보탰죠."
        captions: ["여인들은 / 은반지와 은장도를 내놓았고", "인력거꾼과 걸인도 / 동전을 보탰죠"]
    visual: 모금함 위로 은반지·은장도·동전이 쌓이고, 상인이 감격해 손을 모은다
    image_prompt: >-
      Close-up of the wooden collection box filling with silver rings, small silver ornamental knives and copper coins,
      the merchant's hands clasped together beside it, warm sunlight. No readable text. No faces.
    characters: [merchant]
    motion_prompt: >-
      A silver ring and a few coins drop onto the growing pile; his hands tighten together in gratitude.
    camera: macro slow push in
    extra_clips:
      - image_prompt: >-
          The merchant seen from the waist up in the middle of the frame, bowing deeply with gratitude beside the
          collection box, his eyes wet with emotion.
        characters: [merchant]
        extras: "a young woman in hanbok and an old rickshaw puller behind him, bowing back, small and out of focus"
        motion_prompt: >-
          He bows deeply; the people behind him bow back.
        camera: static

  - id: s09
    beat: info
    lines:
      - text: "이 운동의 기록은, 2017년 유네스코 세계기록유산이 되었습니다."
        captions: ["이 운동의 기록은", "2017년 유네스코 / 세계기록유산이 되었습니다"]
    visual: 박물관 유리 진열장 속 누렇게 바랜 옛 신문과 모금 기록 (사람 없이)
    image_prompt: >-
      A quiet museum display case with yellowed old Korean newspapers and handwritten donation ledgers from 1907 under
      soft spotlights. No readable text, no people.
    motion_prompt: >-
      The camera glides slowly along the display case in soft light.
    camera: slow pan

  - id: s10
    beat: info
    lines:
      - text: "담배를 끊어 나랏빚을 갚자던 이 운동이 바로 국채보상운동, 제안한 상인은 서상돈입니다."
        captions: ["담배를 끊어 나랏빚을 갚자던 / 이 운동이", "바로 국채보상운동", "제안한 상인은 / 서상돈입니다"]
      - text: "여러분이라면 나라를 위해 무엇을 끊으셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 나라를 위해", "무엇을 끊으셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 대구 거리, 상점 앞에 선 상인이 조용히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The merchant seen from the knees up in the middle of the frame, standing in front of his shop on a quiet old Daegu
      street at golden sunset, hands folded in his sleeves, a warm, dignified smile. Wide sunset sky above him. No other
      people.
    characters: [merchant]
    motion_prompt: >-
      He smiles warmly as the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the same merchant from the reference image, seen from the waist up in the middle of the
          frame, standing in front of his shop at sunset. He smiles warmly toward the viewer and holds one open palm out at
          chest height in a gentle "what do you think?" gesture. Calm, warm, family-friendly mood. No other people.
        characters: [merchant]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "서울신문 2025 — '양반도 걸인도 국채보상'… 대한매일신보 보도에 그때 K국민 뭉쳤다 (1907년 1월 대구 광문사 사장 김광제·부사장 서상돈이 담배를 끊어 빚을 갚자고 제안, 1907년 갚아야 할 돈 약 1,300만 원, 석 달 동안 담배를 끊고 한 사람당 한 달 20전씩, 양반·학생·부녀자·백정·승려·기생·인력거꾼·걸인까지 참여, 대한매일신보가 국채보상지원금총합소 운영, 일제가 횡령 사건을 조작해 양기탁을 재판에 넘김(무죄), 약 30만 원 모금 뒤 1년 6개월 만에 흐지부지, 2017년 유네스코 세계기록유산 등재) — https://m.seoul.co.kr/news/2025/01/16/20250116015001"
  - "서울신문 2016 [명인·명물을 찾아서] — 국채보상운동 (1907년 1월 29일 김광제·서상돈 발의, 취지문 '2천만 동포가 석 달간 담배를 끊고 한 사람이 한 달에 20전씩 모으면 거의 1,300만 원', 1907년 3월 대한매일신보 '경고 아 부인동포' — 여성들이 은반지·은장도 등 패물을 냄, 일제 보고서·명령서 121건) — https://m.go.seoul.co.kr/news/2016/05/30/20160530014003"

accuracy_notes:
  - "주인공 '상인'은 실존 인물 서상돈(대구 광문사 부사장). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 실제 제안은 광문사 사장 김광제와 함께였다. 마지막 대사 전까지 이름과 운동 이름을 밝히지 않는다."
  - "'골머리를 앓았습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s02 '갚지 못하면 나라를 통째로 빼앗길 판'은 '담배를 끊어 국채를 갚고 주권을 회복하자'(서울신문 2016)는 운동의 취지를 이야기로 푼 것."
  - "s05~s06 '2천만 동포·석 달·20전·거의 1,300만 원'은 취지문 내용(두 출처 공통)."
  - "s08 은반지·은장도는 서울신문 2016(1907년 3월 대한매일신보 기사) 기준, 인력거꾼·걸인 참여는 서울신문 2025 기준."
  - "실제 모금은 약 30만 원에 그쳤고, 일제의 탄압(횡령 사건 조작) 속에 1년 6개월 만에 흐지부지됐다 (서울신문 2025). 대본은 성공했다고 쓰지 않는다."
  - "s09 2017년 유네스코 세계기록유산 등재는 서울신문 2025 기준."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 상인 한 명 중심, s07에 시민 2~3명, s08-2에 여인과 인력거꾼. 실사 편, 화면 제목 없음."

youtube:
  titles:
    - 담배를 끊어서 나랏빚을 갚자고? 1907년 대구 상인의 계산
    - 걸인도 동전을, 여인은 은반지를 내놓은 이유
    - 2천만 명이 석 달만 참으면 된다? 나랏빚 갚기 대작전
  description: |-
    💰 나라가 일본에 진 빚 1,300만 원… 갚지 못하면 나라를 통째로 빼앗길 판이라면?

    1907년, 대구의 한 상인이 기막힌 계산을 내놓았습니다 🧮
    "2천만 동포가 석 달만 담배를 끊고, 한 달에 20전씩 모으자!"
    그런데 담배를 안 피우는 사람들까지 앞다퉈 나섰다는데요? 🤔

    여인들은 은반지와 은장도를, 인력거꾼과 걸인도 동전을 보탰습니다 💍 그 기록은 지금 유네스코 세계기록유산! 운동의 이름은 영상 끝에서.
  comment_question: 여러분이라면 나라를 위해 무엇을 끊으셨을까요? 여러분의 생각이 궁금합니다.
