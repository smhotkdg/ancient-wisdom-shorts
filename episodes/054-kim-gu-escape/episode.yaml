# 054 김구 — 현상금 60만 원, 가짜 부부와 운전사 작전으로 상하이를 빠져나간 사내 (독립운동가 편, 실사)
id: "054"
style: photoreal
slug: kim-gu-escape
status: script_ok
working_title: 목에 200억 원이 걸린 사내는 어떻게 상하이를 빠져나갔을까?
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["현상금 200억 원", "가짜 부부로 탈출?"]
hook: 발을 동동 굴렀습니다
caption_keywords: [발을 동동, "60만 원", "200억 원", 목사 부부, 아내인 척, 운전사, 광둥 사람, 뱃사공]

story:
  hero: 사내
  reveal: [김구, 백범]

characters:
  - id: man
    name: 사내
    name_en: Korean man in 1930s Shanghai
    description: >-
      a sturdy, broad-shouldered Korean man in his mid-50s with a strong square face, calm steady eyes behind round
      dark-framed glasses, very short cropped greying hair and a thick dark moustache, wearing a plain dark grey
      Chinese-style long gown (changshan) and simple black cloth shoes
    note: 이야기 주인공. 1932년 상하이 대한민국 임시정부의 지도자 (마지막 대사 전까지 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1932년 상하이, 훙커우 공원 의거 뒤 한 사내는 발을 동동 굴렀습니다."
        captions: ["1932년 상하이 / 훙커우 공원 의거 뒤", "한 사내는 / 발을 동동 굴렀습니다"]
      - text: "자기 목에 60만 원, 지금 돈 약 200억 원의 현상금이 걸렸거든요."
        captions: ["자기 목에 60만 원", "지금 돈 약 200억 원의 / 현상금이 걸렸거든요"]
    visual: 1930년대 상하이 셋방, 사내가 창문 커튼 틈으로 바깥을 살피며 초조하게 서성인다 / 벽에 붙은 수배 전단 (글자 흐릿)
    image_prompt: >-
      A dim rented room in 1930s Shanghai with old wooden furniture, the man seen from the waist up in the middle of
      the frame, standing beside a window and peering through a narrow gap in the curtain with a tense, wary face. No
      other people.
    characters: [man]
    motion_prompt: >-
      He peers out through the curtain gap, lets it fall, and paces a step with a tense breath.
    camera: slow push in at eye level
    extra_clips:
      - image_prompt: >-
          A rough paper wanted notice pasted on a weathered brick wall of a 1930s Shanghai alley, a large printed number
          and blurred unreadable text, the edges flapping in the wind, dim evening light. No people, no face drawn on it.
        motion_prompt: >-
          The edges of the paper notice flutter in the wind against the brick wall.
        camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "거리마다 일본 경찰과 밀정이 눈을 번뜩이고 있었죠."
        captions: ["거리마다 일본 경찰과 밀정이", "눈을 번뜩이고 있었죠"]
    visual: 비 젖은 상하이 골목 입구, 가로등 아래 경찰 실루엣 하나가 멀리 서 있다 (얼굴 안 보임)
    image_prompt: >-
      The entrance of a rain-wet 1930s Shanghai lane at night with shuttered shopfronts and a single street lamp, one
      small distant silhouette of a uniformed policeman standing under the lamp, face not visible, a tense, watchful
