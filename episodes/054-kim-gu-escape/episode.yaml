      calm. Plain wall behind him. No other people.
    characters: [man]
    motion_prompt: >-
      He takes off his glasses, rubs his nose, thinks, then puts the glasses back on with quiet resolve.
    camera: static

  - id: s04
    beat: solution
    lines:
      - text: "그래서 사내는 미국인 목사 부부의 집 2층에 숨어들었습니다."
        captions: ["그래서 사내는 / 미국인 목사 부부의", "집 2층에 숨어들었습니다"]
    visual: 서양식 주택 2층 다락방, 사내가 커튼 친 창가 의자에 조용히 앉아 있고 문가에 목사 부부가 서 있다
    image_prompt: >-
      A quiet second-floor room of a Western-style house in 1930s Shanghai with heavy drawn curtains and a narrow bed,
      the man in the middle of the frame seen from the waist up, sitting still on a wooden chair, listening carefully,
      calm but alert.
    characters: [man]
    extras: "an American couple in 1930s clothes, a man in a dark suit and a woman in a simple dress, standing by the doorway behind him, small and slightly out of focus"
    motion_prompt: >-
      He sits still and listens; the couple at the door exchange a worried glance and nod to him.
    camera: static at eye level

  - id: s05
    beat: solution
    lines:
      - text: "그런데 정탐꾼에게 들킨 것 같다는 소식! 어떤 작전이 펼쳐졌을까요?"
        captions: ["그런데 정탐꾼에게 / 들킨 것 같다는 소식!", "어떤 작전이 / 펼쳐졌을까요?"]
    visual: 사내가 커튼 틈으로 아래 거리를 내려다보다 놀라 몸을 뒤로 뺀다
    image_prompt: >-
      The man seen from the chest up in the middle of the frame, standing by the curtained second-floor window, pulling
      back from a narrow gap in the curtain with a sudden sharp look of alarm. Dim room light. No other people.
    characters: [man]
    motion_prompt: >-
      He glances down through the gap, stiffens, and quickly steps back from the window.
    camera: static

  - id: s06
    beat: twist
    lines:
      - text: "목사 부인은 사내의 아내인 척 나란히 앉고, 목사는 운전사가 되어 차를 몰았습니다."
        captions: ["목사 부인은 사내의 / 아내인 척 나란히 앉고", "목사는 운전사가 되어 / 차를 몰았습니다"]
    visual: 1930년대 검은 자동차 뒷좌석, 사내가 모자를 눌러쓰고 서양 여인과 나란히 태연하게 앉아 있다 / 운전석에서 목사가 핸들을 잡는다
    image_prompt: >-
      The back seat of a black 1930s automobile, the man seen from the chest up in the middle of the frame, wearing a
      felt hat pulled low and sitting calmly upright, looking straight ahead with a composed face.
    characters: [man]
    extras: "a Western woman in a 1930s cloche hat sitting close beside him like his wife, calm and smiling politely, and a man in a suit at the steering wheel in front, both partly out of focus"
    motion_prompt: >-
      The car rolls forward; streetlights slide across his calm face as the woman beside him keeps a polite smile.
    camera: static
    extra_clips:
      - image_prompt: >-
          A black 1930s automobile driving away down a tree-lined street of the Shanghai French Concession in soft
          morning light, seen from behind at a distance. No faces visible.
        motion_prompt: >-
          The car drives steadily away down the street and turns the corner.
        camera: static

  - id: s07
    beat: resolve
    lines:
      - text: "그렇게 외국인 부부가 탄 차는, 유유히 상하이를 빠져나갔죠."
        captions: ["그렇게 외국인 부부가 탄 차는", "유유히 상하이를 빠져나갔죠"]
    visual: 상하이 외곽 시골길, 먼지를 날리며 달리는 검은 자동차 (사람 안 보임)
    image_prompt: >-
      A dusty country road outside Shanghai in the 1930s with flat green fields and willow trees, a black 1930s
      automobile driving away into the distance, a sense of escape and relief, warm late-afternoon light. No faces
      visible.
    motion_prompt: >-
      The car speeds down the country road leaving a trail of dust drifting across the fields.
    camera: slow pan

  - id: s08
    beat: info
    lines:
      - text: "이번엔 물가 마을에서 광둥 사람 행세를 하며, 뱃사공 처녀의 배 위에서 숨어 지냈다고 합니다."
        captions: ["이번엔 물가 마을에서 / 광둥 사람 행세를 하며", "뱃사공 처녀의 배 위에서 / 숨어 지냈다고 합니다"]
    visual: 운하 위 작은 나룻배 선실 앞에 사내가 삿갓을 쓰고 앉아 있고, 뒤에서 젊은 뱃사공이 노를 젓는다
    image_prompt: >-
