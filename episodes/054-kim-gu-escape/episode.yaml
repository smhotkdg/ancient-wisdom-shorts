    motion_prompt: >-
      Rain drips from the eaves; the distant silhouette slowly turns its head, scanning the lane.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "얼굴까지 알려진 이 사내가, 이 포위망을 어떻게 빠져나갈까요?"
        captions: ["얼굴까지 알려진 이 사내가", "이 포위망을 어떻게 / 빠져나갈까요?"]
    visual: 등잔 아래 사내가 둥근 안경을 벗어 닦으며 깊이 생각한다
    image_prompt: >-
      At night under a small desk lamp, the man seen from the waist up in the middle of the frame, sitting at a table
