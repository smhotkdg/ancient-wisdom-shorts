  description: |-
    🚗 내 목에 지금 돈 200억 원의 현상금이 걸렸다면… 여러분은 어떻게 도망치시겠어요?

    1932년 상하이, 거리마다 일본 경찰과 밀정이 깔렸습니다 👀
    한 사내는 미국인 목사 부부의 집 2층에 숨어드는데… 그런데 정탐꾼에게 들켰다고?! 😱
    목사 부인은 '아내'인 척, 목사는 '운전사'로 변신! 🎭

    그다음엔 뱃사공 처녀의 배 위에서 숨어 지냈다는데요 🛶 우리가 아주 잘 아는 이 사내의 이름은 영상 끝에서!
  comment_question: 여러분이라면 어떤 변장으로 빠져나가셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 독립운동가, 임시정부, 한국사, 쇼츠]
