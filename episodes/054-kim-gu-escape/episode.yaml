      and white-walled houses along the banks, the man seated in the middle of the frame at the front of the cabin, seen
      from the waist up, wearing a plain grey gown and a woven bamboo hat, looking quietly over the water.
    characters: [man]
    extras: "a young Chinese boatwoman in simple blue cotton clothes standing at the stern behind him, rowing with a long oar, small and slightly out of focus"
    motion_prompt: >-
      The boat glides slowly along the canal as the boatwoman rows; ripples spread behind them.
    camera: slow tracking alongside

  - id: s09
    beat: info
    lines:
      - text: "현상금 60만 원의 이 사내가 바로, 백범 김구입니다."
        captions: ["현상금 60만 원의 / 이 사내가", "바로, 백범 김구입니다"]
      - text: "여러분이라면 어떤 변장으로 빠져나가셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 어떤 변장으로", "빠져나가셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 물가 마을, 사내가 다리 위에 서서 잔잔히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
