          Friendly medium shot of the same man from the reference image, seen from the waist up in the middle of the
          frame, standing on the stone bridge at sunset. He smiles warmly toward the viewer and holds one open palm out
          at chest height in a gentle "what do you think?" gesture. Calm, warm, family-friendly mood. No other people.
        characters: [man]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "서울신문 [대한외국인] 쫓기는 독립운동가 은신처 제공… '위장 부부'로 김구 피신 도왔다 (1932년 4월 윤봉길 의거 직후 김구·엄항섭·안공근·김철을 피치 부부가 약 한 달간 숨겨 줌 — 『백범일지』는 '20여일', 정탐꾼에게 발각된 것 같다는 제럴딘 피치의 말, 제럴딘이 김구의 부인인 척 나란히 차에 타고 조지 피치가 운전사 역할, 자싱으로 탈출, 조지 피치 1968년 독립장) — https://m.seoul.co.kr/news/2024/10/07/20241007011001"
  - "대한민국 정책브리핑 (김구에게 걸린 현상금 60만 원 — 현재 금액으로 약 200억 원 상당) — https://www.korea.kr/briefing/policyBriefingView.do?newsId=148859664"
  - "서울신문 [글로벌 시대] 김구 선생과 주아이바오 (민재홍 덕성여대 교수, 60만 원 현상금, 상하이에서 95km 떨어진 자싱으로 숨어 추푸청의 도움을 받음, 광둥 사람 행세, 뱃사공 처녀 주아이바오의 배 위에서 낮에 피신 생활 — 뒷부분의 최후 묘사는 소설 『선월』 기준이라 쓰지 않음) — https://www.seoul.co.kr/news/2015/09/07/20150907030004"
  - "위키백과(영문) Kim Ku hideout (Meiwan Street) (홍커우 공원 의거 뒤 추푸청의 도움으로 자싱에 숨음, 1932년 5월~1934년 무렵) — https://en.wikipedia.org/wiki/Kim_Ku_hideout_(Meiwan_Street)"

accuracy_notes:
  - "주인공은 실존 독립운동가 김구(1876~1949, 호 백범). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'발을 동동 굴렀습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 훙커우 공원 의거(1932년 4월 29일, 윤봉길)는 배경으로만 말하고 폭탄·폭발 장면은 화면에 넣지 않는다. 현상금 60만 원·약 200억 원은 정책브리핑·서울신문 기준이며 지금 돈 환산은 기사 표현을 따른 대략값. 화면의 수배 전단은 연출(얼굴 없음)."
  - "s02 '거리마다 일본 경찰과 밀정'은 수색 상황을 이야기로 푼 재구성이다."
  - "s04 피치 부부(조지·제럴딘 피치) 집 은신은 서울신문 기준. 기간은 『백범일지』 '20여일'·기사 '약 한 달'이 엇갈려 대본에 넣지 않는다. 함께 숨은 엄항섭·안공근·김철은 대본·화면에서 뺀다. '2층'은 서울신문의 '제럴딘이 2층으로 올라와 알렸다'는 서술에 기댄 표현이다."
  - "s05~s07 정탐꾼에게 발각된 것 같다는 말, 부인인 척 나란히 탄 일, 목사가 운전사 역할은 서울신문 기준. '유유히 빠져나갔다'는 이야기 표현이며 검문 장면은 넣지 않는다."
  - "s08 자싱 피신(추푸청의 도움), 광둥 사람 행세, 뱃사공 주아이바오의 배 위에서 낮에 지낸 일은 서울신문(민재홍) 기준이며 '했다고 합니다'로 쓴다. 지명(자싱)·이름(주아이바오·추푸청)은 대본에 넣지 않는다. 뒤의 난징 생활과 소설 『선월』의 내용은 쓰지 않는다."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 사내 한 명 중심, s04에 목사 부부, s06에 목사 부인·운전하는 목사, s08에 뱃사공. s02는 멀리 경찰 실루엣 하나. 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용). 실존 인물 사진처럼 만들지 않도록 '창작 인물' 문구는 프리셋이 붙인다."

