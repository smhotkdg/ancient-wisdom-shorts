    - 궁궐 시계를 길거리로! 백성을 위한 임금의 아이디어
  description: |-
    ⏰ 지금 몇 시지? 시계는 궁궐 깊숙이에만 있고, 백성들은 해를 보며 어림짐작…

    조선의 임금은 이걸 그냥 두지 않았습니다 ☀️
