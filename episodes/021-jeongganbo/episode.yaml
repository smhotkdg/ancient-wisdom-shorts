# 021 정간보 — 우물 정(井) 자 칸으로 소리의 길이를 적은 조선의 악보
id: "021"
slug: jeongganbo
status: done
working_title: 조선 악사들은 어떻게 소리의 길이까지 악보에 적었을까?
title_lines: ["소리의 길이를", "칸으로 적었다고?"]
hook: 두 손 두 발 다 들었습니다
caption_keywords: [박자, 음 높이, 네모 칸, 한 칸, 첫 글자]

story:
  hero: 악사
  reveal: [정간보]

characters:
  - id: musician
    name: 악사
    name_en: Joseon court musician
    description: >-
      a slender, expressive Korean man in his 30s with a neat topknot under a black court musician's hat, a thin
      mustache, lively curious eyes, wearing a red Joseon court musician's robe with a dark sash, holding a long bamboo
      daegeum flute and a brush
    note: 이야기 주인공. 궁중 음악을 연주하는 악사

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "궁궐의 악사는 두 손 두 발 다 들었습니다."
        captions: ["궁궐의 악사는", "두 손 두 발 / 다 들었습니다"]
      - text: "같은 곡인데도, 연주할 때마다 박자가 제멋대로였거든요."
        captions: ["같은 곡인데도", "연주할 때마다 / 박자가", "제멋대로였거든요"]
    visual: 궁궐 연주 마루, 대금을 든 악사가 악보를 보다가 두 팔을 번쩍 든다
    image_prompt: >-
      A Joseon palace music hall with wooden floors and red pillars, traditional instruments (a gayageum, a large drum,
      a set of bronze bells) arranged around, the court musician in the center foreground holding his flute in one hand
      and throwing both arms up in exasperation over a sheet of music on a low stand.
    characters: [musician]
    extras: "two other court musicians in red robes sitting blurred in the background, each playing a different rhythm and glancing at each other in confusion"
    motion_prompt: >-
      The musician throws his arms up and shakes his head; behind him the others keep playing out of time.
    camera: static
    sfx_volume: 0
    extra_clips:
      - image_prompt: >-
          Close-up of the musician alone, cheeks puffed, playing his bamboo flute and then stopping mid-note with a
          baffled look at the music sheet. No other people. Music sheet with blurred illegible marks only.
        characters: [musician]
        motion_prompt: >-
          He blows a note, stops, frowns at the sheet and tilts his head in confusion.
        camera: slow push in
        sfx_volume: 0

  - id: s02
    beat: problem
    lines:
      - text: "악보엔 음 높이만 적혀 있어, 소리를 얼마나 길게 낼지 알 수 없었죠."
        captions: ["악보엔 / 음 높이만 적혀 있어", "소리를 얼마나 / 길게 낼지", "알 수 없었죠"]
    visual: 글자만 세로로 빼곡한 옛 악보를 악사가 들여다보며 고개를 갸웃
    image_prompt: >-
      Close view of an old paper music sheet with only a single column of simple brush marks, no spacing or rhythm
      shown, the musician holding it up close and squinting, scratching his head. No other people. Brush marks
      illegible, no readable text.
    characters: [musician]
    motion_prompt: >-
      He turns the sheet sideways, squints, and scratches his head with the flute.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "소리의 길이까지, 어떻게 종이 위에 적을 수 있을까요?"
        captions: ["소리의 길이까지", "어떻게 종이 위에 / 적을 수 있을까요?"]
    visual: 밤, 악사가 창살 창문의 네모 칸 그림자를 보다가 눈을 반짝인다
    image_prompt: >-
      At night in the music hall, moonlight casting the square grid shadow of a wooden lattice window across the floor,
      the musician sitting beside it staring at the neat square shadows, a spark of an idea in his eyes. No other people.
    characters: [musician]
    motion_prompt: >-
      He traces one square of the lattice shadow with his finger and slowly smiles.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 악사는, 종이에 우물 정 자 같은 칸을 줄줄이 그렸습니다."
        captions: ["그래서 악사는", "종이에 / 우물 정 자 같은 칸을", "줄줄이 그렸습니다"]
    visual: 악사가 붓과 자로 종이에 세로로 이어진 네모 칸들을 그린다
    image_prompt: >-
      The musician kneeling at a low desk drawing a long vertical column of equal square boxes on paper with a brush and a
      wooden ruler, the grid looking like a row of little windows, ink stone beside him. No other people. No text.
    characters: [musician]
    motion_prompt: >-
      The brush glides along the ruler and square box after square box appears down the paper.
    camera: slow tilt down

  - id: s05
    beat: solution
    lines:
      - text: "칸 하나는 똑같은 시간 한 토막, 칸을 많이 차지하면 길게 냈죠."
        captions: ["칸 하나는 / 똑같은 시간 한 토막", "칸을 많이 차지하면 / 길게 냈죠"]
    visual: 칸이 하나씩 빛나며 흘러가고, 한 칸짜리 짧은 소리와 세 칸에 걸친 긴 소리가 대비된다
    image_prompt: >-
      A clean illustration of a vertical column of square boxes: one box glowing briefly for a short sound, and three
      boxes in a row glowing together for a long sound, with soft sound-wave ribbons beside them showing short and long.
      Clean educational illustration, no labels, no text, no people.
    motion_prompt: >-
      A glow moves down the boxes one by one at a steady pace; one box flashes short, three boxes glow long together.
    camera: static
    sfx_volume: 0

  - id: s06
    beat: solution
    lines:
      - text: "이제 모두가 칸을 세며 연주하니, 박자가 딱딱 맞아떨어졌습니다."
        captions: ["이제 모두가 / 칸을 세며 연주하니", "박자가 딱딱 / 맞아떨어졌습니다"]
    visual: 악사가 칸 악보를 손가락으로 짚으며 대금을 불고, 뒤의 악사들이 같은 박자로 연주한다
    image_prompt: >-
      The musician in the center foreground playing his flute while pointing at the boxed music sheet on the stand,
      tapping each box in time, looking delighted.
    characters: [musician]
    extras: "two court musicians in red robes in the background playing a drum and a gayageum in perfect time, smiling"
    motion_prompt: >-
      His finger taps down the boxes in a steady beat; behind him the drum and strings play in sync.
    camera: slow pull back
    sfx_volume: 0

  - id: s07
    beat: twist
    lines:
      - text: "그런데 칸만으로는, 어떤 높이의 소리인지 알 수 없잖아요?"
        captions: ["그런데 칸만으로는", "어떤 높이의 / 소리인지", "알 수 없잖아요?"]
    visual: 빈 칸만 이어진 악보를 들고 악사가 높은 소리인지 낮은 소리인지 몰라 고민한다
    image_prompt: >-
      The musician holding up a sheet with only empty square boxes, one hand raised high and the other low as if weighing
      a high note against a low note, a puzzled frown. No other people. No text.
    characters: [musician]
    motion_prompt: >-
      He raises one hand high then lowers the other, looks at the empty boxes and shrugs.
    camera: static

  - id: s08
    beat: resolve
    lines:
      - text: "그래서 칸 안에, 음 이름의 첫 글자를 하나씩 써넣었습니다."
        captions: ["그래서 칸 안에", "음 이름의 / 첫 글자를", "하나씩 써넣었습니다"]
      - text: "칸은 소리의 길이를, 글자는 소리의 높이를 알려 준 거죠."
        captions: ["칸은 소리의 길이를", "글자는 / 소리의 높이를", "알려 준 거죠"]
    visual: 붓이 칸 안에 글자를 하나씩 써넣고, 완성된 칸 악보가 빛난다
    image_prompt: >-
      Close-up of the musician's brush writing a single small character inside each square box down the column, some
      boxes left empty to show a held note, the finished grid score glowing softly. No other people. Characters drawn as
      simple stylized brush marks, not readable text.
    characters: [musician]
    motion_prompt: >-
      The brush writes one mark into a box, skips an empty box, then writes the next; the column glows.
    camera: slow tilt down
    extra_clips:
      - image_prompt: >-
          A clean diagram: a vertical column of square boxes with a glowing ribbon showing length on the left side and
          small stair-step markers showing high and low pitch on the right side. Clean educational illustration,
          no labels, no text, no people.
        motion_prompt: >-
          The length ribbon stretches along the boxes while the pitch markers step up and down beside them.
        camera: static

  - id: s09
    beat: info
    lines:
      - text: "이 악보는 동양에서 가장 오래된, 길이 적는 악보로 꼽히며 지금도 국악에서 쓰이죠."
        captions: ["이 악보는 동양에서 / 가장 오래된", "길이 적는 악보로 / 꼽히며", "지금도 / 국악에서 쓰이죠"]
    visual: 오래된 책 속 칸 악보와, 오늘날 국악 연주대 위에 놓인 같은 모양의 악보
    image_prompt: >-
      An old bound book lying open showing columns of square-box music notation, and beside it a modern music stand on a
      traditional Korean music stage holding a sheet with the same box-grid notation, warm stage light. No people.
      Notation drawn as stylized grids and marks, not readable text.
    motion_prompt: >-
      The old book's pages turn gently and the camera glides over to the modern sheet on the stand.
    camera: slow pan

  - id: s10
    beat: info
    lines:
      - text: "우물 정 자 칸으로 음악을 적은 이 악보가 바로, 정간보입니다."
        captions: ["우물 정 자 칸으로 / 음악을 적은", "이 악보가 / 바로, 정간보입니다"]
      - text: "칸 악보로 연주해 보고 싶다면 댓글에 '도전'! 신기했다면 좋아요 꾹!"
        captions: ["칸 악보로 / 연주해 보고 싶다면", "댓글에 '도전'!", "신기했다면 / 좋아요 꾹!"]
        cta: true
    visual: 칸 악보를 펼쳐 든 악사가 뿌듯하게 웃는다 / 이어서 시청자를 보며 엄지척
    image_prompt: >-
      The musician standing in the palace music hall in golden morning light, proudly holding up a long sheet of
      box-grid music notation in one hand and his flute in the other, smiling. No other people. No readable text.
    characters: [musician]
    motion_prompt: >-
      He lifts the sheet higher and grins; the camera slowly pulls back across the music hall.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          Close-up of the musician looking straight at the viewer with a big friendly grin, holding his flute under one arm,
          giving a thumbs-up and pointing at the viewer. No other people.
        characters: [musician]
        motion_prompt: >-
          He grins at the camera, gives a thumbs-up and points at the viewer with a wink.
        camera: slow push in

sources:
  - "한국민족문화대백과 — 정간보(井間譜) (세종 때 만들어짐, 늦어도 1447년에는 기본 형태 완성, 창안자·연대는 정확히 알 수 없음, 우물 정(井) 자 모양 칸을 이어 칸으로 소리의 길이를 시각적으로 나타내고 칸 안팎에 음 높이·주법·가사를 적음, 세종 때 음 높이는 율자(율명의 첫 글자)로 적음, 세종실록 악보에 정간보로 기록된 곡이 많음, 오선보와 함께 세계에서 가장 오래된 유량 기보법, 지금도 정악에서 사용) — https://encykorea.aks.ac.kr/Article/E0049898"
  - "국립국악원 국악사전 — 정간보 (세종 시기에 악학 관계자들과 함께 창안, 우물 정 자 모양 칸으로 음의 길이와 장단을 시각화, 음 높이는 율자보 등 음고 기보법을 함께 씀, 동양 최고(最古)의 유량 기보로 평가, 현대에도 교육·연주에 활용) — https://www.gugak.go.kr/ency/topic/view/1315"

accuracy_notes:
  - "악사 인물과 감정, 대사는 설명용 재구성. 정간보는 세종 때 악학 관계자들이 함께 만든 것으로, 특정 악사 한 명이 만들었다는 기록은 없다."
  - "'두 손 두 발 다 들었습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s01~s02 '박자가 제멋대로', '음 높이만 적혀 있었다'는 정간보 이전 악보에 음의 길이를 적는 방법이 없었다는 점(유량 기보의 의의)을 이야기로 푼 것."
  - "s05 '칸 하나 = 똑같은 시간 한 토막'으로만 쓴다. '1정간 = 1박' 해석은 학계에서 논란이 있어(한국민족문화대백과) '한 박'이라고 쓰지 않는다."
  - "s08 칸 안의 글자는 세종 때 율자(율명의 첫 글자). 그림에서는 읽을 수 있는 글자로 그리지 않는다."
  - "s09 '동양에서 가장 오래된 길이를 적는 악보'는 국립국악원 '동양 최고의 유량 기보' 기준."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 말이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 엄지척 컷."
  - "배경 인물 장면은 s01(박자가 엉킨 악사들)·s06(박자가 맞는 악사들) 두 개."

youtube:
  titles:
    - 소리의 길이를 칸으로 적었다고? 조선의 천재 악보
    - 박자가 제멋대로였던 궁중 음악을 구한 네모 칸
    - 동양에서 가장 오래된 '길이 적는 악보'의 비밀
  description: |-
    🎶 같은 곡인데 연주할 때마다 박자가 다르다면… 악보에 뭐가 빠져 있었던 걸까요?

    조선의 악사들은 종이에 우물 정(井) 자 칸을 줄줄이 그렸습니다 ▦
    칸 하나는 똑같은 시간 한 토막, 칸을 많이 차지하면 긴 소리!
    칸 안에는 음 이름의 첫 글자를 써서 높이까지 한 번에 ✍️

    동양에서 가장 오래된 '소리의 길이를 적는 악보', 지금도 국악 무대에서 쓰이고 있답니다.
  comment_question: 칸 악보로 연주해 보고 싶다면 댓글에 '도전'!
  hashtags: [정간보, 세종, 국악, 조선문화, 쇼츠]
