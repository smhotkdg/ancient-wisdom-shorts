# 024 오층탑 — 흔들려서 버티는 일본의 나무 탑
id: "024"
slug: pagoda
status: script_ok
working_title: 지진이 잦은 일본에서 나무 탑은 어떻게 버텼을까?
title_lines: ["흔들려서", "무너지지 않는 탑?"]
hook: 눈앞이 캄캄했습니다
caption_keywords: [지진, 층층이, 이음새, 가운데 기둥, 흔들림]

story:
  hero: 목수
  reveal: [오층탑]

characters:
  - id: carpenter
    name: 목수
    name_en: Japanese temple carpenter
    description: >-
      a wiry, focused Japanese man in his 40s with short black hair tied back, a rolled white cloth headband, thin
      mustache, calm sharp eyes, wearing a dark indigo work jacket (hanten) with a simple crest, fitted dark trousers and
      split-toe tabi boots, a wooden carpenter's square tucked in his belt
    note: 이야기 주인공. 지진이 잦은 땅에 높은 나무 탑을 세워야 하는 절 목수

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "지진이 잦은 섬나라의 목수는 눈앞이 캄캄했습니다."
        captions: ["지진이 잦은 섬나라의 목수는 / 눈앞이 캄캄했습니다"]
      - text: "땅이 흔들릴 때마다, 높은 탑이 무너질 판이었거든요."
        captions: ["땅이 흔들릴 때마다", "높은 탑이 / 무너질 판이었거든요"]
    visual: 땅이 흔들리는 절 마당, 목수가 비틀거리며 반쯤 지은 나무 탑을 올려다본다
    image_prompt: >-
      A Japanese temple courtyard during an earthquake, the ground cracking slightly, roof tiles rattling, a half-built
      tall wooden tower frame swaying dangerously, the carpenter in the center foreground stumbling and staring up at it
      with wide horrified eyes.
    characters: [carpenter]
    motion_prompt: >-
      The ground shakes, dust falls and the tall frame wobbles; he staggers and throws out his arms for balance.
    camera: handheld shake
    extra_clips:
      - image_prompt: >-
          Close-up of the carpenter crouching on the trembling ground, gripping it with one hand, looking up in dread as
          loose wooden beams tumble from the tower frame above. No other people.
        characters: [carpenter]
        motion_prompt: >-
          A beam drops and thuds beside him; he flinches and covers his head.
        camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "기둥을 아무리 튼튼히 박아도, 땅이 흔들리면 버티기 힘들었죠."
        captions: ["기둥을 아무리 / 튼튼히 박아도", "땅이 흔들리면 / 버티기 힘들었죠"]
    visual: 목수가 굵은 나무 기둥을 망치로 박지만, 흔들림에 기둥이 휘청인다
    image_prompt: >-
      The carpenter hammering a thick wooden post deep into the ground with a big wooden mallet, then the post shuddering
      and leaning as the ground trembles, his face frustrated. No other people.
    characters: [carpenter]
    motion_prompt: >-
      He strikes the post hard; the ground trembles and the post wobbles and leans anyway.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "흔들리는 땅 위에, 어떻게 높은 탑을 세울 수 있을까요?"
        captions: ["흔들리는 땅 위에", "어떻게 높은 탑을 / 세울 수 있을까요?"]
    visual: 바람에 흔들리면서도 부러지지 않는 버드나무 아래 목수가 앉아 생각에 잠긴다
    image_prompt: >-
      The carpenter sitting under a large willow tree beside a pond, the long willow branches swaying in strong wind
      without breaking, him watching them closely with a spark of an idea in his eyes. No other people.
    characters: [carpenter]
    motion_prompt: >-
      Strong wind bends the willow branches far and they spring back; his eyes widen and he sits up.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 목수는 탑을 한 덩어리로 짓지 않고, 층층이 따로 얹었습니다."
        captions: ["그래서 목수는 / 탑을 한 덩어리로 짓지 않고", "층층이 따로 얹었습니다"]
    visual: 나무 상자 같은 층을 하나씩 위에 얹어 탑이 올라간다
    image_prompt: >-
      The carpenter guiding a large box-like wooden story with wide eaves as it is lowered onto the story below, stacking
      the tower layer by layer like boxes, three stories already standing. No other people.
    characters: [carpenter]
    motion_prompt: >-
      The new story settles gently onto the one below; he steps back and checks it with his square.
    camera: slow tilt up
    extra_clips:
      - image_prompt: >-
          A clean cutaway diagram of a five-story wooden pagoda showing each story as a separate box-like frame simply
          stacked on top of the one below, not fixed together. Clean educational illustration, no labels, no text,
          no people.
        motion_prompt: >-
          The five box-like stories stack one by one from the bottom to the top.
        camera: static

  - id: s05
    beat: solution
    lines:
      - text: "지진이 오면 층마다 따로 흔들리며, 힘을 나눠 받았죠."
        captions: ["지진이 오면 / 층마다 따로 흔들리며", "힘을 나눠 받았죠"]
    visual: 단면도 — 흔들림 속에 각 층이 서로 다른 방향으로 살짝씩 움직이며 힘이 흩어진다
    image_prompt: >-
      A cutaway illustration of the stacked pagoda during an earthquake: each story shifting slightly in a different
      direction, small glowing arrows showing the shaking force split up and spread across the stories.
      Clean educational illustration, no labels, no text, no people.
    motion_prompt: >-
      The stories sway slightly in alternating directions and the force arrows split and fade.
    camera: static

  - id: s06
    beat: solution
    lines:
      - text: "나무 이음새도 살짝 미끄러지며, 버드나무처럼 휘청이다 제자리를 찾았죠."
        captions: ["나무 이음새도 / 살짝 미끄러지며", "버드나무처럼 휘청이다 / 제자리를 찾았죠"]
    visual: 못 없이 맞물린 나무 이음새 클로즈업, 흔들림에 살짝 미끄러졌다 제자리로 돌아온다
    image_prompt: >-
      Close-up of intricate interlocking wooden joints without nails in the pagoda's frame, the carpenter's hand resting on
      them as they slide a tiny bit and settle back into place. No other people.
    characters: [carpenter]
    motion_prompt: >-
      The joints slip a few millimeters and slide back into place; he nods knowingly.
    camera: slow push in

  - id: s07
    beat: twist
    lines:
      - text: "그런데 층이 따로 흔들리면, 한 층이 쑥 빠지지 않을까요?"
        captions: ["그런데 층이 따로 흔들리면", "한 층이 / 쑥 빠지지 않을까요?"]
    visual: 목수가 탑을 올려다보며, 한 층이 옆으로 밀려나는 상상에 식은땀을 흘린다
    image_prompt: >-
      The carpenter looking up anxiously at the stacked pagoda, imagining one middle story sliding sideways off the others
      (shown as a faint ghostly outline), sweat on his brow. No other people.
    characters: [carpenter]
    motion_prompt: >-
      A ghostly outline of a story slides sideways in his imagination; he wipes his brow nervously.
    camera: static

  - id: s08
    beat: resolve
    lines:
      - text: "그래서 탑 한가운데, 바닥부터 꼭대기까지 굵은 기둥을 세웠습니다."
        captions: ["그래서 탑 한가운데", "바닥부터 꼭대기까지 / 굵은 기둥을 세웠습니다"]
      - text: "층이 미끄러지려 하면, 이 기둥이 붙잡아 가운데로 되돌려 놓았죠."
        captions: ["층이 미끄러지려 하면", "이 기둥이 붙잡아 / 가운데로 되돌려 놓았죠"]
    visual: 단면도 — 탑 한가운데를 관통하는 굵은 기둥, 층이 밀리면 기둥에 닿아 가운데로 돌아온다
    image_prompt: >-
      A cutaway illustration of the five-story pagoda with one thick central wooden pillar running from the ground to the
      top spire through the middle of all the stories; one story shifts and bumps the pillar and is pushed back to center.
      Clean educational illustration, no labels, no text, no people.
    motion_prompt: >-
      A story slides sideways, bumps the central pillar and glides back to the center.
    camera: static
    extra_clips:
      - image_prompt: >-
          Inside the pagoda looking up: the carpenter standing at the base of the huge central wooden pillar, hand on it,
          the pillar rising up through the dim layered stories above. No other people.
        characters: [carpenter]
        motion_prompt: >-
          He pats the great pillar and looks up as the stories above creak gently and settle.
        camera: slow tilt up

  - id: s09
    beat: info
    lines:
      - text: "이 방식은 오늘날 높은 건물에도 이어지고 있습니다."
        captions: ["이 방식은 오늘날", "높은 건물에도 / 이어지고 있습니다"]
    visual: 오래된 나무 탑 뒤로 현대 도시의 고층 빌딩과 전파탑이 보인다
    image_prompt: >-
      An old five-story wooden pagoda in the foreground and a modern city skyline of skyscrapers and a tall broadcasting
      tower in the background at dusk, connected by a soft glowing line of light. No people.
    motion_prompt: >-
      The camera moves slowly from the old pagoda to the modern towers as city lights switch on.
    camera: slow pan

  - id: s10
    beat: info
    lines:
      - text: "흔들리면서 버티는 이 나무 탑이 바로, 일본의 오층탑입니다."
        captions: ["흔들리면서 버티는", "이 나무 탑이 / 바로, 일본의 오층탑입니다"]
      - text: "여러분이라면 흔들리는 땅에 무엇을 지으셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 흔들리는 땅에 / 무엇을 지으셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 단풍 속 완성된 오층탑 앞에서 목수가 뿌듯하게 올려다본다 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      A completed elegant five-story wooden pagoda among red autumn maple trees at golden hour, the carpenter standing at
      its base looking up proudly, arms folded. No other people.
    characters: [carpenter]
    motion_prompt: >-
      Maple leaves drift down; he looks up at the pagoda with a proud smile as the camera pulls back.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          Close-up of the carpenter in front of the pagoda looking straight at the viewer with a warm curious smile, one
          hand open toward the viewer as if asking a question. No other people.
        characters: [carpenter]
        motion_prompt: >-
          He looks at the camera, tilts his head with a curious smile and opens one hand toward the viewer as if asking.
        camera: slow push in

sources:
  - "Web Japan(일본 외무성 홍보) NIPPONIA No.33 — Five-story Pagodas: Why Can't Earthquakes Knock Them Down? (상자처럼 층을 포갠 구조라 층이 따로 움직일 수 있음, 바닥부터 꼭대기까지 이어진 굵은 가운데 기둥이 빗장처럼 미끄러지는 층을 가운데로 되돌림, 기둥은 거꾸로 선 진자처럼 조금 흔들리며 지진의 힘을 상쇄, 버드나무처럼 흔들리며 견딤, 현대 고층 건물도 비슷한 전략 사용) — https://web-japan.org/nipponia/nipponia33/en/topic/index02.html"
  - "Nakahara 외(다케나카 공무점), 'Earthquake Response of Ancient Five-Story Pagoda Structure of Horyu-ji Temple in Japan', 세계지진공학회의 논문 — 각 층이 독립된 틀로 서로 움직일 수 있음, 가운데 기둥이 구조 전체를 묶는 볼트처럼 층 사이 어긋남을 억제하고 부딪힘으로 흔들림을 줄임, 나무 이음새의 미끄러짐이 마찰로 흔들림을 흡수, 이 효과들이 합쳐져 단단한 틀 모델의 약 56%로 흔들림을 줄임 — https://www.iitk.ac.in/nicee/wcee/article/1229.pdf"

accuracy_notes:
  - "목수 인물과 감정, 대사는 설명용 재구성. 특정 인물이나 오층탑을 처음 만든 사람의 실제 이야기가 아니다."
  - "'눈앞이 캄캄했습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s02 '튼튼하게 박아도 버티기 힘들다'는 '단단한 틀보다 흔들림을 나누는 구조가 낫다'(논문의 단단한 틀 모델 비교)를 단순화한 연출."
  - "s08 가운데 기둥의 역할은 Web Japan(빗장·진자)과 논문(볼트처럼 묶고 부딪힘으로 감쇠)을 합쳐 '붙잡아 가운데로 되돌린다'로 단순화. 기둥이 아래에 매달려 있는지 등 탑마다 다른 세부는 쓰지 않는다."
  - "'한 번도 지진에 무너진 적이 없다' 같은 말은 근거를 확인하지 않아 쓰지 않는다. 탑의 나이·특정 절 이름도 대본에 쓰지 않는다."
  - "s09 '오늘날 높은 건물에도 이어진다'는 Web Japan의 '현대 고층 건물도 비슷한 전략' 기준. 특정 건물 이름(도쿄 스카이트리 등)은 쓰지 않는다."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷."
  - "화면 인물은 목수 한 명으로 연출."

youtube:
  titles:
    - 흔들려서 무너지지 않는 탑? 일본 오층탑의 비밀
    - 지진에 맞서지 않고 흔들려서 버틴 나무 탑
    - 탑 한가운데 숨은 기둥 하나의 놀라운 역할
  description: |-
    🌏 땅이 흔들릴 때마다 높은 탑이 무너질 판… 더 튼튼하게 박으면 될까요?

    일본 목수의 답은 '오히려 흔들리게 하기'였습니다 🏯
    층을 상자처럼 따로 포개 얹어 흔들림을 나눠 받고,
    못 없는 나무 이음새는 버드나무처럼 휘청이다 제자리로!

    그리고 탑 한가운데엔 바닥부터 꼭대기까지 굵은 기둥 하나 🪵
    미끄러지려는 층을 붙잡아 가운데로 되돌려 놓는답니다.
  comment_question: 여러분이라면 흔들리는 땅에 무엇을 지으셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [오층탑, 일본건축, 지진, 목조건축, 쇼츠]
