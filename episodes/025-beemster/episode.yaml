# 025 베임스터 간척지 — 풍차 43대로 호수를 퍼내 만든 네덜란드의 땅
id: "025"
slug: beemster
status: script_ok
working_title: 네덜란드 사람들은 어떻게 풍차로 호수를 땅으로 바꿨을까?
title_lines: ["풍차로 호수를", "퍼냈다고?"]
hook: 머리를 쥐어뜯었습니다
caption_keywords: [호수, 둑, 풍차, 계단처럼, 바둑판]

story:
  hero: 기술자
  reveal: [베임스터 간척지]

characters:
  - id: millwright
    name: 기술자
    name_en: Dutch millwright
    description: >-
      a lanky, energetic Dutch man in his 30s with shoulder-length light brown hair, a short pointed beard, rosy cheeks and
      bright blue eyes, wearing a dark wool doublet with a plain white collar, baggy knee breeches, wool stockings and
      wooden clogs, a wide-brimmed black hat, a folding wooden ruler in his belt
    note: 이야기 주인공. 풍차를 짓고 놓는 17세기 네덜란드의 풍차 기술자

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "네덜란드의 풍차 기술자는 머리를 쥐어뜯었습니다."
        captions: ["네덜란드의 / 풍차 기술자는", "머리를 쥐어뜯었습니다"]
      - text: "커다란 호수가 툭하면 넘쳐, 낮은 땅을 물바다로 만들었거든요."
        captions: ["커다란 호수가 / 툭하면 넘쳐", "낮은 땅을 / 물바다로 만들었거든요"]
    visual: 넘친 호숫물에 잠긴 낮은 들판, 나막신 신은 기술자가 물에 발목까지 잠겨 머리를 쥐어뜯는다
    image_prompt: >-
      A flat, low Dutch landscape under a grey sky, a huge lake overflowing onto the fields and a small farmhouse, the
      millwright in the center foreground standing ankle-deep in floodwater in wooden clogs, tugging at his hair in
      frustration.
    characters: [millwright]
    motion_prompt: >-
      Water laps over the fields; he tugs his hair and one of his clogs floats away.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of the millwright fishing his floating wooden clog out of the floodwater, looking out at the endless
          grey lake with a frustrated sigh. No other people.
        characters: [millwright]
        motion_prompt: >-
          He grabs the floating clog, shakes the water out and stares at the lake, sighing.
        camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "땅이 워낙 낮아서, 넘친 물을 흘려보낼 곳도 마땅치 않았죠."
        captions: ["땅이 워낙 낮아서", "넘친 물을 / 흘려보낼 곳도", "마땅치 않았죠"]
    visual: 단면도 — 낮은 들판과 호수가 같은 높이이고, 물이 빠질 곳이 없다
    image_prompt: >-
      Side cross-section of the low flat land: the lake and the flooded fields at nearly the same low level, with nowhere
      lower for the water to drain away to. Clean educational illustration, no labels, no text, no people.
    motion_prompt: >-
      Water spreads across the low fields and just sits there, with nowhere to flow.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "아예 이 호수를, 밭으로 바꿀 수는 없을까요?"
        captions: ["아예 이 호수를", "밭으로 / 바꿀 수는 없을까요?"]
    visual: 둑 위에 선 기술자가 바람에 돌아가는 풍차와 넓은 호수를 번갈아 보며 눈을 반짝인다
    image_prompt: >-
      The millwright standing on a grassy embankment beside the lake, his hat brim flapping in the strong wind, looking
      from a single spinning windmill to the wide lake with a spark of an idea in his eyes. No other people.
    characters: [millwright]
    motion_prompt: >-
      The windmill sails turn in the wind; he looks from them to the lake and slowly grins.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 기술자는 호수 둘레에 둑을 쌓고, 바깥에 빙 둘러 물길을 팠습니다."
        captions: ["그래서 기술자는", "호수 둘레에 / 둑을 쌓고", "바깥에 빙 둘러 / 물길을 팠습니다"]
    visual: 하늘에서 본 호수 — 호수를 빙 두른 긴 둑과 그 바깥의 둥근 물길
    image_prompt: >-
      Aerial view of a large lake completely surrounded by a long earthen dike, with a wide ring canal running all the way
      around outside the dike, the millwright tiny on the dike pointing along it. No other people.
    characters: [millwright]
    motion_prompt: >-
      The camera rises slowly to show the dike and the ring canal circling the whole lake.
    camera: slow rise

  - id: s05
    beat: solution
    lines:
      - text: "그리고 둑을 따라 풍차를, 무려 마흔세 대나 세웠죠."
        captions: ["그리고 둑을 따라 / 풍차를", "무려 마흔세 대나 / 세웠죠"]
    visual: 둑을 따라 수많은 풍차가 줄지어 서 있고, 기술자가 그 앞에서 두 팔을 벌린다
    image_prompt: >-
      A long row of many traditional Dutch drainage windmills standing along the dike around the lake, stretching into the
      distance, the millwright in the foreground spreading his arms proudly. No other people.
    characters: [millwright]
    motion_prompt: >-
      The sails of the windmills start turning one after another down the line; he spreads his arms.
    camera: slow pan along the row
    extra_clips:
      - image_prompt: >-
          Close-up of the millwright fitting a large wooden gear inside a windmill, sawdust in the air, the big wooden
          shaft turning slowly beside him. No other people.
        characters: [millwright]
        motion_prompt: >-
          He knocks the wooden gear into place with a mallet and the shaft begins to turn.
        camera: static

  - id: s06
    beat: solution
    lines:
      - text: "바람이 불면 풍차가 호숫물을 퍼 올려, 바깥 물길로 넘겼습니다."
        captions: ["바람이 불면", "풍차가 호숫물을 / 퍼 올려", "바깥 물길로 / 넘겼습니다"]
    visual: 풍차 아래 물레바퀴가 돌며 호숫물을 퍼 올려 둑 너머 물길로 쏟는다
    image_prompt: >-
      A windmill on the dike with its sails turning, and at its base a large wooden scoop wheel lifting water from the lake
      side and pouring it over into the ring canal on the other side. No other people.
    characters: [millwright]
    motion_prompt: >-
      The scoop wheel turns, lifting water up and splashing it over into the canal.
    camera: static

  - id: s07
    beat: twist
    lines:
      - text: "그런데 물을 4미터 넘게 올려야 하는데, 풍차 한 대로 될까요?"
        captions: ["그런데 물을 / 4미터 넘게 올려야 하는데", "풍차 한 대로 될까요?"]
    visual: 기술자가 키보다 훨씬 높은 둑을 올려다보며 자를 펼쳐 재 보고 고개를 젓는다
    image_prompt: >-
      The millwright at the bottom of the high dike holding up his folding ruler against it, looking up at how high the
      water must be lifted, shaking his head. No other people.
    characters: [millwright]
    motion_prompt: >-
      He unfolds the ruler all the way, looks up at the top of the dike and shakes his head.
    camera: slow tilt up

  - id: s08
    beat: resolve
    lines:
      - text: "그래서 풍차를 계단처럼 세워, 한 대가 올리면 다음 풍차가 이어받게 했죠."
        captions: ["그래서 풍차를 / 계단처럼 세워", "한 대가 올리면", "다음 풍차가 / 이어받게 했죠"]
      - text: "한 대에 약 1.5미터씩, 세 번에 나눠 올린 거죠."
        captions: ["한 대에 약 1.5미터씩", "세 번에 나눠 / 올린 거죠"]
    visual: 단면도 — 풍차 세 대가 계단처럼 높이를 달리해 서서 물을 단계별로 위로 넘긴다
    image_prompt: >-
      Side cross-section diagram: three windmills standing at rising levels like steps, each lifting water from a lower
      pool up into the next higher pool, from the lake bottom up to the ring canal at the top. Clean educational
      illustration, no labels, no text, no people.
    motion_prompt: >-
      Water is lifted up one step by the first mill, then the second, then the third, into the top canal.
    camera: static
    extra_clips:
      - image_prompt: >-
          Three windmills standing one behind another at different heights on terraced dikes, sails turning together, the
          millwright standing at the top level watching water flow from step to step. No other people.
        characters: [millwright]
        motion_prompt: >-
          The three mills turn together and water steps up from pool to pool; he nods with satisfaction.
        camera: slow pan

  - id: s09
    beat: info
    lines:
      - text: "마침내 호수는 바닥을 드러냈고, 그 자리엔 바둑판 같은 밭과 길이 생겼죠."
        captions: ["마침내 호수는 / 바닥을 드러냈고", "그 자리엔 / 바둑판 같은", "밭과 길이 생겼죠"]
    visual: 하늘에서 본 바둑판 모양의 초록 밭과 곧은 길·물길, 둘레를 두른 둑과 풍차
    image_prompt: >-
      Aerial view of a vast flat green polder laid out in a perfect grid of square fields, straight roads and canals,
      tree-lined farmhouses at the crossings, the ring dike and windmills circling it all. No people.
    motion_prompt: >-
      The camera glides slowly over the perfect grid of green fields and straight canals.
    camera: slow drone push forward

  - id: s10
    beat: info
    lines:
      - text: "풍차로 호수를 퍼내 만든 이 땅이 바로, 베임스터 간척지입니다."
        captions: ["풍차로 호수를 / 퍼내 만든", "이 땅이 바로", "베임스터 간척지입니다"]
      - text: "여러분이라면 물에 잠긴 땅을 어떻게 되찾으셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 / 물에 잠긴 땅을", "어떻게 되찾으셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 초록 밭 사이 길 위에서 기술자가 풍차들을 바라보며 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The millwright standing on a straight country road between green square fields at golden sunset, windmills turning
      along the dike in the distance, looking out with a proud smile. No other people.
    characters: [millwright]
    motion_prompt: >-
      He tips his hat and smiles; the camera slowly pulls back over the fields and windmills.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          Close-up of the millwright with windmills behind him, looking straight at the viewer with a warm curious smile,
          one hand open toward the viewer as if asking a question. No other people.
        characters: [millwright]
        motion_prompt: >-
          He looks at the camera, tilts his head with a curious smile and opens one hand toward the viewer as if asking.
        camera: slow push in

sources:
  - "UNESCO 세계유산 — Droogmakerij de Beemster (Beemster Polder) (17세기 초 베임스터 호수를 물을 빼 만든 간척지, 홍수가 잦던 낮은 지역, 1612년 5월 19일 마름(네덜란드어 설명), 풍차 43대(건설 당시 약 40대)로 물을 퍼냄, 밭·길·물길·둑·마을이 정사각형 단위의 반듯한 기하학 배치) — https://whc.unesco.org/en/list/899"
  - "Canon van Nederland(네덜란드 역사 캐논) — The Beemster Polder (1607년 허가, 1612년 호수가 마름, 호수 둘레 38km 둑과 그 옆 환형 운하, 풍차 43대를 줄지어 세워 물을 단계적으로 들어 올림, 풍차 한 대가 약 1.5m, 전체 약 4.5m를 올림, 목수·풍차 기술자 레이흐바터가 풍차 건설·배치에 참여) — https://www.canonvannederland.nl/en/beemster"

accuracy_notes:
  - "기술자 인물과 감정, 대사는 설명용 재구성. 실제로는 풍차 기술자 얀 레이흐바터 등이 참여한 큰 사업이었다 (Canon van Nederland). 대본은 이름 없이 '풍차 기술자'로 쓴다."
  - "'머리를 쥐어뜯었습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s01~s02 '호수가 넘쳐 낮은 땅을 물바다로'는 '홍수가 잦던 낮은 지역'(UNESCO)을 이야기로 푼 것."
  - "s05 풍차 수는 Canon·UNESCO 네덜란드어 설명의 43대 기준 (UNESCO 영어판은 약 40대)."
  - "s07~s08 '4미터 넘게', '한 대에 약 1.5미터씩, 세 번'은 Canon van Nederland 기준 (전체 약 4.5m)."
  - "둑 길이(38km)는 Canon 기준이지만 대본에는 '긴 둑'으로만 쓴다. 해수면보다 몇 m 낮은지는 쓰지 않는다."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷."
  - "화면 인물은 기술자 한 명으로 연출."

youtube:
  titles:
    - 풍차로 호수를 퍼냈다고? 네덜란드 땅의 비밀
    - 풍차 43대가 줄지어 물을 넘겨준 이유
    - 호수가 바둑판 밭으로! 400년 전 네덜란드의 대작전
  description: |-
    🌊 툭하면 넘치는 커다란 호수… 차라리 이 호수를 밭으로 바꿔 버린다면?

    네덜란드 풍차 기술자의 작전은 이랬습니다 🛠️
    호수 둘레에 둑을 쌓고, 둑을 따라 풍차를 무려 43대나!
    그런데 물을 4미터 넘게 올려야 해서, 풍차를 계단처럼 줄지어 한 대씩 넘겨줬죠 🌬️

    마침내 드러난 호수 바닥엔 바둑판처럼 반듯한 밭이 🟩 지금은 세계유산이 되었답니다.
  comment_question: 여러분이라면 물에 잠긴 땅을 어떻게 되찾으셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [네덜란드, 풍차, 간척지, 세계유산, 쇼츠]
