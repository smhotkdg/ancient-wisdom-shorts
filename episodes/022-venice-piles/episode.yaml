# 022 베네치아 — 진흙 갯벌에 나무 기둥 숲을 박아 세운 도시
id: "022"
slug: venice-piles
status: script_ok
working_title: 베네치아 사람들은 어떻게 진흙 갯벌 위에 도시를 세웠을까?
title_lines: ["진흙 갯벌 위에", "도시를 세웠다고?"]
hook: 골머리를 앓았습니다
caption_keywords: [진흙, 나무 기둥, 나무판, 산소, 곰팡이]

story:
  hero: 목수
  reveal: [베네치아]

characters:
  - id: carpenter
    name: 목수
    name_en: medieval Italian carpenter
    description: >-
      a burly, good-natured Italian man in his 40s with curly dark hair, a short salt-and-pepper beard, sun-tanned skin
      and rolled-up sleeves, wearing a loose cream linen shirt, a brown leather apron and knee-length brown trousers,
      bare muddy feet, a big wooden mallet in hand
    note: 이야기 주인공. 바닷가 갯벌 섬에 집을 지어야 하는 목수

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "바닷가 갯벌 섬의 목수는 골머리를 앓았습니다."
        captions: ["바닷가 갯벌 섬의 목수는 / 골머리를 앓았습니다"]
      - text: "집 지을 땅이, 발이 푹푹 빠지는 진흙뿐이었거든요."
        captions: ["집 지을 땅이", "발이 푹푹 빠지는 / 진흙뿐이었거든요"]
    visual: 석호의 진흙 갯벌, 목수가 무릎까지 진흙에 빠진 채 머리를 감싸 쥔다
    image_prompt: >-
      A wide shallow lagoon with muddy marsh islands and reeds under a hazy sky, the carpenter in the center foreground
      sunk knee-deep in soft grey mud, holding his head with both hands in dismay, his mallet sinking beside him.
    characters: [carpenter]
    motion_prompt: >-
      He tries to pull one leg out, the mud squelches and he sinks deeper, clutching his head.
    camera: static
    sfx_volume: 0
    extra_clips:
      - image_prompt: >-
          Close-up of the carpenter's bare foot sinking into soft grey lagoon mud with a slurp, bubbles rising, his
          frustrated face looking down at it. No other people.
        characters: [carpenter]
        motion_prompt: >-
          His foot sinks with a slurp and bubbles rise; he groans and pulls it out with a pop.
        camera: slow push in
        sfx_volume: 0

  - id: s02
    beat: problem
    lines:
      - text: "돌집을 그냥 올렸다간, 진흙 속으로 가라앉을 판이었죠."
        captions: ["돌집을 그냥 올렸다간", "진흙 속으로 / 가라앉을 판이었죠"]
    visual: 갯벌 위 작은 돌집 모형이 기울며 진흙 속으로 가라앉는다
    image_prompt: >-
      The carpenter crouching beside a small stone house model he placed on the mud, watching in horror as it tilts and
      slowly sinks into the soft grey mud. No other people.
    characters: [carpenter]
    motion_prompt: >-
      The little stone house tilts and slowly sinks into the mud; his eyes go wide.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "물렁한 갯벌 위에, 어떻게 무거운 집을 세울 수 있을까요?"
        captions: ["물렁한 갯벌 위에", "어떻게 무거운 집을 / 세울 수 있을까요?"]
    visual: 해 질 녘 목수가 갯벌에 꽂힌 막대 하나가 꼿꼿이 서 있는 것을 보고 눈을 반짝인다
    image_prompt: >-
      At sunset on the lagoon shore, the carpenter sitting on an overturned boat, staring at a single wooden stake that
      stands firmly upright in the mud while everything else sinks, a spark of an idea in his eyes. No other people.
    characters: [carpenter]
    motion_prompt: >-
      He pushes the stake with his finger, it doesn't budge, and he slowly grins.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 목수는 길쭉한 나무 기둥을, 진흙 속에 빽빽하게 박아 넣었습니다."
        captions: ["그래서 목수는 / 길쭉한 나무 기둥을", "진흙 속에 / 빽빽하게 박아 넣었습니다"]
    visual: 목수가 큰 나무망치로 긴 나무 기둥을 진흙에 박고, 옆으로 기둥들이 빽빽이 줄지어 있다
    image_prompt: >-
      The carpenter standing on a small plank platform swinging a big wooden mallet to drive a long wooden pile into the
      lagoon mud, dozens of pile tops already packed tightly side by side around him like a forest of stumps.
      No other people.
    characters: [carpenter]
    motion_prompt: >-
      The mallet slams down and the pile sinks deeper into the mud; water splashes with each blow.
    camera: static
    extra_clips:
      - image_prompt: >-
          Side cross-section below the lagoon: a dense forest of long wooden piles driven straight down through soft mud
          into deeper firmer clay, water above. Clean educational illustration, no labels, no text, no people.
        motion_prompt: >-
          Piles slide down one after another through the mud, packing tightly together.
        camera: slow tilt down

  - id: s05
    beat: solution
    lines:
      - text: "그 위에 나무판을 깔고, 벽돌과 돌로 집을 올렸죠."
        captions: ["그 위에 나무판을 깔고", "벽돌과 돌로 / 집을 올렸죠"]
    visual: 기둥 머리 위에 두꺼운 나무판이 깔리고, 그 위로 벽돌집이 층층이 올라간다
    image_prompt: >-
      The carpenter laying thick wooden planks across the tops of the tightly packed piles to make a flat platform, and
      on top of it the first rows of a brick and stone house rising. No other people.
    characters: [carpenter]
    motion_prompt: >-
      He drops the last plank into place and the brick walls rise layer by layer above it.
    camera: slow tilt up

  - id: s06
    beat: solution
    lines:
      - text: "그러자 수많은 기둥이 함께 떠받쳐, 무거운 돌집도 끄떡없었습니다."
        captions: ["그러자 수많은 기둥이 / 함께 떠받쳐", "무거운 돌집도 / 끄떡없었습니다"]
    visual: 완성된 벽돌집 앞, 목수가 벽을 손으로 밀어 보며 웃는다
    image_prompt: >-
      A finished brick and stone house standing straight at the water's edge of a canal, the carpenter pushing on the
      wall with both hands to test it and laughing because it doesn't move at all. No other people.
    characters: [carpenter]
    motion_prompt: >-
      He shoves the wall hard, nothing moves, and he laughs and pats the bricks.
    camera: static
    sfx_volume: 0

  - id: s07
    beat: twist
    lines:
      - text: "그런데 나무는 물에 젖으면 썩기 마련인데, 이 기둥들은 괜찮을까요?"
        captions: ["그런데 나무는 / 물에 젖으면 썩기 마련인데", "이 기둥들은 / 괜찮을까요?"]
    visual: 목수가 물에 젖어 거무스름한 나무토막을 들고 걱정스러운 얼굴로 집 아래를 내려다본다
    image_prompt: >-
      The carpenter kneeling at the canal edge holding up a soggy, dark, rotting piece of wood in one hand, looking down
      worriedly into the water toward the foundations of his house. No other people.
    characters: [carpenter]
    motion_prompt: >-
      A piece crumbles off the rotten wood in his hand; he looks down into the water anxiously.
    camera: slow push in

  - id: s08
    beat: resolve
    lines:
      - text: "진흙과 짠물 속엔 산소가 거의 없어, 나무를 썩게 하는 곰팡이가 살지 못했죠."
        captions: ["진흙과 짠물 속엔 / 산소가 거의 없어", "나무를 썩게 하는 곰팡이가 / 살지 못했죠"]
      - text: "오히려 세월이 흐르며 광물이 스며들어, 기둥은 더 단단해졌죠."
        captions: ["오히려 세월이 흐르며 / 광물이 스며들어", "기둥은 / 더 단단해졌죠"]
    visual: 단면도 — 물 위 공기에는 곰팡이가 보이지만, 진흙 속 기둥 주변에는 산소 방울도 곰팡이도 없다
    image_prompt: >-
      Side cross-section: above the water line, a wooden post exposed to air with fuzzy fungus spots and bubbles of
      oxygen; below in the dark wet mud, the wooden piles clean and solid with no oxygen bubbles and no fungus.
      Clean educational illustration, no labels, no text, no people.
    motion_prompt: >-
      Fungus spreads on the post in the air while the piles deep in the mud stay clean and dark.
    camera: static
    extra_clips:
      - image_prompt: >-
          A magnified view of the wood grain of an old submerged pile, tiny glittering mineral particles slowly seeping
          into the fibers and making them look denser and harder. Clean educational illustration, no labels, no text,
          no people.
        motion_prompt: >-
          Glittering mineral particles seep slowly into the wood fibers, filling them in.
        camera: slow push in
        sfx_volume: 0

  - id: s09
    beat: info
    lines:
      - text: "다만 영원하진 않아서, 지금도 연구자들이 기둥을 살피죠."
        captions: ["다만 영원하진 않아서", "지금도 연구자들이 / 기둥을 살피죠"]
    visual: 오늘날 운하 옆 건물 아래 물속 나무 기둥 머리를 비추는 조명
    image_prompt: >-
      Present-day view under a Venetian canal building: an underwater lamp illuminating the old dark wooden pile heads
      beneath the stone foundation, small fish swimming by, green canal water. No people.
    motion_prompt: >-
      A beam of light slowly sweeps across the old pile heads under the water; small fish dart away.
    camera: slow pan
    sfx_volume: 0

  - id: s10
    beat: info
    lines:
      - text: "물 아래 나무 기둥 숲 위에 세운 이 도시가 바로, 베네치아입니다."
        captions: ["물 아래 / 나무 기둥 숲 위에 세운", "이 도시가 / 바로, 베네치아입니다"]
      - text: "여러분이라면 갯벌 위에 어떻게 집을 지으셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 갯벌 위에 / 어떻게 집을 지으셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 운하 위 곤돌라 옆, 목수가 완성된 도시를 바라보며 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      A beautiful lagoon city of colorful brick and stone buildings rising straight from the canals at golden sunset,
      the carpenter standing on a small wooden dock in the foreground looking proudly at the city. No other people.
    characters: [carpenter]
    motion_prompt: >-
      He puts his hands on his hips and smiles; the camera slowly pulls back over the canals at sunset.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          Close-up of the carpenter on the dock with the canal city behind him, looking straight at the viewer with a warm
          curious smile, one hand open toward the viewer as if asking a question. No other people.
        characters: [carpenter]
        motion_prompt: >-
          He looks at the camera, tilts his head with a warm curious smile and opens one hand toward the viewer as if asking.
        camera: slow push in

sources:
  - "브리태니커 — How Was Venice Built on Water? (석호의 진흙 둑·얕은 물이 외적을 막는 방벽, 부드러운 진흙과 점토 속에 나무 말뚝(주로 오리나무 등 단단한 나무)을 빽빽이 박음, 말뚝 위에 나무판을 깔고 벽돌·돌로 건물을 지음, 짠물 속 산소 부족이 나무의 부패를 늦추고 곰팡이를 막음, 세월이 지나며 광물이 스며 나무가 더 단단해짐) — https://www.britannica.com/technology/How-Was-Venice-Built-on-Water"
  - "CORILA(베네치아 석호 연구 컨소시엄) — The wooden foundations of the buildings in Venice (물에 늘 잠기고 산소가 거의 없는 환경이라 곤충·곰팡이 같은 부패 요인이 없음, 하지만 '진흙 속 말뚝은 영원하다'는 생각은 틀림 — 수백 년에 걸쳐 혐기성 세균이 천천히 분해할 수 있음, 산타 마리아 마조레 성당 등 기초 조사) — https://www.storico.corila.it/en/node/154"

accuracy_notes:
  - "목수 인물과 감정, 대사는 설명용 재구성. 베네치아는 오랜 세월 많은 사람이 지은 도시다."
  - "'골머리를 앓았습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s02 '그냥 올리면 가라앉는다', s06 '기둥이 함께 떠받친다'는 말뚝 기초가 필요한 이유를 단순화한 설명."
  - "말뚝 개수(성당 하나에 100만 개 등)는 확인하지 못해 쓰지 않는다. 나무 종류도 대본에 쓰지 않는다."
  - "s08 산소 부족·곰팡이·광물로 단단해짐은 브리태니커 기준. '돌처럼 변했다(화석화)'고는 쓰지 않는다."
  - "s09 '영원하지 않다'는 CORILA 기준 (혐기성 세균에 의한 느린 분해, 기초 상태 조사)."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 말이며 이야기 대사가 아니다. s10-2는 그 줄을 위한, 주인공이 시청자에게 묻는 컷."
  - "화면 인물은 목수 한 명으로 연출."

youtube:
  titles:
    - 진흙 갯벌 위에 도시를 세웠다고? 베네치아의 비밀
    - 베네치아 아래엔 나무 기둥 숲이 있다
    - 물속 나무 기둥이 수백 년 동안 안 썩은 이유
  description: |-
    🌊 발이 푹푹 빠지는 진흙 갯벌뿐인데… 여기에 돌집을 짓는다고요?

    목수의 답은 '나무 기둥을 빽빽하게 박기'였습니다 🪵
    그 위에 나무판을 깔고, 그 위로 벽돌과 돌집을 쌓아 올렸죠.

    그런데 물에 젖은 나무는 썩지 않을까? 🤔
    진흙과 짠물 속엔 산소가 거의 없어 곰팡이가 못 살았답니다. 지금도 연구자들이 그 기둥을 지켜보고 있어요.
  comment_question: 여러분이라면 갯벌 위에 어떻게 집을 지으셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [베네치아, 이탈리아, 건축, 세계사, 쇼츠]
