          palm out at chest height in a gentle "what do you think?" gesture. Calm, warm, family-friendly mood. No other
          people.
        characters: [jj]
        motion_prompt: >-
          She smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "국립대한민국임시정부기념관 웹진, 회고록을 통해 본 여성 독립운동의 현황 (자금 모집을 위한 국내 잠입 1931년까지 6차례, 1920년 3월 첫 잠입은 법무총장 신규식의 지시, 연통제 이용, 백반물로 쓴 암호편지를 지니고 들어감, 3차 잠입 때 신의주에서 체포, 압록강 철교 검문에 걸렸으나 상하이 생활이 힘들어 친정으로 돌아가려던 길이라고 둘러대 위기를 넘김, 이동녕·김구 등 연로한 국무위원을 돌본 임시정부 '안주인') — https://www.nmkpg.go.kr/webzine/story/cn.do?rid=257"
  - "월간 독립기념관 2020년 4월호, 대한민국 임시정부 안살림꾼 정정화와 이를 도운 김의한 (첫 잠입 때 이륭양행 배편으로 단둥 도착, 신의주를 거쳐 서울, 자산가들이 만남을 꺼려 모금이 쉽지 않았음, 2001년 '8월의 독립운동가', 회고록 『녹두꽃』·『장강일기』) — https://www.i815.or.kr/upload/kr/magazine/magazine/40/post-425.html"
  - "매일노동뉴스 [독립운동가 열전 ⑯] 정정화 (여섯 차례 국내 잠입, 첫 잠입 때 이륭양행 배로 안동 도착, 서울에서 약 20일간 모금 뒤 4월 초 상하이 귀환, 3차 잠입 때 압록강 철교에서 체포) — https://www.labortoday.co.kr/news/articleView.html?idxno=158781"
  - "경향신문 (1900~1991, 10여 년 동안 자금 모금책·연락책, 여성은 감시를 덜 받는다는 점을 이용, 1982년 건국훈장 애족장) — https://www.khan.co.kr/article/201902161523001"
  - "아주경제 [임시정부의 맏며느리 수당 정정화②] (스물한 살 며느리, 상하이 도착 한 달쯤 뒤 임시정부 자금 부족을 알고 국내 잠입을 자청, 신규식이 밀사 임무를 줌) — https://www.ajunews.com/view/20180327080519601"

accuracy_notes:
  - "주인공은 실존 독립운동가 정정화(1900~1991), 1982년 건국훈장 애족장(경향신문). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'진땀을 뺐습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '스물한 살 며느리'는 아주경제 연재 제목 기준(1900년생, 1920년 망명). '쌀 살 돈조차 없었다'는 임시정부가 빈궁했다는 기념관 설명을 이야기로 푼 재구성이며, 빈 쌀독 화면은 연출이다."
  - "s02 '일본 경찰이 지키고'는 국경 감시를 이야기로 푼 표현이다."
  - "s04 '무역회사 배'는 첫 잠입 때의 이륭양행 배편(월간 독립기념관·매일노동뉴스). 매일노동뉴스는 압록강을 건널 때 최석순의 누이로 꾸몄다고 적는데, 대본은 '평범한 여인처럼'으로만 쓴다. 이륭양행 이름은 037편과 겹치지 않게 대본에 넣지 않는다."
  - "s05 백반물로 쓴 암호편지는 임시정부기념관 웹진 기준. 글씨를 드러내는 방법은 대본·화면에 넣지 않는다 (화면은 아무것도 안 쓰인 종이만)."
  - "s06 '스무 날 남짓' 모금은 매일노동뉴스(첫 잠입, 약 20일). 첫 잠입 때 모금이 쉽지 않아 일가의 도움을 받았다는 기록(월간 독립기념관)도 있어 '모였다'는 결과만 쓴다."
  - "s07~s08 압록강 철교 검문에서 '상하이 생활이 힘들어 친정에 가는 길'이라고 둘러댄 일은 임시정부기념관 웹진 기준. 몇 번째 잠입 때인지는 쓰지 않고 '한번은'으로 쓴다. 실제 말은 간접 화법으로만 옮겼다."
  - "3차 잠입 때 체포되어 고초를 겪은 일은 사실이지만 대본·화면에 넣지 않는다."
  - "s09 국내 잠입 6차례(1931년까지)는 임시정부기념관 웹진·매일노동뉴스 기준. 월간 독립기념관은 횟수 표기가 엇갈린다. 임시정부 살림(연로한 국무위원 수발)은 '했다고 합니다'로 쓴다. 공식 직책은 없었다(기념관 웹진)."
  - "s10 '임시정부의 안주인'은 임시정부기념관 웹진·경향신문 표현 기준."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 며느리 한 명 중심, s07에 경찰 한 명(뒤쪽), s09에 노인 두 명. 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

youtube:
  titles:
    - 쌀 살 돈도 없던 임시정부, 스물한 살 며느리가 국경을 넘었다
    - 하얀 종이 한 장으로 독립 자금을 모은 여인
    - 검문에 딱 걸렸을 때, 그녀가 한 말
