    characters: [jj]
    motion_prompt: >-
      Wind moves her skirt; she smiles calmly as the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the same young woman from the reference image, seen from the waist up in the middle
