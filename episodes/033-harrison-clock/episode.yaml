    수십 년을 고치고 또 고친 끝에 나온 손바닥만 한 시계, 두 달 항해 뒤 오차는 겨우 5초였답니다 🤯
  comment_question: 여러분이라면 바다 위에서 어떻게 길을 찾으셨을까요? 여러분의 생각이 궁금합니다.
