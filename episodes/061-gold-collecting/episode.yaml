sources:
  - "국가기록원 '기록으로 만나는 대한민국 — IMF 외환위기' (1997.11.21 IMF 자금 지원 요청 발표, 1997.12.3 IMF 210억 달러 구제금융 승인, 1998년 1월 KBS 금 모으기 캠페인으로 전국 확산, 3개월 동안 약 351만 명이 금 227톤 — 당시 18억 달러, 결혼반지·돌반지, 운동선수들의 금메달, 김수환 추기경의 금 십자가, 2004년 5월까지 갚기로 한 195억 달러를 2001.8.23 모두 갚아 약 3년 앞당김) — https://theme.archives.go.kr/next/koreaOfRecord/imf.do"
  - "한국민족문화대백과사전, 금모으기운동 (1997년 12월 새마을부녀회 '애국가락지 모으기' 제안, 1998년 1월 5일 KBS 방송으로 본격화, 4월 종결, 351만 명 참여, 약 227톤, 수출액 약 22억 달러, '제2의 국채보상운동') — https://encykorea.aks.ac.kr/Article/E0080908"
  - "뉴시스 2025-02-21 (1998년 1~4월, 약 227톤, 22억 달러 — 1997년 11월 가용 외환보유액 20억 달러보다 많았음) — https://www.newsis.com/view/NISX20250221_0003074649"

accuracy_notes:
  - "엄마·아이는 수많은 참여자의 모습을 한 가족으로 엮은 창작 인물이다. 감정·속마음·장면(뉴스, 식은 밥, 셔터 내린 가게, 장롱 속 빨간 상자, 떨리는 손, 은행 앞 줄)은 몰입을 위한 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물."
  - "'말문이 막혔습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 1997년 11월 IMF 자금 지원 요청·12월 구제금융 승인은 국가기록원 기준. '빚 갚을 달러가 바닥나'는 가용 외환보유액이 20억 달러 수준이었다는 뉴시스 서술을 쉽게 쓴 표현."
  - "s02 회사·가게가 어려워진 모습은 외환위기 시기의 일반적인 상황을 이야기로 푼 재구성이며 특정 통계를 말하지 않는다."
  - "s05 돌반지·결혼반지가 나온 것은 국가기록원 기준. '아이 첫 생일에 받은'은 돌반지의 뜻을 쉽게 쓴 것."
  - "s06 은행 앞 긴 줄은 '어린아이부터 노인까지 수백만 명이 줄을 서서 참여'(국가기록원)를 바탕으로 한 장면. 금을 받은 곳은 주택은행·농협 등 여러 은행."
  - "s07 결혼반지·금메달(운동선수)·금 십자가(김수환 추기경)는 국가기록원 기준. '몇 달 만에 351만 명'은 국가기록원(3개월)·백과사전(1월~4월) 기준."
  - "s08 약 227톤은 국가기록원·백과사전 공통. '2001년 예정보다 3년 일찍 갚았다'는 국가기록원(2004년 5월 예정 → 2001년 8월 23일 상환 완료, 약 3년 앞당김) 기준. 빚을 금으로 갚은 것이 아니라 온 나라의 노력으로 갚았다는 뜻으로 쓴다."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "이미지 + 음성만인 편 (media: images): 컷마다 확대·축소·이동(still_motion, focus) + 컷 사이 디졸브."
  - "화면 인물은 엄마 중심, s03·s06·s08에 아이, s06에 뒤쪽 줄 선 사람들(배경). 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

