# 036 조선말 큰사전 원고 — 사투리를 모아 우리말을 지킨 조선어학회 (독립운동가 편)
id: "036"
style: 3d-cartoon
slug: keun-sajeon
status: done
working_title: 일제강점기 학자들은 어떻게 사라져 가는 우리말을 지켰을까?
title_lines: ["사투리를 모아", "나라말을 지켰다고?"]
hook: 발을 동동 굴렀습니다
caption_keywords: [사라지고, 사전부터, 사투리, 2만 6천 장, 서울역 창고]

story:
  hero: 학자
  reveal: [조선말 큰사전, 큰사전]

characters:
  - id: scholar
    name: 국어학자
    name_en: Korean language scholar of the 1930s
    description: >-
      a slender, gentle Korean man in his early 40s with short neatly parted black hair, round black-rimmed glasses, a
      kind earnest face and a small mustache, wearing a light grey Western suit jacket over a white hanbok jeogori and
      dark trousers, a fountain pen clipped to his breast pocket, holding a bundle of handwritten manuscript pages
    note: 이야기 주인공. 1930년대 조선어학회에서 우리말 사전을 만들던 국어학자 (특정 한 사람이 아니라 학회 사람들을 한 인물로 그린다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "일제강점기 한 국어학자는 발을 동동 굴렀습니다."
        captions: ["일제강점기 한 국어학자는 / 발을 동동 굴렀습니다"]
      - text: "우리말을 못 쓰게 하는 바람에, 우리말이 하나둘 사라지고 있었거든요."
        captions: ["우리말을 못 쓰게 / 하는 바람에", "우리말이 하나둘 / 사라지고 있었거든요"]
    visual: 1930년대 서울 골목, 원고 뭉치를 든 학자가 바람에 흩날려 날아가는 한글 낱장들을 붙잡으려 발을 구른다
    image_prompt: >-
      A 1930s Seoul alley with old tiled-roof houses under a grey sky, the scholar seen from the knees up in the middle of
      the frame, clutching a bundle of manuscript pages to his chest while loose paper sheets blow away in the wind
      around him at waist height, his face anxious as he reaches for them. Plain grey sky above him. The paper sheets
      have no readable writing. No other people.
    characters: [scholar]
    motion_prompt: >-
      Loose sheets flutter away in the wind; he reaches for one, misses, and stamps his foot anxiously.
    camera: static

  - id: s02
    beat: problem
    lines:
      - text: "말을 지키려면, 낱말을 모두 모아 사전부터 만들어야 했죠."
        captions: ["말을 지키려면", "낱말을 모두 모아 / 사전부터 만들어야 했죠"]
    visual: 텅 빈 책장 앞, 학자가 빈 공책 한 권을 펼쳐 들고 굳은 결심을 한다
    image_prompt: >-
      A small study room with an almost empty wooden bookshelf, the scholar seen from the waist up in the middle of the
      frame, holding open a thick blank notebook with both hands and looking at it with firm determination. Plain wall
      above him. No other people.
    characters: [scholar]
    motion_prompt: >-
      He opens the blank notebook, runs his hand over the empty page and nods firmly.
    camera: slow push in

  - id: s03
    beat: question
    lines:
      - text: "그런데 전국 방방곡곡의 말을, 어떻게 다 모을까요?"
        captions: ["그런데 전국 / 방방곡곡의 말을", "어떻게 다 모을까요?"]
    visual: 벽에 걸린 한반도 지도 앞에서 학자가 팔짱을 끼고 골똘히 생각한다
    image_prompt: >-
      The scholar seen from the waist up in the middle of the frame, standing in front of a large old map of the Korean
      peninsula pinned on the wall at chest height, arms crossed, deep in thought. No text or labels on the map. Plain
      wall above the map. No other people.
    characters: [scholar]
    motion_prompt: >-
      He looks from the north to the south of the map, taps his chin, and his eyes light up.
    camera: static

  - id: s04
    beat: solution
    lines:
      - text: "그래서 학자는 방학에 고향 가는 학생들에게, 그 고장 사투리를 적어 오게 했습니다."
        captions: ["그래서 학자는 / 방학에 고향 가는", "학생들에게 / 그 고장 사투리를", "적어 오게 했습니다"]
    visual: 기차역 플랫폼에서 학자가 교복 입은 학생들에게 작은 수첩을 나눠 준다
    image_prompt: >-
      A 1930s railway station platform with an old steam train, the scholar in the middle of the frame handing out small
      pocket notebooks with a warm encouraging smile. The notebooks have no readable writing.
    characters: [scholar]
    extras: "two or three young students in 1930s school uniforms and caps behind him, taking the notebooks eagerly"
    motion_prompt: >-
      He hands out notebooks one by one; the students behind him bow and tuck them into their pockets as the train steams.
    camera: static

  - id: s05
    beat: solution
    lines:
      - text: "잡지에도 칸을 만들어, 전국의 독자들이 우리말을 보내오게 했죠."
        captions: ["잡지에도 칸을 만들어", "전국의 독자들이 / 우리말을 보내오게 했죠"]
    visual: 학회 사무실 책상 위로 전국에서 온 편지 봉투가 수북이 쌓이고, 학자가 봉투를 하나씩 뜯어 본다
    image_prompt: >-
      A busy 1930s office desk piled high with many letters and envelopes from all over the country, the scholar in the
      middle of the frame happily opening one envelope and reading the handwritten slip inside. No readable writing. No
      other people.
    characters: [scholar]
    motion_prompt: >-
      More envelopes slide onto the pile; he opens one, reads it and smiles broadly.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of the scholar's hands sorting small handwritten word cards into rows of wooden index boxes, cards
          piling up. No readable writing. No other people.
        characters: [scholar]
        motion_prompt: >-
          His hands flick through the cards and drop one more into its box.
        camera: macro static

  - id: s06
    beat: solution
    lines:
      - text: "그렇게 쌓인 원고가, 무려 2만 6천 장이 넘었습니다."
        captions: ["그렇게 쌓인 원고가", "무려 2만 6천 장이 / 넘었습니다"]
    visual: 원고지 더미가 학자 가슴 높이까지 쌓인 방, 학자가 그 옆에서 뿌듯하게 원고 더미를 쓰다듬는다
    image_prompt: >-
      A room filled with tall stacks of handwritten manuscript paper reaching up to chest height all around, the scholar
      seen from the knees up in the middle of the frame, resting one hand proudly on a stack and smiling. Plain wall above
      him. No readable writing. No other people.
    characters: [scholar]
    motion_prompt: >-
      He pats the tall stack of manuscripts and smiles; the camera slowly pulls back to show the many stacks.
    camera: slow pull back at eye level

  - id: s07
    beat: twist
    lines:
      - text: "하지만 일본 경찰이 학자들을 잡아가고, 원고까지 빼앗아 갔습니다. 사전은 이대로 끝났을까요?"
        captions: ["하지만 일본 경찰이 / 학자들을 잡아가고", "원고까지 빼앗아 갔습니다", "사전은 이대로 끝났을까요?"]
    visual: 텅 빈 사무실 바닥에 원고지 몇 장만 흩어져 있고, 학자가 무릎을 꿇고 한 장을 주워 든다
    image_prompt: >-
      The same office now nearly empty and dim, the tall manuscript stacks gone, only a few loose sheets scattered on the
      floor, the scholar kneeling in the middle of the frame, picking up one sheet with a heartbroken face.
    characters: [scholar]
    extras: "two uniformed Japanese policemen in the doorway behind him carrying away boxes of manuscripts, small and blurred"
    motion_prompt: >-
      He picks up the sheet and holds it to his chest; the policemen in the doorway carry the boxes away.
    camera: slow push in

  - id: s08
    beat: resolve
    lines:
      - text: "광복 뒤, 원고는 서울역 창고 구석에서 기적처럼 발견됐습니다."
        captions: ["광복 뒤 원고는", "서울역 창고 구석에서 / 기적처럼 발견됐습니다"]
    visual: 어둑한 창고 문이 열리며 빛이 들어오고, 먼지 쌓인 나무 상자 속 원고 뭉치를 학자가 떨리는 손으로 꺼낸다
    image_prompt: >-
      A dusty old railway freight warehouse, light streaming in through an opened door, the scholar seen from the waist up
      in the middle of the frame, lifting a bundle of yellowed manuscripts out of a dusty wooden crate with trembling hands
      and tearful joy. No readable writing. No other people.
    characters: [scholar]
    motion_prompt: >-
      Dust floats in the light; he lifts the bundle, holds it close and his eyes fill with tears of joy.
    camera: slow push in

  - id: s09
    beat: info
    lines:
      - text: "학자들은 그 원고로, 2년 뒤 마침내 첫 권을 펴냈죠."
        captions: ["학자들은 그 원고로", "2년 뒤 마침내 / 첫 권을 펴냈죠"]
    visual: 인쇄소에서 갓 나온 두꺼운 사전 첫 권을 받아 든 학자가 표지를 손으로 쓸어 본다
    image_prompt: >-
      A small print shop with an old printing press, the scholar seen from the waist up in the middle of the frame,
      holding a freshly printed thick dictionary volume with a plain dark cover and gently running his hand over it,
      smiling. No readable text on the cover. No other people.
    characters: [scholar]
    motion_prompt: >-
      He strokes the cover, opens the book slightly and smiles with deep relief.
    camera: static

  - id: s10
    beat: info
    lines:
      - text: "빼앗겼다 되찾은 이 원고가 바로, 조선말 큰사전 원고입니다."
        captions: ["빼앗겼다 되찾은 / 이 원고가", "바로, 조선말 큰사전 / 원고입니다"]
      - text: "여러분이라면 사라져 가는 우리말을 어떻게 지키셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 / 사라져 가는 우리말을", "어떻게 지키셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 햇살 드는 창가에서 학자가 원고 뭉치와 사전을 함께 안고 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The scholar seen from the knees up in the middle of the frame, standing by a sunlit window holding the bundle of
      old manuscripts and the new dictionary together in his arms, smiling warmly. Bright calm window light above him. No
      readable text. No other people.
    characters: [scholar]
    motion_prompt: >-
      He hugs the manuscripts and the dictionary a little closer and smiles; the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Close-up of the scholar by the sunlit window, looking straight at the viewer with a warm curious smile, one hand
          open toward the viewer as if asking a question. No other people.
        characters: [scholar]
        motion_prompt: >-
          He looks at the camera, tilts his head with a curious smile and opens one hand toward the viewer as if asking.
        camera: slow push in

sources:
  - "국가기록원 — 조선말 큰사전 편찬 원고 (조선어학회가 1929~1942년 13년 동안 작성한 원고 최종 수정본, 1942년 조선어학회 사건 증거물로 일본 경찰에 압수, 1945년 9월 서울역 창고에서 발견, 원고지 약 2만 6천 5백여 장·17권, 국가지정기록물 제4호(2008)) — https://theme.archives.go.kr/next/onlineGallery/dictionary.do"
  - "문화체육관광부(국립중앙박물관) 보도자료 2007 — 조선말 큰 사전 초고본 전시 (1942년 조선어학회 사건으로 학자들이 고문받고 11명 징역형, 이윤재·한징 옥사, 압수된 원고 약 2만 6천5백 장이 1945년 9월 서울역 조선통운 창고에서 발견 — 재판 증거물로 운송된 뒤 방치, 1947년 10월 첫 권, 1957년 6권 완간) — https://www.mcst.go.kr/site/s_notice/press/pressView.jsp?pSeq=8911"
  - "한글학회 — 사전 편찬 자료 (보조: 1930년대 중반 중등학교 이상 학생들이 방학 귀향 때 방언 수집 — 만여 점, 잡지 『한글』에 방언 조사란을 두어 독자가 사투리를 보냄, 최현배의 『시골말 캐기 잡책』, '시골말 캐기 운동' 1935~1942년, 1945년 9월 8일 경성역 창고에서 원고 발견, 1947년 10월 9일 제1권) — https://hangeul.or.kr/homepage/boardMedia/193764"

accuracy_notes:
  - "주인공 '국어학자'는 특정 한 사람이 아니라 조선어학회 학자들(최현배·이윤재·이극로·정인승 등)을 한 인물로 그린 설명용 재구성이다. 감정·대사·장면도 재구성이다."
  - "조선어학회 사건으로 수난을 겪은 학자들은 독립유공자로 서훈되었다. 대본은 '학자들'로만 쓴다."
  - "'발을 동동 굴렀습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s01 '우리말을 못 쓰게 하는 바람에'는 1930년대 후반 학교 조선어 교육 축소·폐지 등 일제의 민족말살 정책을 쉽게 쓴 것. 구체적인 연도·법령은 대본에 쓰지 않는다."
  - "s04~s05 학생 방언 수집과 잡지 『한글』 방언 조사란은 한글학회 자료 기준."
  - "s06 '2만 6천 장이 넘었다'는 국가기록원·문체부 공통(약 2만 6천 5백 장)."
  - "s07 학자들이 겪은 고문·옥사(이윤재·한징)는 사실이지만 화면에는 넣지 않는다. 경찰은 원고 상자를 옮기는 모습으로만 작게 보여 준다."
  - "s08 서울역(당시 경성역) 조선통운 창고, 1945년 9월은 출처 공통 (한글학회는 9월 8일)."
  - "s09 '2년 뒤 첫 권'은 1947년 10월 제1권 기준. 전 6권 완간은 1957년."
  - "s10 정답 이름은 '조선말 큰사전 원고'(국가기록원 표기 '조선말 큰사전 편찬 원고'). 영화 〈말모이〉 이야기는 쓰지 않는다."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷."
  - "화면 인물은 학자 한 명 중심, s04에 학생 2~3명, s07에 경찰 2명."

youtube:
  titles:
    - 사투리를 모아 나라말을 지켰다고? 빼앗긴 원고의 기적
    - 일본 경찰이 빼앗아 간 원고, 서울역 창고에서 나오다
    - 2만 6천 장의 원고로 지켜 낸 우리말 이야기
  description: |-
    📚 우리말을 쓰지 못하게 하던 시절… 우리말이 하나둘 사라지고 있었습니다.

    한 국어학자의 결심, "낱말을 모두 모아 사전부터 만들자!" ✍️
    방학에 고향 가는 학생들은 사투리를 적어 오고, 전국의 독자들은 편지로 우리말을 보내왔죠 💌
    그렇게 쌓인 원고가 무려 2만 6천 장! 그런데 일본 경찰이 원고를 빼앗아 갔다는데요…

    광복 뒤, 서울역 창고 구석에서 벌어진 기적 🙏 오늘 우리가 쓰는 말 한마디가 조금 다르게 들릴 거예요.
  comment_question: 여러분이라면 사라져 가는 우리말을 어떻게 지키셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 조선어학회, 한글, 우리말, 쇼츠]
