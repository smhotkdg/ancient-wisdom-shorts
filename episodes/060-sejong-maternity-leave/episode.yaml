sources:
  - "국가기록원 '기록으로 보는 조선왕조실록' (세종 16년(1434) 4월 26일, 『세종실록』 64권: 서울·지방 여종이 아이를 배어 산달이 된 때와 산후 100일 안에는 일을 시키지 말라는 것은 이미 법으로 정했으나, 남편에게는 휴가를 주지 않아 산모를 돌보지 못해 목숨을 잃는 일까지 생김 → 이제부터 역에 종사하는 사람의 아내가 아이를 낳으면 남편도 30일 뒤에 일을 시키라 — 원문 '自今有役人之妻産兒, 則其夫滿三十日後役使') — https://theme.archives.go.kr/next/silloc/history.do?submenu=1"
  - "여성가족부 어린이 누리집 (출처 『조선왕조실록』: 1426년 세종이 여자 노비가 아이를 낳으면 100일 휴가를 주라고 명함, 만삭의 여종이 밭에서 일하는 모습을 보고 출산 전에도 한 달 휴가, 돌봐 줄 사람이 없어 갓난아이가 죽게 되자 아이를 낳은 여종의 남편에게도 한 달 휴가) — https://www.mogef.go.kr/kids/new/html/gap04.html"

accuracy_notes:
  - "여종·남편은 실록의 여러 기사를 한 가족의 이야기로 엮은 창작 인물이다. 임금은 세종(재위 1418~1450). 감정·속마음·장면(새벽닭, 아기 손, 울음소리, 달빛 아래 잠든 밤, 미역국)은 몰입을 위한 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 세종의 이름을 밝히지 않는다."
  - "'눈앞이 캄캄했습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01~s03 '낳은 지 며칠 안 돼 다시 일하러'는 100일 휴가가 새로 생기기 전의 처지를 이야기로 푼 것. 그 전 휴가 일수(흔히 7일로 소개됨)는 이번에 공공기관 자료로 확인하지 못해 대본에 넣지 않는다."
  - "s04 '사정이 궁궐까지 닿았다'는 이야기 표현이다."
  - "s05 1426년 산후 100일 휴가 명은 여성가족부(실록 출처) 기준. '백 일을 쉬게 하라'는 명의 뜻을 옮긴 표현이며 실록 원문 인용이 아니다."
  - "s06 '처음으로 마음 놓고 잠들었다'는 재구성이다."
  - "s07 만삭의 여종이 일하는 것을 보고 출산 전 한 달 휴가를 준 일은 여성가족부 기준. 1434년 실록 기사도 '산달'과 '산후 100일'에 일을 시키지 말라고 적는다."
  - "s08 남편이 쉬지 못해 산모를 돌보지 못하고 목숨을 잃는 일까지 생겼다는 것은 1434년 실록(국가기록원)·여성가족부 기준. 대본은 '위험해지는 일'로 부드럽게 쓴다."
  - "s09 1434년 남편 30일(한 달) 휴가는 국가기록원 실록 원문 기준. 대상은 '역에 종사하는 사람의 아내'가 아이를 낳은 경우. '600년 전'은 1426~1434년 기준 대략값, '노비 아빠의 출산휴가'는 오늘날 말로 쉽게 쓴 표현. 미역국 화면은 연출."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀, 여종이 묻는다)."
  - "이미지 + 음성만인 편 (media: images): Grok 영상 없이 장면 이미지와 추가 이미지 컷(extra_clips 의 image_prompt)을 컷마다 확대·축소·이동(still_motion, focus)하고 컷 사이를 짧게 디졸브해 잇는다."
  - "화면 인물은 여종 중심, s04·s05·s10은 임금, s09는 남편과 여종 두 사람. 배경 인물 없음. 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

youtube:
  titles:
    - 600년 전 조선에 '아빠 출산휴가'가 있었다고?
    - 아기를 두고 일하러 가던 여종에게 생긴 일
    - 노비 엄마에게 백 일, 아빠에게 한 달을 준 임금
  description: |-
    👶 아기를 낳고 얼마 안 돼 다시 출근해야 한다면… 상상만 해도 눈앞이 캄캄하죠?

    새벽닭이 울면 젖도 다 못 물린 아기를 두고 일하러 나가야 했던 조선의 한 여종 😢
    "우리 아기, 배고파 울고 있진 않을까?"
