# 060 세종 — 노비 엄마에게 백 일, 아빠에게도 한 달: 600년 전 출산휴가 (이미지 + 음성만, 실사)
# 2026-11-24 사용자: 이미지만이니 이야기가 더 몰입감 있게 — 엄마의 하루를 따라가는 장면·속마음·작은 디테일(아기 손, 울음, 미역국)
id: "060"
style: photoreal
media: images            # 2026-11-24 사용자: Grok 영상 없이 이미지와 TTS 만으로 만든다 (컷마다 확대·이동 효과)
slug: sejong-maternity-leave
status: script_ok
working_title: 600년 전 조선에도 출산휴가가 있었다? 그것도 노비에게, 아빠에게까지
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["600년 전에", "아빠 출산휴가가?"]
hook: 눈앞이 캄캄했습니다
caption_keywords: [눈앞이 캄캄했습니다, 아기, 울음소리, 백 일, 한 달, 남편, 출산휴가, 600년]

story:
  hero: 여종
  reveal: [세종대왕]

characters:
  - id: mom
    name: 여종
    name_en: young Korean servant woman of the 1420s
    description: >-
      a slim Korean woman in her mid-20s with a gentle, tired but warm face, soft dark eyes, black hair pinned in a
      simple low bun with a plain wooden pin, wearing a faded off-white cotton jeogori and a long dark grey cotton
      skirt with a plain apron, straw sandals, work-roughened hands
    note: 이야기 주인공. 1420~30년대 관청에서 일하던 관비(여종) — 실록의 여러 기사를 한 사람의 이야기로 엮은 창작 인물
  - id: dad
    name: 남편
    name_en: young Korean laborer husband of the 1420s
    description: >-
      a sturdy Korean man in his late 20s with a kind, shy face, sun-tanned skin, short black hair tied in a small
      topknot under a plain cloth headband, wearing a plain undyed cotton jacket and trousers with straw sandals
    note: 여종의 남편 (창작 인물)
  - id: king
    name: 임금
    name_en: Joseon king of the 1420s
    description: >-
      a Korean man in his early 30s with a calm, thoughtful, kind face, gentle intelligent eyes and a short neat beard,
      wearing a deep red royal dragon robe with a round gold embroidered emblem on the chest and a black winged royal
      hat, seated or standing with quiet dignity
    note: 조선의 임금 (마지막 대사 전까지 이름을 밝히지 않는다, 실제 인물의 초상이 아닌 창작 인물)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "새벽닭이 울자, 조선의 한 여종은 눈앞이 캄캄했습니다."
        captions: ["새벽닭이 울자", "조선의 한 여종은 / 눈앞이 캄캄했습니다"]
