    visual: 1890년대 신문사 작업실, 청년이 원고 여러 장을 비교하며 어이없다는 듯 이마를 짚는다
    image_prompt: >-
      A cramped 1890s newspaper office in Seoul with a wooden desk piled with handwritten manuscript sheets and proof
