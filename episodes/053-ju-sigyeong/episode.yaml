sources:
  - "국립국어원, '한글'이라는 이름 (한글이라는 이름을 처음 붙여 사용한 사람은 주시경인 듯함, 양반 사대부는 한글을 '언문'이라 낮잡아 부름, 개화기에는 '정음'·'국문', 주시경이 '배달말글 몯음'·'조선어 강습원'을 '한글모'·'한글배곧'으로 고침, 1913년 9월 『아이들보이』에 '한글풀이' 난) — https://www.korean.go.kr/hangeul/another/001.html"
  - "주간경향 [우정 이야기] 우리말 체계화 '주시경 발자취' 우표 (1914년 7월 27일 만 37세 별세, 서울 여러 학교·강습소를 오가며 가르쳐 '주보따리' 별명, 1896년 독립신문 교정을 맡고 그해 신문사 안에 국문동식회를 꾸려 한글 표기 통일 연구, 『대한국어문법』 1906·『국어문법』 1910·『말의 소리』 1914, 『말모이』 편찬 참여) — https://weekly.khan.co.kr/article/202610140600051"
  - "경향신문 (''한글'이란 명칭은 주시경 선생이 지은 것으로 알려져 있다', '한글'이란 단어가 처음 나온 것은 1913년 3월 23일 배달말글몯음(조선언문회) 창립총회 기록 「한글모 죽보기」) — https://www.khan.co.kr/article/201406162121475/amp"
  - "서울시 미디어허브 (주시경은 한글을 '오직 하나뿐인 큰 글'이라고 말함) — https://mediahub.seoul.go.kr/archives/2012271"

accuracy_notes:
  - "주인공은 국어학자·교육자 주시경(1876~1914). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 이름과 '한글'이라는 말을 쓰지 않는다."
  - "독립유공자 서훈 내역은 이번에 확인하지 못해 대본에 '독립운동가'라는 말을 넣지 않았다."
  - "'말문이 막혔습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 1896년 독립신문 교정은 주간경향 기준. '언문'이라 낮춰 부른 것은 국립국어원 기준. '적는 법이 제각각'은 그가 표기 통일 연구 모임(국문동식회)을 꾸린 까닭을 이야기로 푼 표현이다."
  - "s02 '신문 읽기도 쉽지 않았다'는 재구성이다."
  - "s04 '적는 법을 맞추는 모임'은 국문동식회(1896, 주간경향). 이름은 대본에 넣지 않는다."
  - "s05 여러 학교·강습소를 오가며 가르쳐 '주보따리'라 불렸다는 것은 주간경향 기준. 별명은 이름이 드러나므로 마지막 대사에서만 쓴다."
  - "s06 1910년 뒤 '국어·국문'이 일본어·일본 글을 가리키게 된 당시 상황을 '나라 글이라 부를 수도 없게 됐다'로 쓴 이야기 표현이다."
  - "s07 '한글' 이름: 국립국어원은 '처음 붙여 사용한 사람은 주시경인 듯하다', 경향신문은 '주시경이 지은 것으로 알려져 있다'고 적는다. 첫 기록은 1913년(「한글모 죽보기」·『아이들보이』). '크고 하나뿐인 글'은 서울시 미디어허브가 전하는 주시경의 말 '오직 하나뿐인 큰 글'을 바탕으로 한다. 이름의 정확한 어원 풀이는 여러 설이 있어 대본은 이 뜻만 쓴다."
  - "s08 1914년 만 37세 별세(주간경향)를 '젊은 나이'로 쓴다. '제자들이 뜻을 이어 갔다'는 『말모이』 편찬과 뒤의 조선어학회 활동을 이야기로 줄인 표현이며 '했다고 합니다'로 쓴다. 화면은 사람 없는 방."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 청년 한 명 중심, s04에 동료 두 명, s05-2에 학생 2~3명(뒷모습). 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

