caption_keywords: [말문이 막혔습니다, 언문, 제각각, 교정, 책 보따리, 나라 글, 새 이름, 하나뿐인 글]

story:
  hero: 청년
  reveal: [한글, 주시경, 주보따리]

characters:
  - id: youth
    name: 청년
