    1896년 서울, 신문사의 한 청년은 말문이 막혔습니다 😵 같은 말도 사람마다 제멋대로 적었거든요!
    그래서 책 보따리를 들고 이 학교 저 학교를 뛰어다니기 시작합니다 🎒💨
