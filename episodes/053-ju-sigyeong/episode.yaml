# 053 주시경 — 보따리를 들고 학교를 뛰어다니며 우리 글에 '한글'이라는 이름을 붙인 청년 (독립운동가 편, 실사)
id: "053"
style: photoreal
slug: ju-sigyeong
status: done
working_title: "'나라 글'이라 부를 수도 없게 된 우리 글, 한 청년은 어떻게 지켰을까?"
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["이름을 빼앗긴 글에", "새 이름을 붙였다고?"]
