      ink stains on his fingertips, often carrying a bulging cloth bundle of books tied with a knot
    note: 이야기 주인공. 1890년대~1914년 서울의 국어 연구자·교사, 우리 글에 '한글'이라는 이름을 붙인 것으로 알려진 인물 (마지막 대사 전까지 이름과 '한글'이라는 말을 쓰지 않는다)

scenes:
  - id: s01
    beat: hook
