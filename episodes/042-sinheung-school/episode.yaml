# 042 신흥무관학교 — 전 재산을 팔아 만주에 세운 '강습소' (이회영과 형제들, 독립운동가 편)
id: "042"
style: 3d-cartoon
slug: sinheung-school
status: done
working_title: 명문가 형제들은 왜 전 재산을 팔아 만주로 갔을까?
title_lines: ["명문가 6형제가", "전 재산을 팔았다고?"]
hook: 속이 터졌습니다
caption_keywords: [군대가 하나도, 일본 경찰의 눈, 재산을 모두, 압록강, 강습소]

story:
  hero: 선비
  reveal: [신흥무관학교, 이회영]

characters:
  - id: scholar
    name: 선비
    name_en: Korean scholar-gentleman of a noble family
    description: >-
      a slim, dignified Korean man in his 40s with a calm, resolute face, thoughtful dark eyes, a neat black mustache and
      short beard, hair tied in a topknot under a black horsehair gat hat, wearing a white long durumagi coat over a pale
      grey hanbok, simple leather shoes
    note: 이야기 주인공. 1910년 서울 명문가 출신으로 형제들과 만주로 간 독립운동가 (마지막 대사 전까지 이름과 학교 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1910년, 서울의 한 명문가 선비는 속이 터졌습니다."
        captions: ["1910년 서울의 / 한 명문가 선비는", "속이 터졌습니다"]
      - text: "나라를 빼앗겼는데, 맞서 싸울 군대가 하나도 없었거든요."
        captions: ["나라를 빼앗겼는데", "맞서 싸울 군대가 / 하나도 없었거든요"]
    visual: 큰 한옥 대문 앞, 선비가 주먹을 꽉 쥔 채 흐린 하늘 아래 서 있다
    image_prompt: >-
      The front gate of a large traditional Korean noble house with a tiled roof under a grey autumn sky, the scholar
      seen from the knees up in the middle of the frame, standing in front of the gate with both fists clenched at his
      sides and a pained, frustrated face. Wide plain grey sky above him. No other people.
    characters: [scholar]
    motion_prompt: >-
      Dry leaves blow past; he clenches his fists tighter and closes his eyes in frustration.
    camera: static

  - id: s02
    beat: problem
    lines:
      - text: "나라 안에선 일본 경찰의 눈 때문에, 군사를 기를 수도 없었죠."
        captions: ["나라 안에선 / 일본 경찰의 눈 때문에", "군사를 기를 수도 없었죠"]
    visual: 텅 빈 연무장에 녹슨 칼과 활이 쓰러져 있고, 담장 위로 순찰 그림자가 지나간다 (사람 없이)
    image_prompt: >-
      An empty old training yard with a broken wooden weapon rack, a few rusty old spears and bows lying in the dust, and
      the long shadow of a patrolling policeman with a peaked cap falling across the wall. Gloomy mood. No faces, no
      people visible.
    motion_prompt: >-
      The patrol shadow slides slowly along the wall past the empty training yard.
    camera: slow pan

  - id: s03
    beat: question
    lines:
      - text: "그렇다면 독립군을, 어디서 어떻게 키울까요?"
        captions: ["그렇다면 독립군을", "어디서 어떻게 키울까요?"]
    visual: 등잔불 아래 선비가 펼친 지도에서 압록강 너머 만주를 손가락으로 짚는다
    image_prompt: >-
      A study room at night lit by an oil lamp, the scholar seen from the waist up in the middle of the frame, leaning
      over an old map spread on a low table and pressing his finger on the land beyond a big river to the north, eyes
      determined. No readable text on the map. Plain wall above him. No other people.
    characters: [scholar]
    motion_prompt: >-
      His finger slides north across the river on the map and stops; he looks up with resolve.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 선비는 여섯 형제와 함께, 집안 재산을 모두 팔았습니다."
        captions: ["그래서 선비는 / 여섯 형제와 함께", "집안 재산을 / 모두 팔았습니다"]
    visual: 텅 빈 대청마루, 선비가 땅문서 꾸러미를 내려놓으며 결연히 고개를 끄덕이고 뒤로 형제 몇이 함께 선다
    image_prompt: >-
      The wide wooden main hall of the noble house now nearly empty of furniture, the scholar in the middle of the frame
      placing a bundle of old land deed papers on a low table with a firm nod. No readable text.
    characters: [scholar]
    extras: "two or three of his brothers in white hanbok and gat hats standing behind him, nodding solemnly, smaller and out of focus"
    motion_prompt: >-
      He sets the deeds down and nods firmly; the brothers behind him nod back in silence.
    camera: static

  - id: s05
    beat: solution
    lines:
      - text: "그리고 그해 겨울, 가족 60여 명이 마차를 나눠 타고 압록강을 건넜죠."
        captions: ["그리고 그해 겨울 / 가족 60여 명이", "마차를 나눠 타고 / 압록강을 건넜죠"]
    visual: 눈 덮인 압록강 위로 마차 행렬이 지나가고, 맨 앞 선비가 고삐를 잡고 북쪽을 바라본다
    image_prompt: >-
      A snowy winter landscape by a wide frozen river, the scholar in the foreground in the middle of the frame, wrapped
      in a padded coat, holding the reins of a horse-drawn cart and looking north with determination. Wide pale winter
      sky above him.
    characters: [scholar]
    extras: "a short line of a few more horse carts with bundled-up family members far behind him on the snowy riverbank, small and blurred"
    motion_prompt: >-
      Snow falls softly; he shakes the reins and the cart moves forward, the other carts following far behind.
    camera: slow tracking alongside

  - id: s06
    beat: solution
    lines:
      - text: "만주에 닿자, 그들은 가장 먼저 학교를 세웠습니다."
        captions: ["만주에 닿자", "그들은 가장 먼저 / 학교를 세웠습니다"]
    visual: 넓은 만주 들판에 지은 소박한 흙벽 건물 앞에서 선비가 문 위 빈 현판을 올려다본다
    image_prompt: >-
      A simple new earthen-walled school building with a thatched roof on a wide open Manchurian plain in early spring,
      the scholar seen from the knees up in the middle of the frame in front of it, looking at a blank wooden signboard
      over the door with quiet hope. No readable text. Wide sky above him. No other people.
    characters: [scholar]
    motion_prompt: >-
      Wind sweeps the plain; he looks at the building and a small hopeful smile appears.
    camera: slow pull back at eye level

  - id: s07
    beat: twist
    lines:
      - text: "그런데 학교 이름은, 군사 학교가 아니라 '강습소'였습니다. 왜일까요?"
        captions: ["그런데 학교 이름은", "군사 학교가 아니라 / '강습소'였습니다", "왜일까요?"]
    visual: 선비가 붓으로 현판을 쓰다 멈추고, 빙긋 웃으며 붓끝을 바라본다 (글자 없이)
    image_prompt: >-
      The scholar seen from the waist up in the middle of the frame, holding a large calligraphy brush over a long blank
      wooden board on a table, pausing with a sly knowing smile. No letters or characters visible. No other people.
    characters: [scholar]
    motion_prompt: >-
      He pauses with the brush raised over the board, then smiles knowingly.
    camera: static

  - id: s08
    beat: resolve
    lines:
      - text: "일본의 감시를 피하려고, 평범한 공부방처럼 보이게 한 거죠."
        captions: ["일본의 감시를 피하려고", "평범한 공부방처럼 / 보이게 한 거죠"]
    visual: 교실 안 선비가 책을 펴 들고 서 있고, 책상 아래에는 목총들이 숨겨져 있다
    image_prompt: >-
      A plain classroom with wooden desks and open books, the scholar in the middle of the frame standing at the front
      holding an open book like a teacher, while under the desks a row of wooden practice rifles is hidden in shadow. No
      readable text. No other people.
    characters: [scholar]
    motion_prompt: >-
      He turns a page calmly; the camera slowly tilts down to reveal the wooden rifles hidden under the desks.
    camera: slow tilt down

  - id: s09
    beat: info
    lines:
      - text: "그렇게 이곳에서 길러진 수천 명의 젊은이가, 독립군이 되어 싸웠습니다."
        captions: ["그렇게 이곳에서 길러진 / 수천 명의 젊은이가", "독립군이 되어 싸웠습니다"]
    visual: 아침 햇살 속 들판, 선비가 앞에 서서 지켜보고 뒤로 젊은 생도 몇이 줄지어 행진한다
    image_prompt: >-
      A wide open field at sunrise, the scholar in the middle of the frame standing with hands clasped behind his back,
      watching proudly.
    characters: [scholar]
    extras: "three young cadets in simple uniforms marching in a short line behind him, small and out of focus"
    motion_prompt: >-
      The cadets march past behind him in step; he watches with a proud, moved expression.
    camera: static

  - id: s10
    beat: info
    lines:
      - text: "독립군의 요람이 된 이 학교가 바로 신흥무관학교, 세운 이는 이회영과 형제들입니다."
        captions: ["독립군의 요람이 된 / 이 학교가", "바로 신흥무관학교", "세운 이는 / 이회영과 형제들입니다"]
      - text: "여러분이라면 전 재산을 걸고 독립을 준비하셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 / 전 재산을 걸고", "독립을 준비하셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 만주 들판의 학교 앞에서 선비가 조용히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The scholar seen from the knees up in the middle of the frame, standing in front of the simple school building on
      the Manchurian plain at golden sunset, hands folded in his sleeves, a calm, dignified smile. Wide sunset sky above
      him. No other people.
    characters: [scholar]
    motion_prompt: >-
      He looks at the school with a calm smile; the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the cartoon scholar character from the reference image, seen from the waist up in the
          middle of the frame, standing on the sunset plain in front of the school. He smiles warmly toward the viewer and
          holds one open palm out at chest height in a gentle "what do you think?" gesture. Cheerful, calm, family-friendly
          mood. No other people.
        characters: [scholar]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "서울특별시 내 손안에 서울 — 우리가 잘 몰랐던 독립운동가 '우당 이회영' (1910년 경술국치 뒤 12월 하순 6형제 일가족 60여 명이 12대의 마차에 나눠 타고 압록강을 건너 만주로 망명, 전 재산을 처분, 길림성 삼원보에 경학사와 신흥강습소 — 신흥무관학교의 전신, 1930년 폐교까지 2천여 명의 독립운동가 배출, 학비 무료, 1932년 체포돼 옥사, 1962년 건국훈장 독립장) — https://mediahub.seoul.go.kr/archives/842043"
  - "경향신문 2019 — 신흥무관학교 (1911년 이회영 6형제와 이상룡·김동삼·이동녕 등이 길림성 서간도에 세움, 처음 이름 '신흥강습소'는 일제의 감시를 피하기 위한 것, 1920년까지 독립군 간부 2천여 명·졸업생 약 3,500명, 졸업생들이 청산리 전투·서로군정서·의열단·한국광복군에서 활동) — https://www.khan.co.kr/article/201903081106001"

accuracy_notes:
  - "주인공 '선비'는 실존 독립운동가 이회영(1867~1932). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 것. 실제로는 동생 이시영 등 6형제와 이상룡·김동삼·이동녕 등이 함께했다. 마지막 대사 전까지 이름과 학교 이름을 밝히지 않는다."
  - "'속이 터졌습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '맞서 싸울 군대가 없었다'는 1907년 대한제국 군대 해산 뒤의 상황을 쉽게 쓴 것."
  - "s05 '그해 겨울, 60여 명, 마차를 나눠 타고'는 서울시 기준(1910년 12월 하순, 12대의 마차). 재산 규모(현재 가치)는 근거가 없어 쓰지 않는다."
  - "s06 '가장 먼저 학교를 세움'은 1911년 경학사·신흥강습소 설립 기준."
  - "s07~s08 '강습소라는 이름으로 일제 감시를 피함'은 경향신문 기준."
  - "s08 책상 아래 목총은 '평범한 학교처럼 보이게 했다'는 뜻을 보여 주는 화면 연출이다."
  - "s09 졸업생 수는 출처마다 2천여 명(서울시)·약 3,500명(경향신문)이라 '수천 명'으로 쓴다. 전투 장면은 넣지 않고 행진 장면으로만 보여 준다."
  - "s10 '세운 이는 이회영과 형제들'은 이상룡 등 다른 설립자도 있었음을 줄인 표현."
  - "이회영 일가가 겪은 가난과 1932년 옥사는 사실이지만 대본·화면에 넣지 않는다."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면 인물은 선비 한 명 중심, s04에 형제 2~3명, s05에 멀리 마차 행렬, s09에 생도 3명."

