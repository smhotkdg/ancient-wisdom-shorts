sources:
  - "Korea Times 2024-07-11 (1977년 11월 파나마, 11연속 KO의 17세 엑토르 카라스키야와 WBA 슈퍼밴텀급 타이틀전, 2라운드에 네 번 다운되고 매번 일어남, 3라운드 KO승, 1974년 WBA·더 링 밴텀급 타이틀) — https://www.koreatimes.co.kr/amp/foreignaffairs/20240711/interview-boxers-epic-win-lays-groundwork-for-korea-panama-ties"
  - "브라보마이라이프(이투데이) (1977년 11월 27일 파나마 WBA 슈퍼밴텀급 초대 챔피언 결정전 — 상대 홈, 카라스키야 17세 11전 11KO승, 2라운드 네 차례 다운 뒤 3라운드 KO승, 무제한 다운제, 1974년 7월 3일 남아공 더반 아놀드 테일러에게 판정승, 중계 이어폰으로 어머니 목소리에 '엄마, 나 챔피언 먹었어') — https://bravo.etoday.co.kr/view/atc_view/6350"
  - "이투데이 2015-06-02 [나의 어머니] 홍수환이 말하는 '엄마' 황농선 (1964년 아버지 별세, 어머니가 44세에 7남매를 홀로 키움, 부평 미군 부대 안 스낵바, 아침마다 운동 가라고 깨움) — https://www.etoday.co.kr/news/view/1135371"

accuracy_notes:
  - "주인공은 실존 복서 홍수환(1950~). 어머니는 실존 인물 황농선을 바탕으로 했지만 얼굴·옷은 상상으로 그린 창작 인물. 상대 선수는 얼굴을 보이지 않는 실루엣으로만 그린다. 감정·장면은 설명용 재구성. 마지막 대사 전까지 이름을 밝히지 않는다."
  - "'눈앞이 캄캄했습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01~s02 1977년 11월 파나마, 2라운드 네 번 다운, 17세·11전 11KO, 상대 홈 경기는 Korea Times·브라보마이라이프 기준. '괴물'은 이야기 표현."
  - "s03 '이대로 쓰러지면 끝'은 이야기 표현이며, 당시 무제한 다운제(브라보마이라이프)였다."
  - "s05 '무엇이 그를 일으켜 세웠을까요?'는 이야기의 질문이며, 어머니가 그 이유였다는 본인 발언은 확인하지 않았다(어머니와 가족사를 보여 주는 재구성). 1964년 아버지 별세(당시 열네 살 — 1950년생 기준 한국 나이 어림), 어머니가 7남매를 홀로 키움, 스낵바, 아침마다 깨운 일은 이투데이 기준. 화면은 연출."
  - "s06~s07 3라운드 KO승·챔피언 등극은 Korea Times·브라보마이라이프 기준. 'WBA 슈퍼밴텀급 초대 챔피언'을 대본은 '세계 챔피언'으로 쓴다."
  - "s08 '엄마, 나 챔피언 먹었어'는 1974년 7월 3일 더반 타이틀전 뒤 중계 이어폰으로 어머니 목소리를 듣고 한 말(브라보마이라이프·이투데이). '3년 전'은 1974→1977."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 (CTA 미디엄 샷 틀)."
  - "화면에는 피·부상, 대회·방송사 로고, 글자를 넣지 않는다. 화면 인물은 청년 중심, s05·s08은 어머니, 관중은 얼굴이 흐린 배경. 이미지 + 음성만인 편, 실사, 화면 제목 없음."

