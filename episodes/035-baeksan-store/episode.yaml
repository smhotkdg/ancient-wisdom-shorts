# 035 백산상회 — 장사하는 척 독립운동 자금을 보낸 부산의 가게 (안희제)
id: "035"
slug: baeksan-store
status: script_ok
working_title: 일제 감시 속에서 독립운동 자금을 어떻게 보냈을까?
title_lines: ["장사하는 척", "독립자금을 보냈다고?"]
hook: 속이 터졌습니다
caption_keywords: [돈이 없어, 감시, 평범한 가게, 장부, 손해 본 돈]

story:
  hero: 상인
  reveal: [백산상회, 백산, 안희제]

characters:
  - id: merchant
    name: 상인
    name_en: young Korean merchant of the 1910s
    description: >-
      a slim, calm and determined Korean man in his early 30s with short neatly combed black hair, a thin mustache,
      steady thoughtful dark eyes and a gentle face, wearing a white hanbok jeogori with a dark grey vest (jokki) and a
      dark overcoat, round wire-rimmed glasses, a pencil tucked behind his ear and a thick account ledger under his arm
    note: 이야기 주인공. 1910년대 부산에서 무역 상회를 연 독립운동가 (마지막 대사 전까지 이름과 가게 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "부산의 한 젊은 상인은 속이 터졌습니다."
        captions: ["부산의 한 젊은 상인은 / 속이 터졌습니다"]
      - text: "나라를 빼앗겼는데, 독립운동가들은 늘 돈이 없어 발이 묶였거든요."
        captions: ["나라를 빼앗겼는데", "독립운동가들은 늘 / 돈이 없어 발이 묶였거든요"]
    visual: 1910년대 부산 항구가 내려다보이는 언덕길, 상인이 텅 빈 돈주머니를 쥐고 주먹을 꽉 쥔다
    image_prompt: >-
      A hillside street overlooking the 1910s Busan harbor with old ships and tiled roofs under a grey sky, the merchant
      seen from the knees up in the middle of the frame, holding an empty cloth money pouch in one hand and clenching the
      other fist in frustration. Wide plain sky above him. No other people.
    characters: [merchant]
    motion_prompt: >-
      He turns the empty pouch upside down, nothing falls out, and he clenches his fist with a frustrated sigh.
    camera: static

  - id: s02
    beat: problem
    lines:
      - text: "하지만 일본 경찰은, 돈이 어디로 가는지 샅샅이 지켜봤죠."
        captions: ["하지만 일본 경찰은", "돈이 어디로 가는지 / 샅샅이 지켜봤죠"]
    visual: 골목 모퉁이 담벼락 그림자 속, 제복 모자의 실루엣이 길을 지켜본다 (얼굴 없이)
    image_prompt: >-
      A narrow 1910s alley at dusk, a long dark shadow of a uniformed policeman with a peaked cap stretching across the
      wall and the cobblestones, watching the street; only the shadow is visible. Tense, quiet mood. No faces, no people
      visible.
    motion_prompt: >-
      The long shadow on the wall shifts slightly as if turning its head to watch the street.
    camera: slow push in

  - id: s03
    beat: question
    lines:
      - text: "감시를 피해 돈을 보낼 방법, 없을까요?"
        captions: ["감시를 피해 / 돈을 보낼 방법", "없을까요?"]
    visual: 등잔불 켠 방에서 상인이 주판을 앞에 두고 깊이 생각에 잠긴다
    image_prompt: >-
      A small traditional room at night lit by an oil lamp, the merchant seen from the waist up in the middle of the frame,
      sitting at a low wooden desk with an abacus in front of him, chin in hand, deep in thought. Plain paper sliding door
      above him. No other people.
    characters: [merchant]
    motion_prompt: >-
      The lamp flickers; he slides one abacus bead slowly, pauses, and his eyes sharpen with an idea.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 상인은 고향 땅을 팔아, 부산에 가게를 차렸습니다."
        captions: ["그래서 상인은 / 고향 땅을 팔아", "부산에 가게를 차렸습니다"]
    visual: 새로 연 2층 목조 상점 앞에서 상인이 이름 없는 빈 간판을 올려다보며 뿌듯해한다
    image_prompt: >-
      A newly opened two-story wooden trading store on a 1910s Busan street, stacked crates and rice sacks at the open
      front, a blank wooden signboard with no writing above the door, the merchant in the middle of the frame standing in
      front of the store with a quiet proud smile. No text anywhere. No other people.
    characters: [merchant]
    motion_prompt: >-
      He brushes dust off his coat, looks at the store and gives a small satisfied nod.
    camera: static

  - id: s05
    beat: solution
    lines:
      - text: "겉으론 곡식과 옷감, 해산물을 사고파는 평범한 가게였죠."
        captions: ["겉으론 곡식과 옷감", "해산물을 사고파는 / 평범한 가게였죠"]
    visual: 쌀자루·무명 옷감·말린 생선이 쌓인 가게 안, 상인이 손님에게 저울로 곡식을 달아 준다
    image_prompt: >-
      Inside the busy trading store with sacks of rice and grain, bolts of white cotton cloth and strings of dried fish,
      the merchant in the middle of the frame weighing grain on a hanging balance scale with a friendly smile.
    characters: [merchant]
    extras: "two customers in white hanbok waiting at the counter behind him, small and out of focus"
    motion_prompt: >-
      He pours grain onto the scale, checks the balance and smiles; the customers behind him chat quietly.
    camera: static

  - id: s06
    beat: solution
    lines:
      - text: "하지만 남은 돈은 몰래, 상하이의 임시정부로 흘러갔습니다."
        captions: ["하지만 남은 돈은 몰래", "상하이의 임시정부로 / 흘러갔습니다"]
    visual: 가게 뒷방에서 상인이 지폐 다발을 쌀자루 밑 상자에 조심스럽게 숨긴다
    image_prompt: >-
      A dim back room of the store, the merchant seen from the waist up in the middle of the frame, kneeling and carefully
      placing a bundle of paper money into a small wooden box hidden beneath a rice sack, glancing toward the door. No
      readable text. No other people.
    characters: [merchant]
    motion_prompt: >-
      He slips the bundle into the box, slides the rice sack over it and glances toward the door.
    camera: static
    extra_clips:
      - image_prompt: >-
          An old map of East Asia on parchment with a glowing dotted line travelling across the sea from the southern tip
          of the Korean peninsula to the city of Shanghai in China. No text, no labels, no people.
        motion_prompt: >-
          The glowing dotted line slowly travels across the sea toward Shanghai.
        camera: static

  - id: s07
    beat: twist
    lines:
      - text: "그런데 경찰이 장부를 뒤져도, 증거가 나오지 않았습니다. 왜일까요?"
        captions: ["그런데 경찰이 장부를 뒤져도", "증거가 나오지 않았습니다", "왜일까요?"]
    visual: 가게 계산대 앞, 차분하게 선 상인 뒤로 제복 경찰들이 장부를 뒤적이며 고개를 갸웃한다
    image_prompt: >-
      The store counter scattered with open account ledgers, the merchant in the middle of the frame standing perfectly
      calm with his hands folded behind his back, a faint knowing look.
    characters: [merchant]
    extras: "two uniformed Japanese policemen with peaked caps behind him, flipping through the ledgers and frowning in confusion"
    motion_prompt: >-
      The policemen flip pages and frown; he stays calm and still, hands behind his back.
    camera: slow push in

  - id: s08
    beat: resolve
    lines:
      - text: "보낸 돈은 장부에, 장사하다 손해 본 돈으로 적어 두었거든요."
        captions: ["보낸 돈은 장부에", "장사하다 손해 본 돈으로 / 적어 두었거든요"]
    visual: 장부 한 쪽을 가까이 — 붓으로 손해 칸에 줄을 긋는 상인의 손 (글자는 읽을 수 없게)
    image_prompt: >-
      Close-up of the merchant's hand writing with a brush in an old account ledger at lamp light, drawing a neat red line
      in a loss column, the ledger's characters blurred and unreadable. No readable text, no numbers.
    characters: [merchant]
    motion_prompt: >-
      The brush draws a red line in the ledger; his hand pauses, then closes the ledger calmly.
    camera: macro static

  - id: s09
    beat: info
    lines:
      - text: "가게는 대구, 서울, 만주까지 지점을 두고, 독립운동가들의 연락처가 되었죠."
        captions: ["가게는 대구, 서울, 만주까지 / 지점을 두고", "독립운동가들의 / 연락처가 되었죠"]
    visual: 지도 위로 부산에서 대구·서울·만주로 불빛이 하나씩 켜진다
    image_prompt: >-
      An old parchment map of the Korean peninsula and Manchuria with small warm lights appearing one by one, starting
      from Busan in the south, then Daegu, Seoul and further north into Manchuria, connected by thin glowing lines. No
      text, no labels, no people.
    motion_prompt: >-
      Lights blink on one by one from the south to the north, linked by thin glowing lines.
    camera: slow pan up the map

  - id: s10
    beat: info
    lines:
      - text: "장사로 독립을 도운 이 가게가 바로 백산상회, 그 주인은 독립운동가 안희제입니다."
        captions: ["장사로 독립을 도운 이 가게가", "바로 백산상회", "그 주인은 / 독립운동가 안희제입니다"]
      - text: "여러분이라면 감시 속에서 어떻게 독립을 도우셨을까요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 감시 속에서", "어떻게 독립을 도우셨을까요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 노을 진 항구를 배경으로 가게 앞에 선 상인이 조용히 미소 / 이어서 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The merchant seen from the knees up in the middle of the frame, standing in front of his store at golden sunset with
      Busan harbor and ships behind him, ledger under his arm, a quiet hopeful smile. Wide sunset sky above him. No text
      anywhere. No other people.
    characters: [merchant]
    motion_prompt: >-
      He looks toward the sea with a quiet smile; the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Close-up of the merchant in front of the sunset harbor, looking straight at the viewer with a warm curious
          smile, one hand open toward the viewer as if asking a question. No other people.
        characters: [merchant]
        motion_prompt: >-
          He looks at the camera, tilts his head with a curious smile and opens one hand toward the viewer as if asking.
        camera: slow push in

sources:
  - "한국민족문화대백과사전 — 백산무역주식회사 (1914년 9월 안희제가 부산에서 이유석·추한식 등과 백산상회 설립, 곡물·면포·해산물 판매 상회로 보이게 위장, 실제 목적은 독립운동 진영 연락과 자금 공급, 1919년 5월 주식회사로 개편, 대구·서울·원산·안동·봉천 등에 지점·연락사무소, 일본 경찰이 알고 수색·감금·고문·장부 검열, 결손은 독립운동자금 지원 때문, 1927년 해산) — https://encykorea.aks.ac.kr/Article/E0022150"
  - "한국민족문화대백과사전 — 안희제 (1885~1943, 호 백산, 1914년 백산상회로 국내외 독립운동단체 연락처 역할, 1919년 백산무역주식회사로 상해임시정부 독립운동 자금조달기관, 1933년 발해농장, 1962년 건국훈장 독립장) — https://encykorea.aks.ac.kr/Article/E0035125"
  - "서울신문 (2019) 손성진의 우리가 잘 모르는 독립운동가 — 안희제 (보조: 고향 논을 팔아 자금 마련, 곡물·면포·해산물 위탁 판매, 출자금 대부분을 상하이 임시정부 운영자금으로, 일제가 수색·고문·장부 검열을 했지만 증거를 잡지 못함 — 독립자금을 장부상 결손으로 꾸며 추적을 피함, 1928년 파산) — https://m.seoul.co.kr/news/2019/04/23/20190423027002"

accuracy_notes:
  - "주인공은 실존 독립운동가 안희제(1885~1943). 감정·대사·장면은 설명용 재구성이며, 얼굴·옷은 상상으로 그린 것. 실제로는 이유석·추한식 등 동업자와 영남 지주들이 함께했다. 마지막 대사 전까지 이름과 가게 이름(백산)을 밝히지 않는다."
  - "'속이 터졌습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '독립운동가들이 돈이 없어 발이 묶였다'는 한국민족문화대백과의 '경제 문제가 독립운동의 선결 과제라고 봄'을 이야기로 푼 재구성."
  - "s04 '고향 땅을 팔아'는 서울신문 기준. 설립은 1914년(한국민족문화대백과)."
  - "s06 상하이 임시정부는 1919년에 세워졌다. 그 전에는 국내외 독립운동단체의 연락처·자금원 역할이었고, 1919년 주식회사 개편 뒤 임시정부 자금조달기관이 되었다 (한국민족문화대백과). 대본은 시점을 압축했다."
  - "s07~s08 '장부를 뒤져도 증거가 없었다', '손해 본 돈으로 적음'은 서울신문(장부상 결손으로 꾸며 추적을 피함) 기준. 한국민족문화대백과는 '일본 경찰이 자금 공급처임을 알고 탄압했고, 결손은 독립자금 지원 때문'이라고 적는다."
  - "s09 지점은 대구·서울·원산·안동·봉천 (한국민족문화대백과). 안동·봉천은 만주 지역이라 '만주'로 쓴다."
  - "해산·파산 연도는 출처마다 1927년·1928년으로 달라 대본에 쓰지 않는다. 고문·투옥 등 탄압 장면은 화면에 넣지 않는다."
  - "s10 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s10-2는 그 줄을 위한 컷."
  - "화면 인물은 상인 한 명 중심, s05에 손님 2명, s07에 경찰 2명. s02 경찰은 그림자로만 표현."

youtube:
  titles:
    - 장사하는 척 독립자금을 보냈다고? 부산의 수상한 가게
    - 일본 경찰이 장부를 뒤져도 못 찾은 독립자금의 비밀
    - 쌀가게 장부 속에 숨긴 독립운동 이야기
  description: |-
    🇰🇷 나라를 빼앗긴 시절, 독립운동가들의 가장 큰 고민은… 돈이었습니다.

    부산의 한 젊은 상인은 고향 땅을 팔아 가게를 차렸어요 🏪
    겉으론 쌀·옷감·해산물을 파는 평범한 가게. 하지만 남은 돈은 몰래 상하이 임시정부로!
    일본 경찰이 장부를 뒤져도 증거가 안 나왔다는데요? 📒

    비밀은 장부의 '손해 본 돈' 칸 🤫 장사로 독립을 도운 이 가게, 그리고 그 주인의 이름은 영상 끝에서 확인하세요!
  comment_question: 여러분이라면 감시 속에서 어떻게 독립을 도우셨을까요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 독립운동가, 임시정부, 한국사, 쇼츠]
