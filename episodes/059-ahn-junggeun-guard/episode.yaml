# 059 안중근 — 감옥을 지키던 일본 헌병의 마음을 움직인 사형수, 마지막 여덟 글자 (누구나 아는 독립운동가 편, 실사)
id: "059"
style: photoreal
slug: ahn-junggeun-guard
status: script_ok
working_title: 사형수를 지키던 일본 헌병은 왜 평생 그를 기렸을까?
show_title: false        # 049부터 화면 제목 없음 (모바일 세이프 에어리어만 지킴, 2026-11-11 사용자)
title_lines: ["일본 헌병이", "평생 모신 글씨?"]
hook: 기가 막혔습니다
caption_keywords: [기가 막혔습니다, 사형수, 헌병, 글씨 한 점, 여덟 글자, 군인의 본분, "1980년"]

story:
  hero: 헌병
  reveal: [안중근]

characters:
  - id: guard
    name: 헌병
    name_en: young Japanese military policeman of 1910
    description: >-
      a young Japanese man in his mid-20s with a plain, honest face, short black hair under a peaked cap, earnest eyes,
      clean-shaven, wearing a dark 1910-era Japanese military police uniform with a high collar, a white armband and
      black boots
    note: 이야기 주인공(시점 인물). 1910년 뤼순 감옥에서 사형수의 공판정 왕래를 경호한 일본 헌병
  - id: prisoner
    name: 사형수
    name_en: Korean prisoner of 1910
    description: >-
      a Korean man about 30 with a calm, composed, dignified face, steady dark eyes, short black hair and a neat dark
      moustache, wearing a plain greyish-white cotton prison outfit, sitting very upright
    note: 1909년 하얼빈 의거 뒤 뤼순 감옥에 갇힌 독립운동가 (마지막 대사 전까지 이름을 밝히지 않는다)

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "1910년 뤼순 감옥, 한 일본 헌병은 기가 막혔습니다."
        captions: ["1910년 뤼순 감옥", "한 일본 헌병은 / 기가 막혔습니다"]
      - text: "일본의 거물을 쏜 조선인 사형수를, 곁에서 지키라는 명령이 떨어졌거든요."
        captions: ["일본의 거물을 쏜 / 조선인 사형수를", "곁에서 지키라는 / 명령이 떨어졌거든요"]
    visual: 붉은 벽돌 감옥 복도, 젊은 헌병이 명령서를 받아 들고 굳은 얼굴로 복도 끝 감방 쪽을 본다
    image_prompt: >-
      A long, dim red-brick prison corridor in 1910 with iron cell doors, the young military policeman seen from the
      waist up in the middle of the frame, holding a folded paper order and staring down the corridor toward a far cell
      with a stunned, uneasy face. No other people.
    characters: [guard]
    motion_prompt: >-
      He reads the order, swallows hard, and slowly looks down the long corridor toward the far cell.
    camera: slow push in at eye level

  - id: s02
    beat: problem
    lines:
      - text: "헌병에게 이 사형수는, 밉고도 두려운 사람이었죠."
        captions: ["헌병에게 이 사형수는", "밉고도 두려운 사람이었죠"]
    visual: 감방 창살 너머, 헌병이 경계하는 눈빛으로 안을 들여다본다 (사형수는 흐릿한 뒷모습)
    image_prompt: >-
      The young military policeman seen from the chest up in the middle of the frame, standing outside a cell door and
      looking in through the small barred window with a wary, hostile, slightly fearful look, his hand tense at his
      belt. Dim light. No other faces visible.
    characters: [guard]
    motion_prompt: >-
      He peers through the bars, narrows his eyes, and steps back half a pace, tense.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "그런데 날마다 곁에서 지켜본 헌병의 마음은, 어떻게 바뀌었을까요?"
        captions: ["그런데 날마다 곁에서 / 지켜본 헌병의 마음은", "어떻게 바뀌었을까요?"]
    visual: 헌병이 감방 앞에 서서 안쪽을 조용히 바라보며 표정이 조금씩 풀린다
    image_prompt: >-
      The young military policeman seen from the waist up in the middle of the frame, standing quietly beside a cell
      door in soft morning light from a high window, watching through the bars, his hard expression slowly softening
      into curiosity. No other faces visible.
    characters: [guard]
    motion_prompt: >-
      He keeps watching through the bars as his tight jaw slowly relaxes into a puzzled, curious look.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "사형수는 감옥에서도 늘 차분하게 책을 읽고, 붓으로 글씨를 썼습니다."
        captions: ["사형수는 감옥에서도 늘 / 차분하게 책을 읽고", "붓으로 글씨를 썼습니다"]
    visual: 감방 안 작은 책상, 사형수가 꼿꼿이 앉아 붓으로 한지에 큰 글씨를 쓴다 (글자 흐릿)
    image_prompt: >-
      Inside a plain prison cell with a small wooden desk under a high barred window, the prisoner seen from the waist
      up in the middle of the frame, sitting perfectly upright and writing large brush characters on a sheet of paper,
      his face calm and peaceful. The brush writing is soft and unreadable. No other people.
    characters: [prisoner]
    motion_prompt: >-
      He moves the brush in one smooth stroke, lifts it, and studies the paper calmly.
    camera: static
    extra_clips:
      - image_prompt: >-
          Close-up of a brush writing a large bold stroke on paper beside an ink stone on a small wooden desk in a cell,
          the stroke soft and unreadable. Only the hand is visible.
        characters: [prisoner]
        motion_prompt: >-
          The brush sweeps one bold stroke and lifts off the paper.
        camera: macro static

  - id: s05
    beat: solution
    lines:
      - text: "그래서 헌병은 조심스레 부탁했죠. 저에게도 글씨 한 점 써 주실 수 있겠습니까?"
        captions: ["그래서 헌병은 / 조심스레 부탁했죠", "저에게도 글씨 한 점 / 써 주실 수 있겠습니까?"]
    visual: 감방 문 앞, 헌병이 모자를 벗어 손에 들고 공손하게 고개를 숙여 말한다
    image_prompt: >-
      The young military policeman seen from the waist up in the middle of the frame, standing at the open cell door
      with his cap held in both hands, bowing his head slightly and speaking politely and shyly. Soft light from the
      cell window. No other faces visible.
    characters: [guard]
    motion_prompt: >-
      He removes his cap, bows slightly and speaks with a shy, respectful look.
    camera: static at eye level

  - id: s06
    beat: twist
    lines:
      - text: "그런데 며칠 뒤, 사형장으로 나가기 직전 사형수가 그 부탁을 떠올렸습니다."
        captions: ["그런데 며칠 뒤 / 사형장으로 나가기 직전", "사형수가 그 부탁을 / 떠올렸습니다"]
    visual: 이른 아침 감방, 흰 한복 차림의 사형수가 자리에서 일어나다 멈추고 헌병 쪽을 돌아본다
    image_prompt: >-
      Early morning in the prison cell, the prisoner, now dressed in plain white Korean clothes, seen from the waist up
      in the middle of the frame, rising from his seat and pausing, turning his head with a calm look as if remembering
      something. Pale light from the high window. No other people.
    characters: [prisoner]
    motion_prompt: >-
      He stands, pauses, and turns his head with a gentle look of remembering.
    camera: static

  - id: s07
    beat: resolve
    lines:
      - text: "그러자 단숨에 써 내려간 여덟 글자, 나라를 위해 몸 바침은 군인의 본분이라는 뜻이었죠."
        captions: ["그러자 단숨에 써 내려간 / 여덟 글자", "나라를 위해 몸 바침은 / 군인의 본분이라는 뜻이었죠"]
    visual: 사형수가 비단천에 단숨에 붓글씨를 쓰고, 헌병이 두 손으로 받아 든다 (글자 흐릿)
    image_prompt: >-
      The young military policeman seen from the waist up in the middle of the frame, receiving a long strip of silk
      with large brush calligraphy in both hands, looking down at it with deep, moved emotion, his eyes glistening. The
      calligraphy is soft and unreadable.
    characters: [guard]
    motion_prompt: >-
      He takes the silk strip carefully in both hands, looks at it, and bows his head deeply.
    camera: slow push in
    extra_clips:
      - image_prompt: >-
          Close-up of a brush writing a vertical line of large bold characters on a strip of pale silk in one swift
          movement, ink glistening, the characters soft and unreadable. Only the hand is visible.
        characters: [prisoner]
        motion_prompt: >-
          The brush races down the silk in one swift line and lifts away.
        camera: macro static

  - id: s08
    beat: info
    lines:
      - text: "헌병은 고향에 돌아가 평생 그를 기렸고, 1980년 그 가족이 이 글씨를 한국에 보냈다고 합니다."
        captions: ["헌병은 고향에 돌아가 / 평생 그를 기렸고", "1980년 그 가족이 / 이 글씨를 한국에 보냈다고 합니다"]
    visual: 일본 시골 집 다다미방, 나이 든 헌병(민간 옷)이 족자 앞에 조용히 합장하고 앉아 있다 (글씨 흐릿)
    image_prompt: >-
      A quiet tatami room of a rural Japanese house, the same man now middle-aged in a plain dark kimono, seen from the
      waist up in the middle of the frame, sitting before a hanging scroll of calligraphy and pressing his palms
      together in silent respect. The calligraphy is soft and unreadable. No other people.
    characters: [guard]
    motion_prompt: >-
      Incense smoke drifts upward; he bows his head slowly before the scroll.
    camera: slow push in

  - id: s09
    beat: info
    lines:
      - text: "일본 헌병의 마음까지 움직인 이 사형수가 바로, 안중근 의사입니다."
        captions: ["일본 헌병의 마음까지 / 움직인 이 사형수가", "바로, 안중근 의사입니다"]
      - text: "여러분이라면 마지막으로 어떤 글을 남기시겠어요? 여러분의 생각이 궁금합니다."
        captions: ["여러분이라면 마지막으로", "어떤 글을 남기시겠어요?", "여러분의 생각이 / 궁금합니다"]
        cta: true
    visual: 높은 창으로 빛이 드는 감방, 사형수가 흰 한복 차림으로 꼿꼿이 서서 잔잔히 미소 / 이어서 헌병이 시청자를 보며 궁금한 표정으로 묻는다
    image_prompt: >-
      The prisoner in plain white Korean clothes seen from the knees up in the middle of the frame, standing very
      straight in the cell as a beam of morning light falls across him from the high window, a calm, peaceful smile.
      No other people.
    characters: [prisoner]
    motion_prompt: >-
      The light slowly brightens around him; he stands calmly and smiles as the camera slowly pulls back at eye level.
    camera: slow pull back at eye level
    extra_clips:
      - image_prompt: >-
          Friendly medium shot of the same young military policeman from the reference image, seen from the waist up in
          the middle of the frame, standing in a sunlit prison corridor with his cap under one arm. He smiles warmly
          toward the viewer and holds one open palm out at chest height in a gentle "what do you think?" gesture. Calm,
          warm, family-friendly mood. No other people.
        characters: [guard]
        motion_prompt: >-
          He smiles toward the camera and opens one hand at chest height in a friendly asking gesture.
        camera: slow push in

sources:
  - "한국민족문화대백과사전, 안중근 유묵 (위국헌신군인본분: 1910년 3월 26일 여순 감옥에서 순국 직전 씀, 공판정 왕래 때 경호를 맡은 일본 헌병 지바(千葉十七) 간수에게 줌, 지바 사후 부인과 조카딸이 보관, 1980년 8월 23일 최서면을 통해 안중근의사숭모회에 기증, 안중근의사기념관 소장, 뜻 '나라를 위해 몸을 바침은 군인의 본분이다') — https://encykorea.aks.ac.kr/Article/E0035029"
  - "주간경향 (44) 안중근 의사 유묵 31점 보물 (며칠 전 지바가 휘호를 청함, 1910년 3월 26일 오전 9시 사형집행장으로 나가기 직전 급히 준비한 비단천에 단숨에 쓴 여덟 글자) — https://weekly.khan.co.kr/article/202207291416501"
  - "세계일보 (지바 도시치는 뤼순 감옥에서 안 의사를 감시한 간수, 고향으로 돌아가 여생 동안 안 의사를 추모, 미야기현 다이린지에 두 사람의 위패가 나란히 봉안) — https://www.segye.com/newsView/20260528504047"

accuracy_notes:
  - "사형수는 실존 독립운동가 안중근(1879~1910), 헌병은 실존 인물 지바 도시치. 감정·대사·장면은 설명용 재구성이며, 두 사람의 얼굴·옷은 상상으로 그린 창작 인물(실사 화풍이지만 실제 인물의 초상이 아님). 마지막 대사 전까지 안중근의 이름을 밝히지 않는다."
  - "'기가 막혔습니다'는 현대 화자의 연출이며 당시 기록이나 발언이 아니다."
  - "s01 '일본의 거물을 쏜'은 1909년 하얼빈 의거를 가리킨다. 이름(이토 히로부미)과 저격 장면은 대본·화면에 넣지 않는다. 지바는 공판정 왕래 경호(백과사전)·감시 간수(세계일보)로 소개된다."
  - "s02~s03 헌병의 처음 감정('밉고도 두려운')과 마음의 변화 과정은 기록이 확인되지 않은 재구성이다. 고향에서 평생 추모했다는 결과(세계일보)를 바탕으로 이야기를 꾸몄다."
  - "s04 감옥에서 많은 유묵을 남긴 것(주간경향 '유묵 31점')을 바탕으로 한 장면."
  - "s05 며칠 전 휘호를 청했다는 것은 주간경향 기준. 대사('글씨 한 점 써 주실 수 있겠습니까?')는 재구성이다."
  - "s06~s07 1910년 3월 26일 사형집행장으로 나가기 직전, 비단천에 단숨에 쓴 여덟 글자(위국헌신군인본분)는 주간경향·백과사전 기준. 사형 장면은 넣지 않는다. 화면의 흰 옷은 연출."
  - "s08 고향에서 평생 추모(세계일보), 1980년 8월 23일 유족 기증(백과사전). '한국에 보냈다'는 안중근의사숭모회 기증을 쉽게 쓴 표현."
  - "s09 마지막 줄(cta: true)은 시청자에게 건네는 질문이며 이야기 대사가 아니다. s09-2는 그 줄을 위한 컷 — 시점 인물인 헌병이 묻는다 (CTA 미디엄 샷 틀)."
  - "화면 인물은 헌병·사형수 두 사람 중심, 배경 인물 없음. 실사 편, 화면 제목 없음 (모바일 세이프 에어리어 적용)."

youtube:
  titles:
    - 사형수를 지키던 일본 헌병이 평생 모신 글씨
    - 사형장으로 가기 직전, 그가 써 준 여덟 글자
    - 일본 헌병의 마음까지 움직인 조선인, 누구일까?
  description: |-
    🖌️ 적국의 사형수를 지키던 일본 헌병이, 그 사형수를 평생 기렸다면 믿으시겠어요?

    1910년 뤼순 감옥, 젊은 일본 헌병은 '일본의 거물을 쏜 조선인'을 지키게 됩니다 😨
    그런데 날마다 곁에서 본 사형수는… 늘 차분히 책을 읽고 붓글씨를 쓰는 사람이었죠 📚
    조심스레 "글씨 한 점만…" 부탁했던 헌병. 그리고 사형장으로 가기 직전, 놀라운 일이 벌어집니다.

    70년 뒤 그 글씨가 한국으로 돌아온 사연까지 🇰🇷 우리 모두가 아는 그 이름, 영상 끝에서!
  comment_question: 여러분이라면 마지막으로 어떤 글을 남기시겠어요? 여러분의 생각이 궁금합니다.
  hashtags: [독립운동, 독립운동가, 유묵, 한국사, 쇼츠]
