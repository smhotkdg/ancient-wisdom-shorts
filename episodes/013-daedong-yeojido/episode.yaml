# 013 대동여지도 — 책처럼 접어 들고 다닌 6.7m 조선 지도
id: "013"
slug: daedong-yeojido
status: script_ok
working_title: 김정호는 어떻게 커다란 나라 지도를 들고 다니게 했을까?
title_lines: ["책처럼 접히는", "6.7m 지도라고?"]
hook: 혼이 쏙 빠졌습니다
caption_keywords: [지도, 스물두 층, 접어, 십 리, 나무판]

story:
  hero: 김정호
  reveal: [대동여지도]

characters:
  - id: kim
    name: 김정호
    name_en: Joseon mapmaker
    description: >-
      a wiry, determined Korean man in his 40s with a neat topknot under a black horsehair headband, a thin mustache and
      short goatee, ink-stained fingers, wearing a plain grey-white Joseon hanbok with rolled-up sleeves and a simple
      cloth belt, a brush tucked behind his ear (an imagined look, not a real portrait)
    note: 이야기 주인공. 나라 전체를 담은 지도를 만드는 조선 후기 지도 제작자

scenes:
  - id: s01
    beat: hook
    lines:
      - text: "조선의 지도꾼 김정호는 혼이 쏙 빠졌습니다."
        captions: ["조선의 지도꾼 김정호는 / 혼이 쏙 빠졌습니다"]
      - text: "온 나라를 자세히 담으려니, 지도가 집채만큼 커질 판이었거든요."
        captions: ["온 나라를 자세히 담으려니", "지도가 집채만큼 / 커질 판이었거든요"]
    visual: 방바닥과 벽을 다 덮은 거대한 종이 지도 한가운데, 붓을 든 김정호가 멍하니 서 있다
    image_prompt: >-
      A Joseon-era room whose entire floor is covered by one gigantic hand-drawn paper map of mountains and rivers that
      spills up the walls and out the door, the mapmaker standing in the middle with a brush in hand, mouth open, dazed.
      Map drawn with lines and colors only, no readable text.
    characters: [kim]
    motion_prompt: >-
      The mapmaker turns slowly, looking at the map spreading over floor and walls; the brush slips from his fingers.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          Close-up of the mapmaker on his knees at the edge of the enormous map, hands on his head, sheets of paper
          curling up around him, ink pots everywhere. No readable text.
        characters: [kim]
        motion_prompt: >-
          A breeze lifts the paper edges; he clutches his head and sighs, ink drips from his brush.
        camera: slow push in

  - id: s02
    beat: problem
    lines:
      - text: "하지만 이렇게 큰 지도는 펼칠 곳도 없고, 들고 다닐 수도 없었죠."
        captions: ["하지만 이렇게 큰 지도는 / 펼칠 곳도 없고", "들고 다닐 수도 / 없었죠"]
    visual: 김정호가 둘둘 만 거대한 지도를 등에 지고 산길에서 휘청인다
    image_prompt: >-
      The mapmaker on a narrow mountain path, staggering under a gigantic rolled-up paper map tied on his back, taller
      than he is, sweating, his straw sandals slipping. No other people.
    characters: [kim]
    motion_prompt: >-
      He wobbles under the huge roll, takes two shaky steps and nearly topples over, catching himself on a tree.
    camera: static

  - id: s03
    beat: question
    lines:
      - text: "자세함은 그대로 두고, 어떻게 손에 들고 다닐 수 있을까요?"
        captions: ["자세함은 그대로 두고", "어떻게 손에 들고 / 다닐 수 있을까요?"]
    visual: 등잔불 아래 김정호가 얇은 책 한 권을 들어 보며 골똘히 생각한다
    image_prompt: >-
      At night under an oil lamp, the mapmaker sitting on the floor holding up a small folded paper booklet, looking from
      it to the huge rolled map beside him, a spark of an idea in his eyes. No other people. No readable text.
    characters: [kim]
    motion_prompt: >-
      He flips the little booklet open and closed, glances at the big roll, and slowly smiles.
    camera: slow push in

  - id: s04
    beat: solution
    lines:
      - text: "그래서 김정호는 나라를 위에서 아래로, 스물두 층으로 잘랐습니다."
        captions: ["그래서 김정호는 / 나라를 위에서 아래로", "스물두 층으로 잘랐습니다"]
    visual: 한반도 모양 지도 위에 가로줄이 그어지며 위에서 아래로 여러 층으로 나뉜다
    image_prompt: >-
      Top view of a large paper map shaped like the Korean peninsula with mountains and rivers, the mapmaker drawing long
      horizontal guide lines across it with a ruler and brush, dividing it from north to south into many thin bands.
      No readable text.
    characters: [kim]
    motion_prompt: >-
      The brush glides along the ruler and one horizontal line after another divides the map into bands.
    camera: slow tilt down

  - id: s05
    beat: solution
    lines:
      - text: "그리고 한 층을 병풍처럼 착착 접어, 얇은 책 한 권으로 만들었죠."
        captions: ["그리고 한 층을 / 병풍처럼 착착 접어", "얇은 책 한 권으로 / 만들었죠"]
    visual: 길쭉한 지도 띠가 병풍처럼 지그재그로 접히며 얇은 책이 된다
    image_prompt: >-
      Close-up of the mapmaker's hands folding one long strip of the map back and forth like a folding screen (accordion
      fold) into a slim book with hard covers, more folded booklets stacked beside him. No readable text.
    characters: [kim]
    motion_prompt: >-
      The long map strip folds zigzag, fold after fold, into a slim book; he presses the cover shut.
    camera: static

  - id: s06
    beat: solution
    lines:
      - text: "필요한 고장만 꺼내 펼치면 되고, 모두 이으면 온 나라가 되는 지도였습니다."
        captions: ["필요한 고장만 / 꺼내 펼치면 되고", "모두 이으면 / 온 나라가 되는 지도였습니다"]
    visual: 김정호가 책 한 권만 꺼내 펼쳐 보고, 이어 바닥에 여러 권을 이어 펼쳐 한반도가 완성된다
    image_prompt: >-
      The mapmaker in a courtyard pulling one slim folded booklet from a cloth bundle and opening it like a fan to show a
      section of mountains and rivers, while behind him many booklets laid open in rows on the ground join together
      into one long map of the whole country. No other people. No readable text.
    characters: [kim]
    motion_prompt: >-
      He opens one booklet with a flick, then looks back as the rows of opened booklets line up into one whole map.
    camera: slow pull back
    extra_clips:
      - image_prompt: >-
          High top-down view of a stone courtyard where twenty-two opened folding booklets are laid edge to edge in rows,
          forming one tall map of the Korean peninsula, the mapmaker standing small at the bottom edge looking up the
          length of it. No readable text.
        characters: [kim]
        motion_prompt: >-
          The camera rises slowly from the bottom to the top of the long assembled map.
        camera: slow rise

  - id: s07
    beat: twist
    lines:
      - text: "그런데 이 지도만 보고, 고을과 고을 사이가 얼마나 먼지 어떻게 알까요?"
        captions: ["그런데 이 지도만 보고", "고을과 고을 사이가 / 얼마나 먼지 어떻게 알까요?"]
    visual: 길 위의 김정호가 펼친 지도와 멀리 보이는 고을을 번갈아 보며 고개를 갸웃
    image_prompt: >-
      The mapmaker standing at a fork in a country road holding an opened map booklet, looking from the map to a distant
      village beyond the hills, scratching his head. No other people. No readable text.
    characters: [kim]
    motion_prompt: >-
      He traces the road on the map with a finger, looks up at the faraway village and tilts his head.
    camera: static

  - id: s08
    beat: resolve
    lines:
      - text: "답은 길 위의 작은 점이었습니다. 십 리마다 점을 콕콕 찍어, 점만 세면 거리가 나왔죠."
        captions: ["답은 길 위의 / 작은 점이었습니다", "십 리마다 점을 콕콕 찍어", "점만 세면 / 거리가 나왔죠"]
    visual: 지도 속 길 위에 일정한 간격으로 점이 찍히고, 손가락이 점을 하나씩 짚어 센다
    image_prompt: >-
      Extreme close-up of a map booklet page: a winding road line with small dots placed at even intervals along it,
      the mapmaker's fingertip hopping from dot to dot, a tiny brush adding one more dot. No readable text.
    characters: [kim]
    motion_prompt: >-
      The brush taps a new dot onto the road, then his finger hops from dot to dot along the road, counting.
    camera: slow pan along the road

  - id: s09
    beat: info
    lines:
      - text: "게다가 나무판에 새겨 찍어 냈기에, 똑같은 지도를 여러 벌 만들 수 있었습니다."
        captions: ["게다가 나무판에 새겨 / 찍어 냈기에", "똑같은 지도를 / 여러 벌 만들 수 있었습니다"]
    visual: 김정호가 지도가 새겨진 나무판에 먹을 바르고 종이를 덮어 찍어 낸다
    image_prompt: >-
      The mapmaker in his workshop rolling ink over a large carved wooden printing block engraved with mountains, rivers
      and roads, then lifting a fresh printed sheet off it, a neat stack of identical printed sheets beside him.
      No other people. No readable text.
    characters: [kim]
    motion_prompt: >-
      He brushes ink across the carved block, lays paper on it, rubs, and peels off a crisp printed map.
    camera: static

  - id: s10
    beat: info
    lines:
      - text: "다 펼치면 사람 키의 네 배 가까운 이 지도가 바로, 대동여지도입니다."
        captions: ["다 펼치면 / 사람 키의 네 배 가까운", "이 지도가 / 바로, 대동여지도입니다"]
    visual: 높은 벽에 세로로 길게 이어 붙인 지도 앞에 선 김정호, 카메라가 빠지며 크기가 드러난다
    image_prompt: >-
      The mapmaker standing at the foot of a tall wall on which the whole map, joined from all the booklets, hangs
      vertically, almost four times his height, looking up at it with a proud smile. No other people. No readable text.
    characters: [kim]
    motion_prompt: >-
      He looks up proudly; the camera slowly tilts up the towering map from bottom to top.
    camera: slow tilt up

sources:
  - "문화체육관광부 — 국립중앙박물관 《대동여지도》 전시 (2026-02-12~2028-12-31, 우리나라를 남북 22층으로 나누어 각 층을 1권의 첩으로 만든 접이식(분첩절첩식) 지도, 모두 이으면 세로 약 6.7m·가로 약 3.8m, 목판 인쇄로 휴대 쉬움, 도로에 10리마다 점, 기호와 지도표, 김정호가 청구도·동여도·대동지지를 거쳐 집대성) — https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=65674"
  - "뉴시스 2026-02-12 — 국중박 '역사의 길'서 22첩 대동여지도 공개 (김정호 1861년 완성, 남북 22층 접이식 첩, 목판 인쇄로 휴대성·활용성을 높임, 펼치면 세로 6.7m·가로 3.8m) — https://www.newsis.com/view/NISX20260212_0003513504"

accuracy_notes:
  - "김정호는 실존 인물이지만, 감정·행동·대사는 설명용 재구성이다. 얼굴·복장은 상상한 모습 (전해지는 초상화 없음)."
  - "'혼이 쏙 빠졌습니다'는 현대 화자의 연출이며 당시 기록이 아니다."
  - "s01 '지도가 집채만큼 커질 판'은 큰 지도의 문제를 보여 주기 위한 연출. 김정호가 실제로 그런 지도를 먼저 그렸다는 기록을 말하는 것이 아니다."
  - "'백두산을 여러 번 올랐다', '옥에 갇혀 죽었다' 같은 설은 근거가 약해 쓰지 않는다."
  - "'사람 키의 네 배 가까운'은 세로 약 6.7m를 키 약 1.7m에 견준 표현."
  - "s09 '여러 벌'은 목판 인쇄 방식에서 나온 설명. 실제 찍은 부수는 쓰지 않는다."
  - "지도 그림은 글자 없이 선·색으로만 그린다 (실제 지도의 지명 글씨를 흉내 내지 않음)."
  - "화면 인물은 김정호 한 명으로 연출."

youtube:
  titles:
    - 펼치면 6.7m! 책처럼 접어 들고 다닌 조선 지도
    - 김정호는 왜 지도를 22권으로 잘랐을까?
    - 점만 세면 거리가 나오는 조선의 내비게이션
  description: |-
    🗺️ 온 나라를 자세히 그렸더니 지도가 집채만 해졌다면… 어떻게 들고 다닐까요?

    김정호의 답은 '잘라서 접기'였습니다 ✂️
    나라를 22층으로 나누고, 한 층씩 병풍처럼 착착 접어 얇은 책으로!
    길 위에는 십 리마다 점을 찍어, 점만 세면 거리가 나오게 했죠 📍

    다 이으면 세로 6.7m, 지금 국립중앙박물관에서 그 크기를 직접 볼 수 있답니다.
  comment_question: 여러분 동네를 한 권짜리 지도로 만든다면 꼭 넣고 싶은 장소는?
  hashtags: [대동여지도, 김정호, 조선, 한국사, 쇼츠]
