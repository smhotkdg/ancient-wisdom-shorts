# 에피소드 설정 — 형식은 docs/story-format.md
id: "{{ID}}"
slug: {{SLUG}}
status: draft            # draft → script_ok → voice_ok → conti_ok → assets_in → done
working_title: ""        # 예: 폼페이는 왜 길 한가운데 커다란 돌을 놓았을까?
title_lines: ["", ""]    # 화면 고정 제목 두 줄 (첫 줄 흰색, 둘째 줄 노란색)
hook: ""                 # 첫 문장의 반응어 (topics.md 에 기록)
caption_keywords: []     # 자막에서 노란색으로 강조할 단어 3~6개

# style: 3d-cartoon      # 이번 편만 화풍을 바꿀 때
# sfx_volume: 0.12       # 이번 편 Grok 효과음 크기 (0 = 제거)
# extra_tail_seconds: 0  # 마지막 여운 추가

story:                   # 스토리형 대본 — .claude/skills/shorts-story/SKILL.md
  hero: ""               # 주인공 역할 이름 (대본에 등장)
  reveal: []             # 마지막 대사 "이것이 바로 ○○입니다"에서 공개할 이름 — 앞부분·화면 제목에는 쓰지 않음

characters:
  - id: hero
    name: ""             # 한국어 이름 (콘티 표시용)
    name_en: ""          # 프롬프트에 들어가는 영어 이름
    description: ""      # 영어 외형 묘사: 나이대, 옷, 머리, 특징
    note: ""             # 한국어 메모

scenes:
  - id: s01
    beat: hook           # hook | problem | question | solution | twist | resolve | info
    source: grok         # grok (움직임) | still (정지 이미지 + 느린 줌)
    lines:
      - ""               # 대사. 자막을 직접 나누려면 {text: "...", captions: ["...", "... / ..."]}
      # 마지막 장면의 마지막 줄은 CTA: {text: "…? 댓글에 '…'! 신기했다면 좋아요 꾹!", cta: true}  (docs/story-format.md)
    visual: ""           # 장면 설명 (한국어)
    image_prompt: ""     # ChatGPT 장면 프롬프트 (영어, 화풍 문구는 자동으로 붙음)
    characters: [hero]   # 첫 번째가 주인공 — 콘티가 "주인공은 가운데" 구도 문장을 자동으로 붙인다
    # extras: "two or three tired farmers sighing"   # 배경 인물(선택) — 대사에 반응할 때만, 에피소드당 3장면 이하 (docs/scene-people.md)
    motion_prompt: ""    # Grok 동작 프롬프트 (영어, 한 가지 동작)
    camera: ""           # 예: slow push in / static / slow pan right
    # trim_start: 0.0    # 클립 앞부분 건너뛰기 (초)
    # sfx_volume: 0.12   # 이 장면만 효과음 크기
    # extra_clips:       # 6초를 넘는 장면 — 두 번째 클립 (images/s01-2.png → clips/s01-2.mp4)
    #   - image_prompt: ""
    #     characters: [hero]
    #     motion_prompt: ""
    #     camera: ""

sources: []              # "제목 — URL"
accuracy_notes: []       # 단정하지 않는 것, 재구성인 부분

youtube:
  titles: []             # 추천 제목 2~3개
  description: |-       # 재미있게: 이모지+궁금증 첫 줄 → 맛보기 2~4줄 → 오늘과 연결 (shorts-story 스킬)

  comment_question: ""   # 댓글 유도 질문 하나 (재구성 안내 문구는 자동으로 붙음)
  hashtags: []
